const POPUP_DATA = {
  'https://npcobserver.com/legislation/national-security-law/':{title:'National Security Law of the PRC (2015)',subtitle:'NPC Standing Committee · Enacted July 2015',nodal:'The National People\'s Congress Standing Committee, China\'s top legislature, passed the law. It is enforced through the National Security Commission and effectively every government ministry.',scope:'Defines "national security" to cover almost every sphere of life: politics, the military, the economy, culture, society, technology, the environment, nuclear matters, and natural resources. This broad definition is the legal root that nearly every other coercive law on this map grows from.',trigger:['Any transaction, investment, technology transfer, or foreign activity that the government judges to threaten any of these broadly defined areas','The government\'s power to review and intervene never expires and can be used at any time','There is no minimum size or threshold: even a small deal can be captured, and virtually every other coercive instrument cites this law as its legal basis'],action:['Requires the state to take "necessary measures" to identify and remove security risks across the economy, finance, and natural resources','Provides the legal foundation for nearly every other instrument on this map, including export controls, entity blacklists, and supply chain directives <span class="obs">(in practice)</span>','Grants the government sweeping power to intervene in any sector of the economy, without requiring court approval'],source:{name:'National Security Law — NPC Observer',url:'https://npcobserver.com/legislation/national-security-law/'}},
  'https://npcobserver.com/legislation/foreign-relations-law/':{title:'Foreign Relations Law of the PRC (2023)',subtitle:'NPC · Enacted June 2023',nodal:'Passed by China\'s national legislature, the National People\'s Congress. Carried out by the State Council (China\'s cabinet) and the Ministry of Foreign Affairs.',scope:'Gives China, for the first time, an explicit legal right to retaliate against any foreign actor it says has harmed its sovereignty, security, or development interests. Earlier retaliation was ad hoc; this law puts it into formal statute.',trigger:['A foreign government, organisation, or individual is judged to have harmed Chinese sovereignty, security, or development interests','A foreign country imposes export controls, investment restrictions, or technology bans affecting Chinese companies <span class="inf">(inferred)</span>','Allied countries coordinate policies aimed at reducing dependence on, or containing, China <span class="inf">(inferred)</span>'],action:['Allows the State Council to impose "countermeasures and restrictive measures" without specifying limits on type or severity','Provides the legal cover that later, more specific instruments, such as Decree 835 and the Unreliable Entity List, rely on','Makes retaliatory measures against foreign trade or technology restrictions presumptively lawful under Chinese law'],source:{name:'Foreign Relations Law — NPC Observer',url:'https://npcobserver.com/legislation/foreign-relations-law/'}},
  'https://npcobserver.com/legislation/anti-foreign-sanctions-law/':{title:'Anti-Foreign Sanctions Law of the PRC (2021)',subtitle:'NPC Standing Committee · Enacted June 2021',nodal:'Passed by the National People\'s Congress Standing Committee. Enforced jointly by the Ministry of Foreign Affairs and the Ministry of Commerce (MOFCOM).',scope:'Targets foreign individuals and organisations involved in imposing sanctions on Chinese citizens or companies. Simply complying with a foreign sanction, even where a company has little choice, can itself be treated as the offence, putting multinationals in a bind.',trigger:['A foreign government or organisation creates, decides on, or carries out sanctions against Chinese people or companies','A company complies with foreign sanctions in a way China judges harmful to its citizens or entities; compliance itself can trigger listing'],action:['Visa bans and entry restrictions; freezing of any China-based assets belonging to those listed','A total ban on any transaction with Chinese entities','Deportation of executives based in China','A right for Chinese parties to sue for damages in Chinese courts','No independent appeal; the only recourse is asking the Ministry of Foreign Affairs to reconsider'],source:{name:'Anti-Foreign Sanctions Law — NPC Observer',url:'https://npcobserver.com/legislation/anti-foreign-sanctions-law/'}},
  'https://npcobserver.com/legislation/foreign-trade-law/':{title:'Foreign Trade Law of the PRC (1994; revised 2004, 2016, 2022, 2026)',subtitle:'NPC · Enacted 1994 · Major WTO-accession rewrite 2004 · Amended 2016 and 2022 · Latest revision passed Dec 27, 2025, effective Mar 1, 2026',nodal:'Enacted by the National People\'s Congress. The Ministry of Commerce (MOFCOM) is the main body enforcing trade restrictions, licences, and retaliatory measures under it.',scope:'China\'s founding trade statute. It gives MOFCOM broad power to restrict trade on national security grounds, and separately allows retaliation against countries seen as putting up unfair trade barriers against China.',trigger:['MOFCOM determines a transaction affects national security or the public interest','A foreign country is seen as discriminating against Chinese exports, investment, or technology, which can trigger retaliation','Any transaction judged to harm China\'s broader "development interests" <span class="inf">(inferred)</span>','Since the 2026 revision: a foreign company or individual stopping "normal transactions" with Chinese companies, the same trigger language used in the Unreliable Entity List'],action:['Gives MOFCOM power to restrict or ban trade in any goods, technology, or service, with no time limit','The 2016 amendment allowed China to use trade restrictions offensively, not just defensively','The 2026 revision, the law\'s first major overhaul in over two decades, significantly expands the government\'s countermeasure powers and adds a mechanism to proactively assess trade policy threats','Serves as the legal foundation for the Technology Export Catalogue, licensing rules, and the Unreliable Entity List'],source:{name:'Foreign Trade Law — NPC Observer',url:'https://npcobserver.com/legislation/foreign-trade-law/'},source2:{name:'China Amends Foreign Trade Law to Expand Countermeasure Toolkit — Covington & Burling',url:'https://www.cov.com/en/news-and-insights/insights/2026/01/china-amends-foreign-trade-law-to-expand-countermeasure-toolkit'}},
  'https://npcobserver.com/legislation/export-control-law/':{title:'Export Control Law of the PRC (2020)',subtitle:'NPC Standing Committee · Effective December 1, 2020',nodal:'Passed by the National People\'s Congress Standing Committee. The Ministry of Commerce (MOFCOM) leads licensing decisions, Customs (GAC) enforces at the border, and the Ministry of State Security is also involved.',scope:'China\'s first comprehensive export control law, replacing earlier rules limited to non-proliferation goods (nuclear, chemical, biological, missile technology). Covers dual-use and military items, plus anything judged to affect "national security and national interests," a ground broad enough to reach well beyond proliferation. Also follows Chinese-origin components into products re-exported by other countries.',trigger:['Exporting any item on an official control list','Placing temporary controls on an item not yet listed, if judged a national security risk, without advance warning, for up to two years','A third country re-exporting a product with Chinese-origin controlled components','Another country restricting exports to China: the law lets Beijing retaliate against any country it judges to have "abused" export controls against it'],action:['Requires an export licence for every shipment; the government can refuse without giving a reason or allowing appeal','Requires a certificate confirming the end use of the goods, and China can later check how a foreign buyer actually used them','Wilful violations can bring up to 10 years in prison and fines of up to RMB 5 million (roughly $700,000)','Customs can seize cargo at the border without a court order'],source:{name:'Export Control Law — NPC Observer',url:'https://npcobserver.com/legislation/export-control-law/'}},
  'https://www.chinalawtranslate.com/en/datasecuritylaw/':{title:'Data Security Law of the PRC (2021)',subtitle:'NPC Standing Committee · Effective September 1, 2021',nodal:'Passed by the National People\'s Congress Standing Committee. The Cyberspace Administration of China (CAC) is the main regulator, with other agencies helping classify data by sector.',scope:['Covers all data processing that happens inside China, plus data processing outside China if judged to harm Chinese national security','Data is sorted into three tiers: general, "important," and core state data, each defined only in loose, qualitative terms rather than a precise list','"Important" data catalogues are drafted by sector regulators and provincial governments, giving each significant discretion over what counts in their own area','"Core state data" is classified by the central government alone, under a stricter management system, and its transfer abroad is effectively prohibited outright rather than merely reviewed'],trigger:['Sending "important" data outside China, which requires a mandatory government security check','A foreign law enforcement agency requesting data stored in China, this needs Chinese government approval first','Data processing outside China that is judged to harm Chinese national security'],action:['The government\'s security assessment can block a data transfer during review, or deny it outright','Penalties are tiered by severity: mishandling "important" data can bring fines from roughly RMB 100,000 up to RMB 10 million (about $1.4 million), while violations involving core state data start at RMB 2 million and can carry criminal liability for executives','The government can force deletion of illegally transferred data, including data already sitting abroad'],source:{name:'Data Security Law — China Law Translate',url:'https://www.chinalawtranslate.com/en/datasecuritylaw/'}},
  'https://www.gov.cn/xinwen/2016-11/07/content_5129723.htm':{title:'Cybersecurity Law of the PRC (2017)',subtitle:'NPC Standing Committee · Effective June 1, 2017',nodal:'Passed by the National People\'s Congress Standing Committee. The Cyberspace Administration of China (CAC) is the lead regulator; other agencies decide which operators count as running "critical" infrastructure.',scope:'Creates a special category for operators of Critical Information Infrastructure, covering telecoms, energy, finance, transport, water, healthcare, and defence. These operators must store their data inside China.',trigger:['A critical infrastructure operator wants to buy network equipment or services, a security check is required before purchase','A critical infrastructure operator wants to send personal or "important" data outside China'],action:['Foreign technology that fails the security check can be barred from an entire strategic sector at once','Critical infrastructure operators must store their data inside China','Network infrastructure must be built with interfaces allowing law enforcement access','Forms the legal basis for the Cybersecurity Review Measures and China\'s cross-border data transfer rules'],source:{name:'Cybersecurity Law — State Council / Xinhua',url:'https://www.gov.cn/xinwen/2016-11/07/content_5129723.htm'}},
  'https://picpolicy.mofcom.gov.cn/file/20241120/56691732080580306.pdf':{title:'Dual-Use Export Control Regulations (December 2024)',subtitle:'MOFCOM + GAC · Effective December 1, 2024',nodal:'The Ministry of Commerce (MOFCOM) issues export licences; Customs (GAC) enforces the rules at the border.',scope:'Covers roughly 700 items with both civilian and military uses. A catch-all clause lets regulators add any unlisted item if they suspect a military or weapons-related end use, and the rules follow Chinese-origin components even after they are built into products re-exported by other countries.',trigger:['Exporting any item on the controlled list; a separate licence is needed for each shipment and destination','Regulators invoking the catch-all clause on an unlisted item, with no advance notice required','The buyer is based in a country China considers adversarial, or is on China\'s own blacklist <span class="inf">(inferred)</span>'],action:['A licence is required for every shipment; it can be refused or cancelled without explanation','Exporters must certify the end use, and China can later check how a foreign buyer actually used the goods','Customs can detain and seize cargo at the border without a court order','Wilful violations can bring up to 10 years in prison'],source:{name:'Dual-Use Item Control List — MOFCOM Official',url:'https://picpolicy.mofcom.gov.cn/file/20241120/56691732080580306.pdf'},source2:{name:'China Dual-Use Export Control Regulation — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-dual-use-export-control-regulation/'}},
  'http://baike.taxrefund.com.cn/html/fg/2024/12/20241204103530-44471.html':{title:'MOFCOM Notice 2024 No. 46 — Critical Mineral Controls',subtitle:'MOFCOM + GAC · Ga/Ge licensing Aug 2023 · graphite Oct 2023 · antimony & superhard + US ban via Announcement No. 46, Dec 2024',nodal:'The Ministry of Commerce (MOFCOM) and Customs (GAC) jointly administer these controls.',scope:'Covers gallium, germanium, natural and synthetic graphite, antimony, and synthetic diamonds. China supplies roughly 99% of the world\'s primary gallium, 60% of germanium, and 65% of graphite, which is what makes these controls so powerful.',trigger:['Exporting gallium, germanium, graphite, antimony, or synthetic diamond products from China','The shipment is linked to weapons systems, advanced semiconductors, or other strategic manufacturing <span class="inf">(inferred)</span>','The buyer is in a country China considers adversarial <span class="inf">(inferred)</span>'],action:['A separate licence is required for every shipment; there are no multi-year or blanket licences','Applications can be refused without explanation, and processing can be dragged out indefinitely <span class="obs">(in practice)</span>','Once a licence is revoked, there is no meaningful way to challenge the decision'],source:{name:'MOFCOM Announcement No. 46 of 2024 — Official Text',url:'http://baike.taxrefund.com.cn/html/fg/2024/12/20241204103530-44471.html'},source2:{name:'Critical Mineral Export Bans — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-rare-earth-export-ban/'}},
  'https://www.hklaw.com/en/insights/publications/2025/04/china-imposes-export-controls-on-medium-and-heavy-rare-earth-materials':{title:'MOFCOM Announcement No. 18 (2025) — Medium & Heavy Rare Earth Controls',subtitle:'MOFCOM + GAC · Effective April 4, 2025',nodal:'The Ministry of Commerce (MOFCOM) and Customs (GAC) jointly administer these controls.',scope:'Covers seven heavy rare earth elements (terbium, dysprosium, samarium, gadolinium, lutetium, scandium, and yttrium), used in magnets, electronics, and defence equipment. China controls over 85% of the world\'s capacity to separate and refine these elements.',trigger:['Exporting any of the covered rare earth elements or their compounds from China','The buyer is applying for a defence, semiconductor, or other strategic manufacturing use and is considered adversarial <span class="inf">(inferred)</span>'],action:['A separate licence is required for every shipment, with detailed disclosure of the intended end use','Applications for defence or semiconductor uses face extra scrutiny and are often simply denied <span class="obs">(in practice)</span>','A licence can be revoked if goods are diverted, and fraudulent paperwork can lead to criminal charges'],source:{name:'China Imposes Controls on Medium & Heavy Rare Earths — Holland & Knight',url:'https://www.hklaw.com/en/insights/publications/2025/04/china-imposes-export-controls-on-medium-and-heavy-rare-earth-materials'},source2:{name:'China Rare Earth Export Controls — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-rare-earth-export-ban/'}},
  'https://aqygzj.mofcom.gov.cn/qdml/art/2025/art_fcbee9ec799840829ecd8a676ce8b23f.html':{title:'MOFCOM Announcement No. 57 (2025) — Expanded HREE Controls',subtitle:'MOFCOM · 2025',nodal:'The Ministry of Commerce (MOFCOM) and Customs (GAC) jointly administer these controls.',scope:'Adds five more heavy rare earth elements (holmium, erbium, thulium, europium, and ytterbium) to the licensing regime, along with the magnet alloys made from them. Combined with the April 2025 controls, virtually every commercially significant rare earth element is now licensed.',trigger:['Exporting any of these rare earth elements, their compounds, or the magnet alloys made from them'],action:['A separate export licence is required for every shipment','Controls now reach the finished magnet alloys too, closing a loophole where processed products had escaped the earlier rules','Together with the earlier 2024 and 2025 controls, China now controls licensing across the entire rare earth supply chain <span class="obs">(in practice)</span>'],source:{name:'Announcement No. 57 (2025) — MOFCOM Safety & Control Bureau',url:'https://aqygzj.mofcom.gov.cn/qdml/art/2025/art_fcbee9ec799840829ecd8a676ce8b23f.html'},source2:{name:'China Expands Rare Earth Export Controls — National Law Review',url:'https://natlawreview.com/article/china-expands-export-control-rare-earth-minerals-and-more'}},
  'https://www.moj.gov.cn/pub/sfbgw/flfggz/flfggzbmgz/200606/t20060607_144169.html':{title:'Dual-Use Import/Export Licence Measures (2026 Update)',subtitle:'MOFCOM + GAC · Effective January 1, 2026',nodal:'The Ministry of Commerce (MOFCOM) issues licences; Customs (GAC) enforces the rules at the border.',scope:'Applies to everyone trading controlled dual-use items: exporters, importers, agents, and end users. The 2026 update added roughly 80 to 85 new items, including electric vehicles and several more minerals and chemical precursors.',trigger:['Shipping any controlled dual-use item','A post-shipment audit flags a suspicious end use at the foreign buyer\'s premises','The annual list update adds a product that previously did not need a licence'],action:['A licence is required for every shipment, along with a certified end-use declaration','Refusing to cooperate with a post-shipment audit can get a company blacklisted','If a licence is revoked, supply is cut off immediately, including shipments already in progress, with no compensation'],source:{name:'Dual-Use Import/Export Licence Measures — Ministry of Justice',url:'https://www.moj.gov.cn/pub/sfbgw/flfggz/flfggzbmgz/200606/t20060607_144169.html'},source2:{name:'2026 Import/Export Licensing Updates — China Briefing',url:'https://www.china-briefing.com/news/china-import-export-licensing-2026-key-compliance-updates/'},source3:{name:'2026 Dual-Use Items and Technology Import-Export Licence Directory — MOFCOM Official',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_c03d1e511b2b486e829d68e8f1422aff.html'},source4:{name:'Export Licence Management Commodity Directory (2026) — MOFCOM Official',url:'https://www.mofcom.gov.cn/zcfb/dwmygl/art/2025/art_f7a611068b084ac9b14080a1d3d742db.html'},source5:{name:'Automatic Import Licence Management Commodity Directory (2026) — MOFCOM Official',url:'https://xkzj.mofcom.gov.cn/tzgg/art/2026/art_c000999c09eb4b84b66816bc113884fd.html'}},
  'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2020/art_1889a24134054b5b841134c3fba44654.html':{title:'Unreliable Entity List — MOFCOM Order No. 4 of 2020',subtitle:'MOFCOM · Effective September 2020',nodal:'The Ministry of Commerce (MOFCOM) chairs a multi-agency working group; other ministries handling security and foreign affairs are also involved.',scope:'Can apply to any foreign company, organisation, or individual in the world, with no minimum size or nationality requirement. As of late 2025, over 23 entities have been listed, mostly US defence contractors, Taiwanese aerospace firms, and foreign think tanks or NGOs.',trigger:['Interrupting or refusing normal business dealings with Chinese companies without what China considers a legitimate reason','Applying discriminatory measures against Chinese companies, organisations, or individuals','Actions judged to harm China\'s sovereignty, security, or development interests','Complying with foreign government sanctions targeting Chinese entities; this alone can count as "discriminatory" <span class="inf">(inferred)</span>'],action:['Authorities can restrict or prohibit import and export dealings with the listed entity, cutting off its trade with Chinese companies, and restrict or prohibit its investment in China (Article 10)','Executives and staff can face restricted entry into China, or have existing work permits or residence status restricted or revoked (Article 10)','Fines, and other measures authorities judge necessary, are also available under the same article (Article 10)','A listed entity can apply for removal after correcting the conduct that led to its listing (Article 13); there is no separate right of appeal against the listing itself'],source:{name:'Unreliable Entity List Regulations — MOFCOM English',url:'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2020/art_1889a24134054b5b841134c3fba44654.html'}},
  'https://cset.georgetown.edu/publication/china-export-control-catalog-july-2025/':{title:'Catalogue of Technologies Prohibited or Restricted from Export (July 2025)',subtitle:'MOFCOM + Ministry of Science & Technology · Updated July 2025',nodal:'Jointly administered by the Ministry of Commerce (MOFCOM) and the Ministry of Science and Technology (MOST), with the Ministry of Industry (MIIT) consulted on information-technology categories.',scope:'Lists 134 technologies as of July 2025, in two tiers: 24 are banned from export outright, with no licence available at all, and 110 are restricted, requiring multi-stage government approval. Covers physical exports as well as licensing deals, joint-venture contributions, technical assistance, and outbound investment.',trigger:['Attempting to export or transfer any of the 24 absolutely banned technologies; this is treated as a criminal matter with no licensing route available','Transferring any of the 110 restricted technologies without prior government approval','A Chinese company contributing restricted technology to a foreign joint venture or overseas investment'],action:['Absolute prohibitions carry criminal penalties of up to 10 years in prison','Restricted technologies require multi-stage government approval, with no fixed deadline for a decision','The government can void existing contracts and force companies to unwind unauthorised transfers','Even a company\'s own overseas subsidiaries cannot pass these technologies to third countries without separate approval'],source:{name:'China Export Control Catalog July 2025 — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-export-control-catalog-july-2025/'}},
  'https://www.gov.cn/zhengce/content/202604/content_7064837.htm':{title:'Regulations on Industrial & Supply Chain Security (Decree 834)',subtitle:'State Council · Effective March 31, 2026',nodal:'A State Council-led group of agencies, with the National Development and Reform Commission (NDRC) taking the lead, alongside the Ministry of Commerce, the Ministry of Industry, and the Ministry of State Security.',scope:'Applies to foreign companies, governments, and individuals whose actions are seen as threatening China\'s industrial or supply chain security, in sectors including semiconductors, new energy, aerospace, critical minerals, and advanced materials.',trigger:['A foreign entity carrying out unauthorised information-gathering on China\'s supply chains (Article 13)','Authorities opening a supply chain security investigation into a specific import or export transaction (Article 14)','A foreign organisation or individual under investigation for conduct threatening supply chain security (Article 15)'],action:['A supply chain security investigation can result in import or export prohibitions, restrictions, or a special fee on the specific transaction under review (Article 14)','A foreign organisation or individual found responsible can face trade restrictions, investment bans, transaction prohibitions, or entry restrictions (Article 15)','Domestic entities that fail to comply face procurement and bidding restrictions, plus data-sharing prohibitions, as penalties (Article 16)','Works alongside Decree 835: this decree defends China\'s own supply chains, the other punishes foreign actors seen as disrupting them'],source:{name:'Decree 834 — State Council Legislative Portal',url:'https://www.gov.cn/zhengce/content/202604/content_7064837.htm'},source2:{name:'Decree 834 Analysis — Baker McKenzie Sanctions News',url:'https://sanctionsnews.bakermckenzie.com/china-introduces-new-state-council-decrees-on-supply-chain-security-and-countering-unjustifiable-extraterritorial-measures/'}},
  'https://www.gov.cn/zhengce/zhengceku/2022-01/04/content_5666430.htm':{title:'Cybersecurity Review Measures (2022)',subtitle:'13-agency committee led by CAC · Effective February 15, 2022',nodal:'Led by the Cyberspace Administration of China (CAC), with a 13-agency committee including bodies overseeing economic planning, foreign affairs, public security, state security, industry, and finance.',scope:'Covers two situations: operators of critical infrastructure buying network products or services that could affect national security, and platform companies with over 1 million Chinese users seeking an overseas stock listing. Applies across seven strategic sectors: telecoms, energy, finance, transport, water, healthcare, and defence.',trigger:['A critical infrastructure operator makes a procurement decision; review is required before the purchase goes ahead','A platform with over 1 million Chinese users files for an overseas stock listing','The regulator decides on its own that a product or platform poses a national security risk'],action:['A mandatory review can block the purchase or listing; it usually takes 30 working days but can stretch to 90 for complex cases, with no hard deadline','A product or service that fails review can be blacklisted across all seven strategic sectors at once','An overseas listing can be blocked or unwound: ride-hailing giant DiDi was forced to delist from the New York Stock Exchange in 2022 after a review of this kind <span class="obs">(in practice)</span>','The procurement side is equally live: in August 2026 the CAC opened a review into US cybersecurity firm Palo Alto Networks over products it sells in China, days after a fresh round of US-directed export controls and sanctions <span class="obs">(in practice)</span>'],source:{name:'Network Security Review Measures — State Council Official Text',url:'https://www.gov.cn/zhengce/zhengceku/2022-01/04/content_5666430.htm'},source2:{name:'China Launches Probe Into US Cybersecurity Firm Palo Alto Networks — SCMP',url:'https://www.scmp.com/economy/global-economy/article/3363177/china-launches-probe-us-cybersecurity-firm-palo-alto-networks'}},
  'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2021/art_98677d0ed28b41b9adeff27b00c9d001.html':{title:'MOFCOM Blocking Statute — Order No. 1 of 2021',subtitle:'MOFCOM · Effective January 9, 2021',nodal:'The Ministry of Commerce (MOFCOM) is the sole authority administering this rule.',scope:'Applies to Chinese citizens, and Chinese companies and other organisations, affected by a foreign law or measure that reaches beyond that country\'s own borders and is wrongly applied to them (Articles 1, 2, 5).',trigger:['Receiving a foreign order with extraterritorial reach, such as a US Commerce Department Entity List designation, or OFAC or EU sanctions, that affects business in China','Taking any compliance action in response to such a foreign measure that affects a Chinese party'],action:['Must report to MOFCOM within 30 days of being affected by a qualifying foreign measure (Article 5)','MOFCOM can issue a Prohibition Order declaring a specified foreign measure is "not to be recognised, not to be enforced, and not to be observed" inside China (Article 7)','A Chinese party harmed by another party\'s compliance with a barred foreign measure can sue that party for damages in a Chinese court (Article 9)','Significantly strengthened by Decree 835, introduced in April 2026'],source:{name:'MOFCOM Order No. 1 of 2021 — MOFCOM English Portal',url:'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2021/art_98677d0ed28b41b9adeff27b00c9d001.html'}},
  'https://www.gov.cn/zhengce/content/202604/content_7065398.htm':{title:'Regulations on Combating Unjustified Extraterritorial Jurisdiction (Decree 835)',subtitle:'Ministry of Justice + State Council · Effective April 7, 2026',nodal:'The Ministry of Justice is the main regulator, with the State Council coordinating enforcement.',scope:'A major expansion of the 2021 Blocking Statute. Article 6 bars "any organization or individual" from executing or assisting a foreign measure the government identifies as improper extraterritorial jurisdiction, and Article 8 extends Malicious Entity List exposure to those who "promote or participate in implementing" such a measure. That language is broad and unqualified, which is why legal commentators read it as potentially reaching lawyers, advisers, think tanks, lobbyists, and research institutes, though the decree does not name these groups itself.',trigger:['Executing, or assisting in executing, any foreign measure the government identifies as "improper extraterritorial jurisdiction" (Article 6); the text applies to "any organization or individual," with no exemption written in','Promoting or participating in implementing such a foreign measure, the trigger for Malicious Entity List designation (Article 8)','Refusing to cooperate with, or obstructing, an official inspection or document request once a suspected violation is under investigation (Article 12)'],action:['Authorities can order corrections, or issue a binding order specifically prohibiting continued execution of the foreign measure (Article 13)','Non-compliance or evasion can bring further correction orders, bans on government procurement and bidding, and exit or entry restrictions on executives (Article 17)','Malicious Entity List designation under Article 8 adds visa restrictions, asset freezes, and trade limitations','Violations that separately constitute a crime under other Chinese law carry criminal liability (Article 18); the decree does not itself create a standalone prison sentence'],source:{name:'Decree 835 — State Council Legislative Portal',url:'https://www.gov.cn/zhengce/content/202604/content_7065398.htm'},source2:{name:'Decree 835 Analysis — Morrison Foerster',url:'https://www.mofo.com/resources/insights/260420-china-issues-new-regulations-countering-foreign-states'}},
  'https://www.chinalawtranslate.com/en/foreigninvestmentsecurityreview/':{title:'Measures for the Security Review of Foreign Investments (2020)',subtitle:'NDRC + MOFCOM · Effective January 18, 2021',nodal:'Jointly led by the National Development and Reform Commission (NDRC) and the Ministry of Commerce (MOFCOM), with input from security, defence, and other sector regulators.',scope:'Covers foreign investment into military and military-linked companies; critical information infrastructure; artificial intelligence, semiconductors, advanced biotechnology, and advanced materials; and energy, resources, and strategic transport. No deal is too small to be exempt.',trigger:['Any foreign investment in one of these sectors, regardless of deal size or ownership share','A change, after approval, in who the foreign investor actually is, who ultimately benefits, or who controls the company','Regulators deciding on their own that an investment that was never formally reported may affect national security'],action:['Three possible outcomes, approved outright, approved with conditions, or rejected, with no fixed deadline for a decision','Conditions can include restrictions on technology sharing, mandatory reporting to security agencies, or government access rights','Even after approval, the government can force a foreign investor to sell its stake if the investment is later judged a security risk'],source:{name:'Foreign Investment Security Review — China Law Translate',url:'https://www.chinalawtranslate.com/en/foreigninvestmentsecurityreview/'},source2:{name:'Foreign Investment Security Review — State Council Official',url:'https://www.gov.cn/zhengce/zhengceku/2020-12/19/content_5571113.htm'}},
  'https://www.news.cn/politics/20260601/c501b3cd78034669a8dd442f659f2a20/c.html':{title:'State Council Regulations on Overseas Investment (Decree 837)',subtitle:'NDRC + MOFCOM · Effective July 1, 2026',nodal:'Article 11 names the State Council\'s "investment administration department" (conventionally the NDRC) and "commerce administration department" (MOFCOM), acting with other relevant State Council departments, as the bodies that set outward investment policy and classify investments as encouraged, restricted, or prohibited. The decree refers to them by function, not by name, which is why only the commerce side reads clearly on a first pass.',scope:['<strong>Who it covers</strong>: Chinese companies, other organisations, and individuals resident in China','<strong>What counts as outward investment</strong>: contributing money, equity, financing, or guarantees to gain ownership, control, or management rights over a company or asset in another country','<strong>Encouraged</strong>: investment that aligns with China\'s development priorities and brings in foreign technology or management know-how in non-sensitive sectors (Article 11)','<strong>Restricted</strong>: investment in sectors or technologies the government classifies as restricted, subject to approval and filing procedures; the decree does not name which department handles approval at the transaction level (Articles 11, 12)','<strong>Prohibited</strong>: investment in a category the government classifies as state-prohibited, or that transfers banned or restricted technology to another country (Articles 13, 27)'],prohibitions:'<div style="font-size:9.5px;color:#94a3b8;font-style:italic;margin-bottom:9px;line-height:1.45;">Grounded in Articles 11, 12, 13, 23 and 27 of the decree. This is the only one of the three 2026 decrees whose own text sets out encouraged, restricted, and prohibited tiers.</div><div style="margin-bottom:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#c8102e;">Prohibited</div><ul style="margin:0 0 10px;"><li>Exporting or using state-prohibited goods, technology, or services as part of an outward investment (Article 13)</li><li>Transferring banned or restricted technology to another country, including via cross-border deployment of technical personnel or other methods (Article 13)</li><li>Investing in a category the government classifies as state-prohibited; violations can bring forced disposal of the assets (Article 27)</li></ul><div style="margin-bottom:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#2563eb;">Restricted</div><ul style="margin:0;"><li>Investment in sectors or technologies classified as restricted, as defined jointly by the NDRC and MOFCOM together with other relevant departments (Article 11)</li><li>Outward investment must comply with approval and filing ("核准备案") procedures; the decree does not specify which department handles this at the transaction level (Article 12)</li></ul>',action:['Prohibited-category violations can bring forced cessation of the investment and forced disposal of the assets, plus fines of 0.5%–1% of the investment amount and RMB 50,000–100,000 fines on responsible individuals (Article 27)','Unapproved or falsely filed investments face fines starting at 0.1%–0.5% of the investment amount, rising to 0.5%–1% for continued non-compliance, plus RMB 20,000–50,000 fines on individuals, a three-year bar on new applications, or a one-to-three-year ban on investment activity (Article 27)','Security-review violations can bring fines, a one-to-three-year investment ban, and forced disposal of assets (Article 28)','MOFCOM can investigate, alone or with other departments, a foreign government\'s own barriers or discrimination against Chinese investors, and respond with policy adjustments, trade or technology export restrictions, or service-trade limits (Article 23)'],source:{name:'Decree 837 — Xinhua News Policy Portal',url:'https://www.news.cn/politics/20260601/c501b3cd78034669a8dd442f659f2a20/c.html'},source2:{name:'Decree 837 — State Council English Portal',url:'https://english.www.gov.cn/policies/latestreleases/202606/01/content_WS6a1d2e29c6d00ca5f9a0b59e.html'}},
  'https://openresearch-repository.anu.edu.au/server/api/core/bitstreams/7bba4ac6-0ee2-4890-b90c-f586f63de6e8/content':{title:'Cross-Border Data Transfer Rules (PIPL / DSL Framework)',subtitle:'Cyberspace Administration of China (CAC) · 2022–2026',nodal:'Cyberspace Administration of China (CAC), the national internet and data regulator, with provincial offices handling smaller cases. Industry regulators (banking, telecom, etc.) decide what counts as "important" data in their own sector.',scope:['Applies broadly: any company handling the personal data of Chinese residents, businesses that generate sensitive ("important") data while operating in China, operators of critical infrastructure like power grids, banks, and telecom networks, digital platforms with over 1 million Chinese users, and, from 2026, companies collecting data from connected vehicles','To move data out of China, a company must use one of three government-approved routes: a full security review, a standard data-transfer contract, or a certification scheme','"Core state data," the most sensitive tier, sits outside all three routes: it is effectively barred from leaving China at all, rather than merely subject to review'],trigger:['Sending any amount of data officially classified as "important" outside China','Sending the personal data of more than 1 million Chinese individuals abroad, which requires the strictest route, a mandatory government Security Assessment','Any international data transfer by an operator of critical infrastructure, regardless of how much data is involved','Planning an overseas stock listing that would involve Chinese user data above the threshold'],action:['The mandatory Security Assessment can freeze all data transfers for months during review, and the government can refuse permission outright, with no independent appeal','Regulators can order an immediate halt to transfers and demand deletion of data already sent abroad','Fines of up to RMB 50 million (roughly $7 million) or 5% of global annual revenue, whichever is higher, plus possible criminal charges against company executives'],source:{name:'Cross-Border Data Transfer Rules — ANU / CAC Legislative Depository',url:'https://openresearch-repository.anu.edu.au/server/api/core/bitstreams/7bba4ac6-0ee2-4890-b90c-f586f63de6e8/content'},source2:{name:'Cross-Border Data Transfer in China — Global Law Experts',url:'https://globallawexperts.com/crossborder-data-transfer-china/'}},
  'https://www.chinalawtranslate.com/en/exdata-export-security/':{title:'Measures for the Security Assessment of Data Exports',subtitle:'Cyberspace Administration of China (CAC) · Effective September 1, 2022',nodal:'The Cyberspace Administration of China (CAC) issues and enforces this regulation.',scope:['Applies to companies sending "important data" abroad, defined as data whose leak could affect national security, economic security, social stability, or public health','Also applies to any operator of critical information infrastructure that sends data abroad, regardless of volume','Also applies to companies sending the personal data of 1 million or more Chinese individuals abroad in a single transfer','Also applies to companies that have cumulatively sent abroad the personal data of 100,000 or more individuals, or the sensitive personal data of 10,000 or more individuals, since the start of the previous year'],trigger:['Meeting any one of the four thresholds above triggers a mandatory government security assessment before the data can leave China','The assessment must be completed before the transfer takes place, not after the fact'],action:['The assessment can take months to complete, and the CAC can deny permission outright with no independent appeal','A fresh assessment is required if the purpose, scope, or recipient of the transfer later changes','Transferring data without completing a required assessment is treated as an unlawful cross-border transfer under the Data Security Law, carrying the same fines and potential criminal liability'],source:{name:'Measures for the Security Assessment of Outbound Data Transfers — China Law Translate',url:'https://www.chinalawtranslate.com/en/exdata-export-security/'}},
  'https://www.wto.org/english/thewto_e/acc_e/chn_e/wtaccchn45_leg_1.pdf':{title:'Anti-Dumping Regulations of the PRC (2001, revised 2004)',subtitle:'State Council Decree No. 328 / 401 · Administered by MOFCOM Trade Remedy & Investigation Bureau',nodal:'The Ministry of Commerce\'s (MOFCOM) Trade Remedy & Investigation Bureau investigates and decides cases; the State Council\'s Customs Tariff Commission sets the actual duty; Customs (GACC) collects it at the border.',scope:'Covers any imported product accused of being sold into China below its normal value in a way that harms a Chinese domestic industry. No sector is off limits; in practice, agriculture, food and drinks, chemicals, cars, and consumer goods have most often been targeted.',trigger:['A petition from, or on behalf of, a Chinese domestic industry, or MOFCOM starting a case on its own','MOFCOM makes its own preliminary finding on the dumping margin, injury, and cause, with no independent check','A documented pattern: cases tend to open within weeks of political disputes with the exporting country, as with Australia in 2020 and the EU in 2024 <span class="obs">(in practice)</span>'],action:['Temporary duties or cash deposits at the border within months of a case opening','Final duties can last 5 years, renewable through further reviews; documented rates have reached 80.5% for Australian barley and 116 to 218% for Australian wine <span class="obs">(in practice)</span>','Exporters can sometimes avoid duties by agreeing to a minimum price instead','Duties have historically been lifted when diplomatic relations improved, not when the legal case was resolved, as with the Australian barley and wine duties in 2023 to 2024 <span class="inf">(inferred)</span>'],source:{name:'Regulations of the PRC on Anti-Dumping — WTO official English text',url:'https://www.wto.org/english/thewto_e/acc_e/chn_e/wtaccchn45_leg_1.pdf'},source2:{name:'MOFCOM Trade Remedy & Investigation Bureau',url:'https://trb.mofcom.gov.cn/'}},
  'https://enforcement.trade.gov/trcs/downloads/documents/china/index.html':{title:'Countervailing Duty Regulations of the PRC (2001, revised 2004)',subtitle:'State Council · Administered by MOFCOM Trade Remedy & Investigation Bureau',nodal:'The Ministry of Commerce\'s (MOFCOM) Trade Remedy & Investigation Bureau investigates and decides; the State Council\'s Customs Tariff Commission imposes the duty.',scope:'Covers imported products accused of benefiting from foreign government subsidies in a way that harms Chinese industry. Runs on the same procedural track as the Anti-Dumping Regulations, with the same leverage.',trigger:['A petition from Chinese industry, or MOFCOM opening a case on its own, alleging a subsidy','MOFCOM decides the subsidy, injury, and cause on its own, with no independent review','Often used alongside an anti-dumping case for compounding duties, as with the EU dairy and pork cases in 2024, which followed the EU\'s own investigation into Chinese electric vehicles <span class="obs">(in practice)</span>'],action:['Temporary and final duties, with deposits required at the border during the investigation','Investigations run 12 to 18 months and can be extended further, leaving importers in limbo the whole time','Sectors are often chosen for maximum political impact in specific countries, as with French brandy, Spanish pork, and EU-wide dairy <span class="inf">(inferred)</span>'],source:{name:'PRC Trade Remedy Laws, Regulations and Rules — US ITA collection',url:'https://enforcement.trade.gov/trcs/downloads/documents/china/index.html'},source2:{name:'MOFCOM Trade Remedy & Investigation Bureau',url:'https://trb.mofcom.gov.cn/'}},
  'https://npcobserver.com/legislation/anti-monopoly-law/':{title:'Merger Review under the Anti-Monopoly Law (2008, amended 2022)',subtitle:'SAMR (State Administration for Market Regulation) · Thresholds revised January 2024',nodal:'The State Administration for Market Regulation\'s (SAMR) Anti-Monopoly Bureau reviews and clears deals; the State Council\'s Anti-Monopoly Commission sets broader policy.',scope:'Applies to every qualifying merger or acquisition, regardless of nationality or where the deal closes. Even a merger between two entirely non-Chinese companies, closing entirely outside China, needs SAMR\'s approval if the companies do enough business in China. What matters is business activity in China, not where a company is registered.',trigger:['The merging companies\' combined worldwide revenue exceeds RMB 12 billion, or their combined China revenue exceeds RMB 4 billion, in the previous year','And at least two of the companies each earn more than RMB 800 million a year in China','Even below these thresholds, SAMR can still demand a review if it suspects the deal could hurt competition'],action:['The deal cannot legally close anywhere in the world until SAMR approves it; closing early can bring fines of up to 10% of the previous year\'s revenue','Approval can come with conditions, such as running the merged businesses separately, that can last for years','SAMR can effectively kill a deal simply by not deciding: both the Qualcomm-NXP deal in 2018 and the Intel-Tower deal in 2023 collapsed after SAMR let the review clock run out during periods of US-China tension <span class="obs">(in practice)</span>','The pace of review often tracks the state of the wider US-China relationship, and there is no meaningful way to appeal a delay <span class="inf">(inferred)</span>'],source:{name:'Anti-Monopoly Law — NPC Observer',url:'https://npcobserver.com/legislation/anti-monopoly-law/'},source2:{name:'SAMR — State Administration for Market Regulation',url:'https://www.samr.gov.cn/'}},
  'https://trb.mofcom.gov.cn/':{title:'Foreign Trade Barrier Investigation Rules (2005)',subtitle:'MOFCOM · Under Foreign Trade Law Arts. 7 and 37',nodal:'The Ministry of Commerce (MOFCOM) is the sole authority that decides whether a foreign measure counts as a trade barrier; there is no independent or court review of that finding.',scope:'Applies to any foreign government measure MOFCOM decides is a "trade barrier" harming Chinese exports or investment. It works much like the US Section 301 mechanism, but in reverse.',trigger:['A petition from Chinese industry, or MOFCOM starting an investigation on its own, against a foreign government measure','MOFCOM unilaterally decides the measure violates a trade agreement or hurts Chinese commercial interests'],action:['Authorises China to retaliate without going through the WTO\'s dispute process','Used against Taiwan in 2023 to 2024 to suspend tariff concessions on over 134 product lines under the cross-strait trade agreement <span class="obs">(in practice)</span>','Used against the EU in 2024, opening an investigation that led into the brandy, pork, and dairy cases that followed <span class="obs">(in practice)</span>'],source:{name:'MOFCOM Trade Remedy & Investigation Bureau',url:'https://trb.mofcom.gov.cn/'},source2:{name:'Foreign Trade Law of the PRC — NPC Observer',url:'https://npcobserver.com/legislation/foreign-trade-law/'}}
};

const isEmbed = new URLSearchParams(window.location.search).get('embed') === '1';

const me = new MindElixir({
  el:'#map',
  direction:MindElixir.SIDE,
  draggable: !isEmbed,
  contextMenu:false,
  toolBar:false,
  nodeMenu:false,
  keypress:false,
  before:{ beginEdit(){ return false; } }
});
me.init(DATA);

const mapEl = document.getElementById('map');

// Bounding box (screen coords) of all rendered nodes
function nodesBBox(){
  const topics = mapEl.querySelectorAll('me-tpc');
  if (!topics.length) return null;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  topics.forEach(t=>{
    const r = t.getBoundingClientRect();
    minX=Math.min(minX,r.left);  minY=Math.min(minY,r.top);
    maxX=Math.max(maxX,r.right);  maxY=Math.max(maxY,r.bottom);
  });
  return {minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2};
}

// Find the element mind-elixir applies its pan/zoom transform to
function transformedEl(){
  const kids = mapEl.querySelectorAll('*');
  for (const el of kids){
    const t = getComputedStyle(el).transform;
    if (t && t.indexOf('matrix') === 0) return el;
  }
  return null;
}

// Scale the map to fit the viewport, then center the CONTENT (not just the root)
function fitMap(){
  try {
    me.scale(1);
    const nat = nodesBBox();
    if (!nat || nat.w<=0 || nat.h<=0) return;
    const cw = mapEl.clientWidth, ch = mapEl.clientHeight;
    const scale = Math.min(cw/nat.w, ch/nat.h) * 0.9;
    me.scale(scale);
    me.toCenter();

    // Content-center: nudge the transform so the node bbox sits dead-centre
    const el = transformedEl();
    const box = nodesBBox();
    if (el && box){
      const m = new DOMMatrixReadOnly(getComputedStyle(el).transform);
      const mapRect = mapEl.getBoundingClientRect();
      const dx = (mapRect.left + cw/2) - box.cx;
      const dy = (mapRect.top + ch/2) - box.cy;
      el.style.transform = `matrix(${m.a},${m.b},${m.c},${m.d},${m.e+dx},${m.f+dy})`;
    }
  } catch(e){}
}

if (isEmbed) {
  // Hide floating UI not needed in embed
  document.querySelectorAll('.map-title').forEach(el=>el.style.display='none');

  // Kill drag-to-pan on map background. Allow: node clicks, link clicks, popup interactions.
  ['pointerdown','mousedown','touchstart'].forEach(evt=>{
    window.addEventListener(evt, function(e){
      if (!e.target.closest('me-tpc') &&
          !e.target.closest('a[href]') &&
          !e.target.closest('#popup-overlay')) {
        e.preventDefault(); e.stopPropagation();
      }
    }, {capture:true, passive:false});
  });

  // Kill mobile drag: block touchmove/pointermove on the map so a touch that
  // started on a node can't be dragged into a pan. Allow moves inside the popup
  // so the popup card remains scrollable.
  ['touchmove','pointermove'].forEach(evt=>{
    window.addEventListener(evt, function(e){
      if (!e.target.closest('#popup-overlay')) {
        e.preventDefault(); e.stopPropagation();
      }
    }, {capture:true, passive:false});
  });

  // Kill scroll-zoom: forward wheel delta to parent page so it can still scroll.
  window.addEventListener('wheel', function(e){
    e.preventDefault(); e.stopPropagation();
    try { window.parent.postMessage({type:'wheel', deltaX:e.deltaX, deltaY:e.deltaY}, '*'); } catch(_){}
  }, {capture:true, passive:false});
}

// Both modes: fit the whole map into view on load (full screen keeps drag/zoom)
setTimeout(fitMap, 350);
setTimeout(fitMap, 800);
setTimeout(fitMap, 1400);
window.addEventListener('resize', fitMap);

/* Prevent double-click edit */
document.getElementById('map').addEventListener('dblclick', e=>{
  e.stopImmediatePropagation(); e.preventDefault();
}, true);

/* ── CLICK HANDLER ── */
document.getElementById('map').addEventListener('click', function(e){
  if(document.getElementById('popup-overlay').classList.contains('open')) return;
  const anchor = e.target.closest('a[href]');
  if(anchor){ const h=anchor.getAttribute('href'); if(h&&POPUP_DATA[h]){ e.preventDefault(); e.stopPropagation(); showPopup(POPUP_DATA[h]); return; } }
  const tpc = e.target.closest('me-tpc');
  if(tpc){ const n=tpc.nodeObj; if(n&&n.hyperLink&&POPUP_DATA[n.hyperLink]){ e.preventDefault(); e.stopPropagation(); showPopup(POPUP_DATA[n.hyperLink]); } }
}, true);

/* ── POPUP ── */
function showPopup(d){
  document.getElementById('popup-title').textContent=d.title;
  document.getElementById('popup-subtitle').textContent=d.subtitle;
  const rows=[{lbl:'Nodal Authority',val:d.nodal},{lbl:'Scope',val:d.scope},{lbl:'Trigger',val:d.trigger},{lbl:'Prohibitions & Restrictions',val:d.prohibitions},{lbl:'Action / Remedies',val:d.action}].filter(r=>r.val);
  document.getElementById('popup-struct').innerHTML=rows.map(r=>`<div class="popup-row"><div class="popup-rlbl">${r.lbl}</div><div class="popup-rval">${Array.isArray(r.val)?`<ul>${r.val.map(v=>`<li>${v}</li>`).join('')}</ul>`:r.val}</div></div>`).join('');
  const _srcs=[d.source,d.source2,d.source3,d.source4,d.source5].filter(Boolean);document.getElementById('popup-source').innerHTML=`<span class="popup-source-lbl">Source${_srcs.length>1?'s':''}</span><div style="display:flex;flex-direction:column;gap:3px;">${_srcs.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.name} ↗</a>`).join('')}</div>`;
  document.getElementById('popup-overlay').classList.add('open');
}
function closePopup(){ document.getElementById('popup-overlay').classList.remove('open'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePopup(); });


window.closePopup=closePopup;
</script>
</body>
</html>
