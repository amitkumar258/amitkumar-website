eave within a set period and deported if they do not; a deported person is barred from entering China for ten years','Applied against foreign due diligence and consultancy firms conducting supply chain research, the Bain, Mintz Group and Capvision actions of 2023 being the documented instances <span class="obs">(in practice)</span>'],remedies:'None stated. The Law sets out investigation and penalty powers without providing a route to contest a determination <span class="inf">(inferred)</span>.',source:{name:'Counter-Espionage Law of the PRC (2023 revision) — China Law Translate',url:'https://www.chinalawtranslate.com/en/counter-espionage-law-2023/'}},

0,000 on responsible individuals','Serious cases bring up to <strong>RMB 50 million or 5% of the previous year’s turnover</strong>, RMB 100,000 to 1 million on responsible individuals, and a bar on holding senior management or data protection roles for a period'],remedies:'None stated. The Law provides no route to contest an Article 42 listing or a refused assessment <span class="inf">(inferred)</span>.',source:{name:'Personal Information Protection Law — CAC official text',url:'https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm'}},
  'https://www.gov.cn/zhengce/content/2021-08/17/content_5631671.htm':{title:'Regulations on Security Protection of Critical Information Infrastructure (2021)',subtitle:'State Council Decree No. 745 · Adopted April 27, 2021 · Effective September 1, 2021 · 6 chapters, 51 articles',objective:['Operationalises the critical information infrastructure regime that the Cybersecurity Law leaves abstract','Settles who identifies critical infrastructure, and on what basis'],nodal:['Article 3: the Cyberspace Administration of China coordinates overall','The <strong>Ministry of Public Security</strong> guides and supervises protection work','The telecommunications authority and other departments act within their remits, with provincial governments implementing locally'],scope:['<strong>Article 2 names eight sectors, one more than the Cybersecurity Law</strong>: public communications and information services, energy, transport, water, finance, public services, e-government, and the defence science and technology industry','Identification is delegated rather than listed: sector protection departments write the identification rules, apply them, and notify operators and the Ministry of Public Security (Articles 9 to 11)','Operators must report significant changes within three months so that status can be reassessed'],restrictions:['<strong>Article 19</strong>: procurement of network products and services that may affect national security must pass a security review. This is the hook the Cybersecurity Review Measures hang on','Article 5 directs the state to monitor and respond to cybersecurity threats originating both inside and outside China'],retaliation:['Operators face fines of RMB 100,000 to 1 million, and responsible managers RMB 10,000 to 100,000','Individuals in breach can be barred from key roles for five years, or for life in severe cases'],remedies:'None provided <span class="inf">(inferred)</span>.',source:{name:'Regulations on Security Protection of Critical Information Infrastructure, State Council Decree No. 745',url:'https://www.gov.cn/zhengce/content/2021-08/17/content_5631671.htm'}},
  'https://www.mee.gov.cn/zcwj/gwywj/202503/t20250325_1104650.shtml':{title:'Counter-Sanctions List — Anti-Foreign Sanctions Law (2021)',subtitle:'State Council departments via the counter-sanctions working mechanism · AFSL Articles 4 to 7 · Operationalised by Decree No. 803, March 23, 2025',objective:['The listing regime aimed at those who impose or implement foreign sanctions on Chinese parties','Distinct from the Unreliable Entity List, which MOFCOM runs against commercial conduct'],nodal:['Relevant State Council departments decide listings','Decree 803 Article 10 names the coordination mechanism: the foreign affairs, commerce, development and reform, and justice administration departments'],scope:['Reaches foreign individuals and organisations that formulate, decide on, or implement discriminatory measures against Chinese citizens or entities','<strong>Article 5</strong> extends listing to the spouses and immediate relatives of a listed individual, to senior managers and actual controllers of a listed organisation, to organisations where a listed individual is a senior manager, and to organisations they control or helped establish and run'],restrictions:['Article 12 bars any organisation or individual from executing or assisting a foreign discriminatory measure against Chinese parties','Decree 803 Article 13 penalises domestic parties that fail to implement a countermeasure, including through government procurement restrictions and data transfer prohibitions'],retaliation:['Article 6 allows refusing or revoking visas, barring entry and deportation; sealing, seizing and freezing property in China; prohibiting or restricting transactions and cooperation with parties in China; and other necessary measures','Decree 803 Articles 6 to 9 make these concrete, reaching transactions in education, technology, legal services, environmental protection, trade, culture, tourism, health and sport, alongside export restrictions, investment bans, data restrictions, cancellation of work permits, and fines','A Chinese party harmed by another party’s execution of a foreign measure may sue for cessation and damages (Article 12; Decree 803 Article 18)'],remedies:'Article 7 makes decisions under Articles 4 to 6 final, so there is no appeal and no judicial review. Decree 803 Articles 14 and 15 add a request route: a listed party may apply for a countermeasure to be suspended, changed or cancelled on evidence that it has corrected the conduct. Removal by rectification, not challenge.',source:{name:'Provisions on Implementing the Anti-Foreign Sanctions Law, State Council Decree No. 803 (2025)',url:'https://www.mee.gov.cn/zcwj/gwywj/202503/t20250325_1104650.shtml'},source2:{name:'Anti-Foreign Sanctions Law of the PRC — official text',url:'https://wb.beijing.gov.cn/home/zwxx/zcfg/flfg/202407/t20240704_3737947.html'}},
  'https://www.hankunlaw.com/portal/article/index/cid/8/id/16501.html':{title:'Malicious Entity List — Decree 835 (2026)',subtitle:'Relevant State Council departments via the working mechanism · Decree 835, Article 8 · Effective 2026',objective:['The newest of the listing regimes, aimed not at those who impose foreign measures but at those who <em>carry them out or promote them</em>','It is the enforcement edge of Decree 835, and reaches advisers and intermediaries rather than only principals'],nodal:['Article 8 assigns listing to relevant State Council departments acting through the working mechanism. <strong>No single ministry is named</strong>','A separate function sits elsewhere: under Article 13 the State Council legal affairs department issues the prohibition order, which is a different mechanism from the list'],scope:['Reaches foreign organisations and individuals that <strong>promote or participate in implementing</strong> a foreign measure the government identifies as improper extraterritorial jurisdiction','The final paragraph of Article 8 extends every measure to organisations the listed party actually controls, or participated in establishing or operating','Because the trigger is assisting rather than imposing, commentators read it as capable of reaching lawyers, advisers, consultancies and research institutes, though the decree does not name them'],restrictions:['Listing is made under Article 8 and the measures are applied pursuant to the Anti-Foreign Sanctions Law and Decree 803, which ties the three regimes together','Separately, Article 6 bars any organisation or individual from executing or assisting such a foreign measure, and Article 12 penalises obstruction of an investigation'],retaliation:['Article 8 carries a nine-head menu: refusing visas, denying entry, cancelling visas, ordering departure, deportation or expulsion; cancelling or restricting work, stay or residence status; sealing, seizing and freezing property in China; <strong>prohibiting   'https://npcobserver.com/legislation/personal-information-protection-law/':{title:'Restriction List — PIPL Article 42 (2021)',subtitle:'Cyberspace Administration of China · Personal Information Protection Law, Article 42',objective:['The narrowest of the four listing regimes, and the only one keyed to personal information','Included because it is a distinct statutory list with its own trigger and its own consequence'],nodal:['The Cyberspace Administration of China (CAC) decides listings and publishes them'],scope:['Reaches foreign organisations and individuals whose personal information processing harms the personal information rights of Chinese citizens, or endangers national security or the public interest','Unlike the other three regimes, the trigger is conduct in handling data rather than sanctions, commercial refusal, or assisting a foreign measure'],restrictions:['Once listed, parties in China may be restricted or prohibited from providing personal information to the listed party','The listing is published, which gives it effect against every handler at once rather than requiring individual notification'],retaliation:['The consequence is confined to the flow of personal information, which makes this the most targeted and least broad of the four lists','Article 43 supplies the accompanying reciprocity power against countries taking discriminatory measures against China on personal information protection'],remedies:'None stated in the Law <span class="inf">(inferred)</span>.',source:{name:'Personal Information Protection Law — NPC Observer',url:'https://npcobserver.com/legislation/personal-information-protection-law/'},source2:{name:'Personal Information Protection Law — CAC official text',url:'https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm'}},
  'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_7fc9bff0fb4546ecb02f66ee77d0e5f6.html':{title:'MOFCOM Announcement 2025 No. 61 — Overseas Rare Earth Items and the 0.1% Rule',subtitle:'MOFCOM · Issued Oct 9, 2025 with State Council approval · Staggered commencement · Suspended Nov 7, 2025 until Nov 10, 2026',objective:['Asserts jurisdiction over rare earth items made entirely outside China, by non-Chinese firms, in transactions with no Chinese party','The most far-reaching extraterritorial instrument on this map, and a deliberate mirror of the de minimis and foreign direct product rules the United States applies to Chinese firms'],nodal:['Issued by the Ministry of Commerce (MOFCOM) alone, not jointly with Customs','State Council approval is expressly recorded; made under the Export Control Law and Decree 792','Overseas operators apply directly to MOFCOM, which runs a consultation channel for classification questions'],scope:['Three limbs, each requiring a Chinese dual-use export licence from an <em>overseas</em> exporter','<strong>First</strong>: items manufactured abroad that contain, integrate or are mixed with Chinese-origin listed rare earth items, where those Chinese inputs reach 0.1% or more of the value of the finished overseas item','<strong>Second</strong>: items produced abroad using Chinese-origin rare earth technology for mining, smelting and separation, metal smelting, magnet manufacturing, or secondary resource recycling','<strong>Third</strong>: items originating in China','The threshold is measured as the value of the Chinese-origin input against the value of the overseas-manufactured item, so it catches goods where the Chinese contribution is economically trivial'],restrictions:['<strong>Commencement was staggered, then overtaken</strong>. The third limb, items originating in China, took effect on publication, October 9, 2025. The first two limbs, the 0.1% rule and the technology-derived rule, were set for December 1, 2025. Announcement 2025 No. 70 suspended the whole announcement on November 7, 2025 until November 10, 2026, so the two most far-reaching limbs never commenced <span class="obs">(in practice)</span>','Presumptive denial: licences are deemed not approved for overseas military end users, and for entities on the control list or watch list together with subsidiaries they own 50% or more of','Also deemed not approved: use in the design, development, production or delivery of weapons of mass destruction, use for terrorist purposes, and military use or the enhancement of military potential','Case-by-case review, rather than denial, for research or production of logic chips at 14 nanometres and below and memory chips of 256 layers and above, for the equipment and materials used to make them, and for artificial intelligence with potential military application. This writes a semiconductor node threshold into a rare earth instrument','A propagating compliance duty: an overseas exporter transferring or exporting a controlled item must issue a Compliance Notice to the next recipient down the chain, carrying the restriction forward contractually rather than only at the border'],retaliation:['The announcement sets out no penalties of its own; enforcement would run through the Export Control Law and Decree 792','Its force lies in the threshold rather than the sanction. At 0.1% of value, a magnet, alloy or component with a minor Chinese-origin rare earth content brings a foreign manufacturer inside a Chinese licensing requirement, and the licence can then be refused, conditioned, or simply left pending <span class="inf">(inferred)</span>','Humanitarian exports are exempt from licensing, for emergency medical use, public health emergencies and natural disaster relief, but the exporter must report to MOFCOM within 10 working days after the export and certify that the items will not be used against China\'s security or interests','Suspended alongside Announcements 55, 56, 57, 58 and 62 as part of the November 2025 trade understanding, on a timetable running to November 10, 2026, seventeen days short of the separate suspension covering Announcement 2024 No. 46'],remedies:'None. The announcement provides an advisory consultation channel for classification questions but no procedure for contesting a refusal, a condition, or a delay. Because the two principal limbs never commenced, no licence decisions have been taken under them <span class="inf">(inferred)</span>.',source:{name:'MOFCOM Announcement 2025 No. 61 — official text',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_7fc9bff0fb4546ecb02f66ee77d0e5f6.html'},source2:{name:'MOFCOM and GAC Announcement 2025 No. 70 — suspension until Nov 10, 2026',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_b1ec77dd3f0d4762952904df7cdaadec.html'},source3:{name:'MOFCOM Announcement 2025 No. 62 — the companion technology controls',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_6cb42957741440c6984de696b70df9ae.html'},source4:{name:'Extraterritorial jurisdiction under Announcements 61 and 62 — AllBright Law Offices',url:'https://www.allbrightlaw.com/CN/10475/3a06a97d81b99e4d.aspx'},source5:{name:'China expands export controls on rare earth minerals — National Law Review',url:'https://natlawreview.com/article/china-expands-export-control-rare-earth-minerals-and-more'}},
  'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_6cb42957741440c6984de696b70df9ae.html':{title:'MOFCOM Announcement 2025 No. 62 — Rare Earth Technology Controls',subtitle:'MOFCOM · Issued and effective Oct 9, 2025 with State Council approval · Suspended Nov 7, 2025 until Nov 10, 2026',objective:['Controls the know-how rather than the material','Where Announcement 18 licenses the elements and Announcement 61 reaches finished goods made abroad, this restricts the transfer of the processes themselves','Those processes, by which rare earths are mined, separated, smelted, turned into magnets and recycled, are where China’s advantage actually sits'],nodal:['Issued by the Ministry of Commerce (MOFCOM) alone, with State Council approval expressly recorded','Made under the Export Control Law and Decree 792','MOFCOM licenses, and offers an advisory consultation channel on classification'],scope:['Two control codes, 1E902.a and 1E902.b','<strong>1E902.a</strong>: technology, and its carriers, for rare earth mining, smelting and separation, metal smelting, magnet manufacturing, and secondary resource recycling. Magnet manufacturing is defined to include samarium-cobalt, neodymium-iron-boron, and cerium magnet technology','<strong>1E902.b</strong>: technology for assembling, commissioning, maintaining, repairing and upgrading the production lines themselves','"Technology and its carriers" is defined to include design drawings, process specifications, process parameters, machining programs, and simulation data','The <strong>1E</strong> prefix in its control codes marks these as technology controls, so this instrument belongs analytically with the Technology Export Catalogue in Domain 4. It sits here because its scope and suspension timetable tie it to the October 2025 rare earth package'],restrictions:['Controlled technology cannot be exported without a licence. The definition of export is unusually wide, covering trade as well as transfer by intellectual property licensing, investment, exchange, donation, exhibition, display, testing, assistance, instruction, joint research and development, employment or being employed, and consulting: essentially any route by which know-how moves','A separate prohibition binds people rather than goods: Chinese citizens, legal persons and unincorporated organisations may not, without permission, provide any substantive help or support to overseas rare earth mining, separation, smelting, magnet manufacturing or recycling activity','A catch-all extends licensing to uncontrolled goods and technology where the exporter knows they will be used for, or would substantially assist, those overseas activities','Three exemptions, narrower than they look: technology already in the public domain, technology in basic scientific research, and technology necessary for an ordinary patent application. They apply to the core control only and do not displace the catch-all','Unlike Announcement 57, this one did operate. It took effect on publication, October 9, 2025, and ran until the November 7 suspension, roughly four weeks <span class="obs">(in practice)</span>'],retaliation:['Unauthorised public disclosure of controlled non-public technology is punished under Export Control Law Article 34; breaches of the substantive-support prohibition are punished under the Export Control Law and Decree 792. The announcement itself sets no figures','The reach over employment and consulting means an individual engineer, not only a company, can be the subject of enforcement, and the prohibition on substantive support follows Chinese nationals wherever they work <span class="inf">(inferred)</span>','Suspended by Announcement 2025 No. 70 on November 7, 2025 until November 10, 2026, together with Announcements 55, 56, 57, 58 and 61'],remedies:'None. MOFCOM offers consultation where an exporter cannot tell whether an item is controlled, but the announcement is explicit that this is advisory. There is no route to contest a licensing refusal or an enforcement action under it <span class="inf">(inferred)</span>.',source:{name:'MOFCOM Announcement 2025 No. 62 — official text',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_6cb42957741440c6984de696b70df9ae.html'},source2:{name:'MOFCOM and GAC Announcement 2025 No. 70 — suspension until Nov 10, 2026',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_b1ec77dd3f0d4762952904df7cdaadec.html'},source3:{name:'MOFCOM Announcement 2025 No. 61 — the companion overseas-items controls',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_7fc9bff0fb4546ecb02f66ee77d0e5f6.html'},source4:{name:'Extraterritorial jurisdiction under Announcements 61 and 62 — AllBright Law Offices',url:'https://www.allbrightlaw.com/CN/10475/3a06a97d81b99e4d.aspx'}},
  'https://npcobserver.com/legislation/national-security-law/':{title:'National Security Law of the PRC (2015)',subtitle:'NPC Standing Committee · Adopted and effective July 1, 2015 · 7 chapters, 84 articles',objective:['Recasts national security as an all-domain concept rather than a matter of espionage and defence','Its practical significance is Article 59, which creates the national security review machinery that later instruments run on'],nodal:['Enacted by the National People’s Congress Standing Committee, replacing the narrower 1993 law of the same name, which had been repealed by the Counter-Espionage Law in 2014','Article 5 places direction with the central national security leadership institution; in practice every ministry carries obligations under it'],scope:['Article 2 defines national security as a state in which the regime, sovereignty, unity, territorial integrity, welfare of the people, sustainable economic and social development, and other major interests are relatively free from danger','The law then runs that definition across political, territorial, military, economic, financial, cultural, social, technological, information, ecological, resource and nuclear security','That breadth is the legal root from which nearly every other instrument on this map grows'],restrictions:['<strong>Article 59 is the operative provision</strong>. It establishes systems and mechanisms for national security review and oversight, covering foreign investment, specific items and key technologies, network information technology products and services, construction projects involving national security matters, and other major activities that affect or may affect national security','The foreign investment security review, the cybersecurity review and the export control regime all descend from that single article','Articles 19 to 21 direct the state to safeguard economic, financial and resource security, which is what makes economic security a national security matter rather than a policy preference'],retaliation:['The Law is framework legislation. It sets objectives and creates review machinery, but imposes no penalties of its own and names no measures against foreign parties','Its coercive effect is indirect and comes through the instruments enacted under it, each of which cites this Law as its basis'],remedies:'None. The Law creates review mechanisms without providing any route to contest their outcome, a pattern the instruments made under it repeat <span class="inf">(inferred)</span>.',source:{name:'National Security Law of the PRC (2015) — State Council official text',url:'https://www.gov.cn/zhengce/2015-07/01/content_2893902.htm'},source2:{name:'National Security Law — NPC Observer',url:'https://npcobserver.com/legislation/national-security-law/'}},
  'https://npcobserver.com/legislation/foreign-relations-law/':{title:'Foreign Relations Law of the PRC (2023)',subtitle:'NPC Standing Committee · Adopted June 28, 2023 · Effective July 1, 2023 · 6 chapters, 45 articles',objective:['China’s first comprehensive statute on the conduct of foreign relations','Its significance for this map is Article 33, which converts retaliation from practice into a statutory right'],nodal:['Adopted by the Standing Committee of the National People’s Congress, not the full Congress','Article 33 places the work with the State Council and its departments, which are to make the regulations and build the mechanisms that give effect to countermeasures'],scope:['Reaches conduct that violates international law and the basic norms of international relations and damages China’s sovereignty, security or development interests','The formulation is deliberately open: it names no sector, no threshold and no category of actor','Article 32 separately directs the state to strengthen the implementation and application of foreign-related laws, and to use law enforcement and judicial measures to that end'],restrictions:['Article 33 paragraph 1 asserts the right to take corresponding countermeasures and restrictive measures','Paragraph 2 directs the State Council and its departments to formulate the necessary administrative regulations and departmental rules, establish working systems and mechanisms, and determine and implement the measures','The Law itself prescribes no specific measure, which is why it functions as the umbrella authority rather than as an operative instrument'],retaliation:['It supplies the statutory footing later instruments rely on, including Decree 835, the Unreliable Entity List and the Anti-Foreign Sanctions regime','Article 35 separately governs implementation of United Nations Security Council sanctions','Its practical effect is to make retaliation against foreign trade and technology restrictions presumptively lawful as a matter of Chinese law <span class="inf">(inferred)</span>'],remedies:'None. Article 33 paragraph 3 provides expressly that decisions made under the first and second paragraphs are final decisions, which places countermeasures beyond administrative reconsideration and judicial review alike.',source:{name:'Foreign Relations Law of the PRC — Ministry of Foreign Affairs official text',url:'https://www.mfa.gov.cn/web/wjb_673085/zfxxgk_674865/zcfg/fl/202306/t20230628_11105189.shtml'},source2:{name:'Foreign Relations Law — NPC Observer',url:'https://npcobserver.com/legislation/foreign-relations-law/'}},
  'https://npcobserver.com/legislation/anti-foreign-sanctions-law/':{title:'Anti-Foreign Sanctions Law of the PRC (2021)',subtitle:'NPC Standing Committee · Adopted and effective June 10, 2021 · 16 articles · Implementing regulations, State Council Decree No. 803, March 23, 2025',objective:['Answers foreign sanctions by penalising those who impose them, and those who carry them out','The 2025 implementing regulations turned a short framework law into an operational regime'],nodal:['Relevant departments of the State Council decide listings and measures','Decree 803 Article 10 names the coordination mechanism: the foreign affairs, commerce, development and reform, and justice administration departments'],scope:['Reaches foreign individuals and organisations that formulate, decide on, or implement discriminatory measures against Chinese citizens or entities','Article 5 extends listing to the spouses and immediate relatives of a listed individual, to senior managers and actual controllers of a listed organisation, to organisations where a listed individual is a senior manager, and to organisations they control or helped establish and run','Complying with a foreign sanction can itself be the offence, which is what places multinationals between two legal systems'],restrictions:['Article 12 bars any organisation or individual from executing or assisting a foreign discriminatory measure against Chinese citizens or entities','Decree 803 Article 13 adds penalties for domestic parties that fail to implement a countermeasure, including government procurement restrictions and data transfer prohibitions'],retaliation:['Article 6 allows one or more of: refusing or revoking visas, barring entry, and deportation; sealing, seizing and freezing movable and immovable property in China; <strong>prohibiting or restricting</strong> transactions and cooperation with organisations and individuals in China; and other necessary measures','Decree 803 makes those concrete, reaching transactions in education, technology, legal services, environmental protection, trade, culture, tourism, health and sport, alongside export restrictions, investment bans, data restrictions, cancellation of work permits, and fines (Articles 6 to 9)','A Chinese party harmed by another party’s execution of a foreign discriminatory measure may sue in the People’s Court for cessation and damages (Article 12; Decree 803, Article 18)'],remedies:'Article 7 states that decisions made under Articles 4 to 6 are final, so there is no appeal and no judicial review. What Decree 803 adds, at Articles 14 and 15, is a request route: a listed party may apply for a countermeasure to be suspended, changed or cancelled on evidence that it has corrected the conduct. That is removal by rectification, not a challenge to the decision.',source:{name:'Anti-Foreign Sanctions Law of the PRC — official text',url:'https://wb.beijing.gov.cn/home/zwxx/zcfg/flfg/202407/t20240704_3737947.html'},source2:{name:'Provisions on Implementing the Anti-Foreign Sanctions Law, State Council Decree No. 803 (2025)',url:'https://www.mee.gov.cn/zcwj/gwywj/202503/t20250325_1104650.shtml'},source3:{name:'Anti-Foreign Sanctions Law — NPC Observer',url:'https://npcobserver.com/legislation/anti-foreign-sanctions-law/'}},
  'https://npcobserver.com/legislation/foreign-trade-law/':{title:'Foreign Trade Law of the PRC (1994; revised 2004, 2016, 2022, 2026)',subtitle:'NPC · Enacted 1994 · Major WTO-accession rewrite 2004 · Amended 2016 and 2022 · Latest revision passed Dec 27, 2025, effective Mar 1, 2026',objective:['China’s founding trade statute, and the parent authority for much of this map','Sets the terms on which goods, technology and services cross the border','Supplies the legal basis for the licensing, investigation and countermeasure regimes built on top of it'],nodal:['Enacted by the Standing Committee of the National People’s Congress','The Ministry of Commerce (MOFCOM), as the State Council’s foreign trade department, enforces the restrictions, licences, investigations and countermeasures made under it'],scope:['The revision effective March 1, 2026 runs to 11 chapters and 83 articles','It renumbered the law substantially: the reciprocity clause moved from Article 7 to Article 10, and the investigation power from Article 37 to Article 41','Not every revision weighed the same. 2016 was a narrow twelve-law package amendment touching only foreign labour cooperation qualifications; 2022 removed the foreign trade operator registration requirement','The substantive expansions are 2004 and 2026'],restrictions:['Power to restrict or prohibit the import and export of goods and technologies on any of the twelve grounds in Article 18, national security, public health and safety, the environment, and domestic industry among them','Authority to maintain prohibited and restricted lists and impose temporary restrictions (Article 20), and to run quotas and licensing for restricted items (Article 21)','A standing power to investigate, reaching trade barriers, dumping and subsidy questions, circumvention of trade remedies, and national security matters, opened by public notice and run through questionnaires, hearings, and site visits (Articles 41, 42)','Article 53 requires early warning and emergency response mechanisms across goods, technology, and services trade, together with trade policy assessment: the proactive monitoring layer the revision adds'],retaliation:['Where a country or region applies discriminatory prohibitions, restrictions, or similar measures against China in trade, China may take "corresponding measures" in return (Article 10)','Article 40 attaches trade prohibitions and restrictions to foreign organisations or individuals that breach normal market transaction principles by interrupting normal transactions with Chinese persons or organisations and seriously harm their lawful rights, or that endanger China\'s sovereignty, security, or development interests; this is the same trigger language the Unreliable Entity List uses','Serves as the legal foundation for the Technology Export Catalogue, the licensing rules, the trade barrier investigation regime, and the Unreliable Entity List'],remedies:'The Law is framework legislation and does not itself set out a challenge route; recourse depends on the specific instrument made under it, which is why the anti-dumping and countervailing regulations provide for reconsideration and litigation while the trade barrier rules do not <span class="inf">(inferred)</span>.',source:{name:'Foreign Trade Law (2025 revision, effective March 1, 2026) — MOFCOM full text',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_03fbae1ec4bd48459099930e803bce5e.html'},source2:{name:'Foreign Trade Law — NPC Observer',url:'https://npcobserver.com/legislation/foreign-trade-law/'},source3:{name:'China Amends Foreign Trade Law to Expand Countermeasure Toolkit — Covington & Burling',url:'https://www.cov.com/en/news-and-insights/insights/2026/01/china-amends-foreign-trade-law-to-expand-countermeasure-toolkit'}},
  'https://npcobserver.com/legislation/export-control-law/':{title:'Export Control Law of the PRC (2020)',subtitle:'NPC Standing Committee · Effective December 1, 2020',objective:['China’s first unified export control statute, replacing a patchwork of non-proliferation rules','It is the parent authority for Decree 792, the control lists and the rare earth announcements'],nodal:['Passed by the National People’s Congress Standing Committee','The Ministry of Commerce (MOFCOM) is the export control authority and issues licences; Customs enforces at the border'],scope:['Covers dual-use items, military items, and nuclear items, plus goods, technologies and services whose export affects "national security and interests"','That last ground reaches well beyond proliferation and is what allows critical minerals and rare earths to be treated as controlled items','Temporary controls may be placed on unlisted items for up to two years at a time, without advance warning'],restrictions:['A licence is required for each export of a controlled item, supported by end-user and end-use documentation, with authority to verify afterwards how a foreign buyer actually used the goods','A catch-all obligation applies where the exporter knows or should know the item is destined for a controlled end use, even if it is not listed','Article 44 reaches foreign organisations and individuals who breach the export control rules and thereby endanger China’s security and interests. The narrower rule that follows Chinese-origin content into goods made abroad sits in Decree 792, Article 49, rather than in the Law itself'],retaliation:['<strong>Article 34</strong>: unlicensed export, exceeding a licence, or exporting prohibited items brings orders to stop, confiscation of unlawful gains, and a fine of five to ten times the illegal business amount where that reaches RMB 500,000, or RMB 500,000 to 5 million where it does not. Serious cases bring suspension for rectification or revocation of export qualifications','<strong>Article 39</strong>: a penalised exporter can be refused new licence applications for five years, and responsible individuals barred from export activity for five years. Those criminally punished are barred for life','Criminal liability is referred out to the criminal law; the Law itself sets no term of imprisonment','<strong>Article 48</strong>: where any country or region abuses export controls to harm China’s security and interests, China may take reciprocal measures against it. This is the express retaliation hook'],remedies:'The Law sets out licensing and penalties without providing a dedicated appeal. Nothing in it establishes reconsideration or litigation against a licensing refusal <span class="inf">(inferred)</span>.',source:{name:'Export Control Law of the PRC — MOFCOM export control portal',url:'https://exportcontrol.mofcom.gov.cn/article/zcfg/gnzcfg/flfg/202111/226.html'},source2:{name:'Export Control Law — NPC Observer',url:'https://npcobserver.com/legislation/export-control-law/'},source3:{name:'Dual-Use Items Export Control Regulations, Decree No. 792 — the implementing regulation',url:'https://www.mee.gov.cn/zcwj/gwywj/202410/t20241021_1089760.shtml'}},
  'https://www.chinalawtranslate.com/en/datasecuritylaw/':{title:'Data Security Law of the PRC (2021)',subtitle:'NPC Standing Committee · Adopted June 10, 2021 · Effective September 1, 2021 · 55 articles',objective:['Establishes data security as a national security matter and sorts data by how much damage its loss would do','It also carries two provisions that operate outward: a blocking rule on foreign law enforcement requests, and a reciprocity clause'],nodal:['Article 6 spreads responsibility rather than centralising it. Each region and department secures the data it collects, and sector regulators in industry, telecoms, transport, finance, natural resources, health, education and science and technology regulate within their fields','Public security and state security organs regulate within their remits, and the Cyberspace Administration of China coordinates online data security overall'],scope:['Applies to data handling inside China, and to handling outside China that harms China’s national security or public interest','Article 21 creates a categorical and hierarchical system. <strong>Core state data</strong> covers data bearing on national security, the lifeline of the national economy, important aspects of people’s livelihoods and major public interests, and attracts a stricter management system','Catalogues of <strong>important data</strong> are drawn up by each region and department for their own sectors, which leaves the boundary to the regulator rather than the statute'],restrictions:['<strong>Article 36</strong>: organisations and individuals in China must not provide data stored in China to foreign judicial or law enforcement bodies without approval from the competent Chinese authorities. Requests are handled through treaties or on the principle of reciprocity','<strong>Article 24</strong>: data handling that affects or may affect national security is subject to a data security review','<strong>Article 31</strong>: export of data collected by critical information infrastructure operators follows the Cybersecurity Law; for other handlers, the CAC sets the measures','Article 25 applies export controls to data that is a controlled item'],retaliation:['<strong>Article 26</strong> is the coercion hook: where any country or region takes discriminatory or restrictive measures against China on data, or on investment and trade in data development technology, China may take equivalent measures in return','<strong>Article 45</strong>: failing data security obligations brings correction orders, warnings and fines of RMB 50,000 to 500,000, with RMB 10,000 to 100,000 on responsible individuals; refusal to correct, or a large leak, raises this to RMB 500,000 to 2 million plus suspension or revocation of licences','Violating the core state data regime in a way that endangers sovereignty, security or development interests brings <strong>RMB 2 million to 10 million</strong>, suspension or revocation, and criminal liability where a crime is made out (Article 45)','Handing data to a foreign judicial or law enforcement body without approval brings a warning and RMB 100,000 to 1 million, rising where serious consequences follow (Article 48)'],remedies:'Article 24 states that data security review decisions made in accordance with law are final decisions, which forecloses challenge to the review outcome. The Law provides no other route <span class="inf">(inferred)</span>.',source:{name:'Data Security Law of the PRC — China Law Translate',url:'https://www.chinalawtranslate.com/en/datasecuritylaw/'},source2:{name:'Provisions on Promoting and Regulating Cross-Border Data Flows, CAC Order No. 16 (2024)',url:'https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm'}},
  'https://www.chinalawtranslate.com/en/22075-2/':{title:'Cybersecurity Law of the PRC (2017, revised 2025)',subtitle:'NPC Standing Committee · Adopted Nov 7, 2016, effective June 1, 2017 · Revised Oct 28, 2025, effective January 1, 2026 · 81 articles',objective:['Builds the domestic security regime for networks and data, and creates the Critical Information Infrastructure category','For foreign firms its significance is procurement: it makes access to whole sectors conditional on a security review'],nodal:['The Cyberspace Administration of China (CAC) is the lead regulator, working with State Council departments','Which operators count as critical information infrastructure is settled by sector regulators under separate protection regulations, not by the Law itself'],scope:['<strong>Article 33</strong> names the sectors receiving key protection: public communication and information services, power, transport, water, finance, public services, and e-government. Healthcare and defence are not among them','The 2025 revision, in force from January 2026, added Article 20 on artificial intelligence, directing state support for basic research, algorithms, training data and computing infrastructure, alongside AI ethics rules and security supervision','It also aligned personal information handling with the Civil Code and the Personal Information Protection Law'],restrictions:['<strong>Article 37</strong>: a critical information infrastructure operator purchasing network products or services that might affect national security must undergo a national security review organised by the CAC with State Council departments','<strong>Article 39</strong>: personal information and important data collected or produced by such operators inside China must be stored in China; providing it abroad where genuinely necessary requires a security assessment','Network operators must give technical support and assistance to public security and state security organs. The Law requires cooperation rather than mandating built-in access interfaces'],retaliation:['A product or service that fails the security review can be shut out of an entire sector, which is where the commercial force lies','Chapter VI carries the penalties, running to orders to cease, warnings, confiscation of unlawful gains, and fines, with heavier exposure for critical information infrastructure operators','Forms the legal basis for the Cybersecurity Review Measures and for the cross-border data transfer regime'],remedies:'The Law provides no dedicated challenge route. Recourse would fall back on general administrative reconsideration and litigation law rather than anything the Law itself supplies <span class="inf">(inferred)</span>.',source:{name:'Cybersecurity Law of the PRC (2026 revised version) — China Law Translate',url:'https://www.chinalawtranslate.com/en/22075-2/'},source2:{name:'NPC Standing Committee Decision amending the Cybersecurity Law, 28 October 2025',url:'http://www.npc.gov.cn/npc/c2/c30834/202510/t20251028_449048.html'}},
  'https://www.mee.gov.cn/zcwj/gwywj/202410/t20241021_1089760.shtml':{title:'Dual-Use Export Control Regulations (December 2024)',subtitle:'State Council Decree No. 792 · Signed Sept 30, 2024 · Effective December 1, 2024 · Administered by MOFCOM',objective:['Article 1 states the aim as safeguarding national security and interests, honouring non-proliferation obligations, and strengthening control over dual-use exports','It is the implementing regulation for the Export Control Law: State Council Decree No. 792, six chapters and 50 articles'],nodal:['Article 4 places dual-use export control with the State Council’s commerce department, the Ministry of Commerce (MOFCOM)','Customs acts as the gate: Article 21 requires it to withhold release of goods lacking a valid licence','Other State Council departments coordinate within their own remits'],scope:['Roughly 700 items across ten industrial categories, each split into five types: equipment and components, test and production equipment, materials, software, and technology','The unified control list issued by Announcement 2024 No. 51 consolidated previously scattered lists covering nuclear, missile, biological and chemical items: it gathered existing controls rather than widening them','Article 12 allows temporary controls on unlisted items, each round capped at two years and renewable twice before permanent listing'],restrictions:['A licence is required for each export of a listed item (Article 14); exporters must submit end-user and end-use certification from the final user (Article 24), and Article 23 establishes ongoing risk management and verification of how items are actually used','A catch-all obligation sits on the exporter, not the regulator: where the conditions in Export Control Law Article 12(3) are met, a licence is needed even for an unlisted item (Article 14). The exporter must assess this itself and may consult the authorities where unsure','Article 49 reaches outside China. Where overseas parties transfer or supply, to specified destinations or specified entities, items made abroad that contain, integrate or are mixed with specified Chinese-origin dual-use items, or that were made using specified Chinese-origin technology, MOFCOM may require them to comply with these Regulations. The power is discretionary and target-specific rather than a blanket rule','Article 43 cuts the other way: accepting or promising to accept a foreign government\'s export-control-related visit or on-site inspection, without authorisation, is itself a violation. This is a blocking provision sitting inside the export control regime','Importers and end users who fail to cooperate with end-use verification can be placed on a watch list (Article 26); those who breach end-use terms, may endanger national security, or divert items to terrorism can go on the control list (Article 28)'],retaliation:['Unlicensed export, exceeding a licence\'s scope or validity, exporting prohibited items, or evading control by modifying or splitting items into parts are penalised under Export Control Law Article 34 (Article 39)','Failure to report: warning and correction order; where illegal turnover reaches RMB 500,000, a fine of five to ten times that turnover, otherwise RMB 500,000 to 3 million. Agents, freight forwarders, couriers, customs brokers, e-commerce platforms and financial service providers face up to RMB 100,000, rising to RMB 100,000 to 500,000 in serious cases (Article 40)','Abetting evasion: confiscation plus three to five times illegal gains where these reach RMB 100,000, otherwise RMB 100,000 to 500,000 (Article 41). Domestic importers or end users who break commitments face similar multiples plus RMB 300,000 to 3 million, and MOFCOM can refuse to accept their end-use certifications for five years (Article 42)','Accepting a foreign government inspection without authorisation: up to RMB 500,000, rising to RMB 500,000 to 3 million in serious cases, and suspension of business for rectification where especially serious (Article 43)','Control list designation brings prohibition or restriction of the relevant transactions, suspension of exports, and "other necessary measures" (Article 29)','Article 46 refers criminal liability out to the criminal law rather than creating offences here; the Regulations themselves impose administrative penalties and specify no prison term'],remedies:'Article 30 offers a corrective route rather than an appeal: an entity on the control list that cooperates with the investigation, states the facts truthfully, stops the conduct, eliminates the harm, and gives and honours undertakings may apply to be removed. The Regulations contain no provision for administrative reconsideration or litigation, which would have to come from the Export Control Law or general administrative law <span class="inf">(inferred)</span>.',source:{name:'Regulations on Export Control of Dual-Use Items, State Council Decree No. 792 — full text',url:'https://www.mee.gov.cn/zcwj/gwywj/202410/t20241021_1089760.shtml'},source2:{name:'Unified Dual-Use Items Export Control List, Announcement 2024 No. 51 — State Council',url:'https://www.gov.cn/zhengce/zhengceku/202411/content_6987846.htm'},source3:{name:'Dual-Use Items Export Control List — MOFCOM official PDF',url:'https://picpolicy.mofcom.gov.cn/file/20241120/56691732080580306.pdf'},source4:{name:'China Dual-Use Export Control Regulation — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-dual-use-export-control-regulation/'}},
  'https://exportcontrol.mofcom.gov.cn/article/zcfg/gnzcfg/zcfggzqd/202412/1072.html':{title:'MOFCOM Announcement 2024 No. 46 — Critical Mineral Controls on the US',subtitle:'MOFCOM · Issued Dec 3, 2024 · Paragraph 2 suspended by Announcement 2025 No. 72 until Nov 27, 2026',objective:['A country-specific tightening of dual-use export control aimed squarely at the United States','Issued the day after Washington expanded its own entity listings','Converts the general export control machinery into a targeted instrument against a single destination'],nodal:['Issued by the Ministry of Commerce (MOFCOM) under the Export Control Law','Customs enforces at the border'],scope:['Two distinct paragraphs, which matter separately because only one is currently in force','<strong>Paragraph 1</strong>: prohibits export to the United States of dual-use items destined for military users or military end use','<strong>Paragraph 2</strong>: covers gallium, germanium, antimony and superhard materials, and applies stricter end-user and end-use review to graphite','A closing clause asserts liability against parties in any country who transfer Chinese-origin controlled items onward to the United States'],restrictions:['<strong>Paragraph 1, in force</strong>: no export of dual-use items to United States military users or for military end use','<strong>Paragraph 2, currently suspended</strong>: exports of gallium, germanium, antimony and superhard materials to the United States are in principle not licensed, and graphite exports face stricter end-user and end-use review','Announcement 2025 No. 72, issued November 9, 2025, suspended paragraph 2 from that date until November 27, 2026. As things stand the mineral-specific measures are not operating; the military end-use ban in paragraph 1 is unaffected <span class="obs">(in practice)</span>','The announcement asserts reach over organisations and individuals in any country who transfer or supply Chinese-origin controlled items onward to United States parties'],retaliation:['Denial of export licences, which for the listed minerals under paragraph 2 was effectively categorical while that paragraph operated','The leverage rests on concentration of supply rather than on the penalty schedule. On USGS figures China accounted for about 99% of world primary low-purity gallium production in 2024 and roughly 60% of germanium; it produced close to 80% of natural graphite, and around 48% of antimony <span class="obs">(in practice)</span>','Enforcement against violations runs through the Export Control Law and Decree 792 rather than through this announcement, which sets policy rather than penalties','The suspension of paragraph 2 followed the November 2025 trade understanding, which fits the wider pattern of these measures being switched on and off alongside the state of the relationship rather than on their own timetable <span class="inf">(inferred)</span>'],remedies:'None provided. The announcement is a licensing-policy instrument and sets out no route to contest a refusal. Any recourse would have to come from the Export Control Law or general administrative law <span class="inf">(inferred)</span>.',source:{name:'MOFCOM Announcement 2024 No. 46 — official text, MOFCOM export control portal',url:'https://exportcontrol.mofcom.gov.cn/article/zcfg/gnzcfg/zcfggzqd/202412/1072.html'},source2:{name:'MOFCOM Announcement 2025 No. 72 — suspending paragraph 2 until November 27, 2026',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_5c68985a6b1a46778e2e8dbff1bb1601.html'},source3:{name:'MOFCOM Announcement 2024 No. 46 — mirror, MOFCOM security and control bureau',url:'https://aqygzj.mofcom.gov.cn/flzc/gzjgfxwj/art/2024/art_daaa02c05d8946179dcf5d1ba499ac46.html'},source4:{name:'Gallium: Mineral Commodity Summaries 2025 — USGS',url:'https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-gallium.pdf'},source5:{name:'Critical Mineral Export Bans — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-rare-earth-export-ban/'}},
  'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_9c2108ccaf754f22a34abab2fedaa944.html':{title:'MOFCOM Announcement 2025 No. 18 — Medium & Heavy Rare Earth Controls',subtitle:'MOFCOM + General Administration of Customs · Issued and effective April 4, 2025 · Still fully in force',objective:['Places seven medium and heavy rare earth elements, and the products made from them, under dual-use export licensing','The instrument that turned China’s dominance of rare earth separation and magnet production into a working chokepoint','Nothing covered leaves without a licence, and the licence decision is discretionary'],nodal:['Issued jointly by the Ministry of Commerce (MOFCOM) and the General Administration of Customs','Made under the Export Control Law, the Foreign Trade Law, the Customs Law and Decree 792','Licence applications go to MOFCOM; Customs enforces at the border'],scope:['Seven elements, control codes 1C902 to 1C908: samarium, gadolinium, terbium, dysprosium, lutetium, scandium and yttrium','The text calls them medium <em>and</em> heavy rare earths, not simply heavy: samarium and gadolinium sit in the medium range','For each element it reaches the metal, the oxides and their mixtures, named alloy systems, and sputtering targets, in ingot, block, bar, wire, sheet, rod, plate, tube, granule and powder form','<strong>Finished magnets are caught too</strong>: samarium-cobalt magnets, and neodymium-iron-boron magnets containing terbium or dysprosium. This is what pulls in manufacturers who buy components rather than minerals'],restrictions:['Any export of a covered item requires a dual-use export licence applied for from MOFCOM under the Export Control Law and Decree 792','Coverage extends well past feedstock to finished goods. Because samarium-cobalt and terbium- or dysprosium-bearing NdFeB magnets are themselves listed, ordinary manufacturers buying components rather than raw minerals were pulled into the regime','The announcement is use-neutral on its face: it names no prohibited end use, no military carve-out, and no restricted destination. The discretion sits in the licence decision under Decree 792, and in the end-user and end-use certification its Article 24 requires','It contains no extraterritorial clause of its own; the follow-the-content reach comes from Decree 792 Article 49','Still fully in force. This distinguishes it from the wider October 2025 rare earth package, suspended until November 10, 2026, and from paragraph 2 of Announcement 2024 No. 46, suspended until November 27, 2026. Announcement 18 has never been suspended <span class="obs">(in practice)</span>'],retaliation:['The announcement carries no penalty clause of its own. Enforcement runs through Decree 792 and the Export Control Law, where unlicensed export is punished under Export Control Law Article 34 (Decree 792, Article 39)','The operative pressure is timing rather than refusal. MOFCOM allows itself up to 45 working days to decide, longer where the State Council or military authorities must be consulted; heavy rare earth approvals have in practice run 60 to 120 days case by case, with no published procedure <span class="obs">(in practice)</span>','Documented effect on downstream industry: Ford idled its Chicago plant building the Explorer and its chief executive said the company had shut plants for three weeks for want of high-power magnets used in speakers and in seat, wiper and door motors; Suzuki suspended Swift production from May 26, 2025 <span class="obs">(in practice)</span>','The leverage rests on concentration rather than on the penalty schedule: China accounts for roughly 91% of global refined rare earth output and about 94% of sintered permanent magnet production <span class="obs">(in practice)</span>'],remedies:'None. The announcement creates a licensing requirement without any stated route to contest a refusal, and it says nothing about delay, which is the form the pressure usually takes. Decree 792 provides no reconsideration route either; its nearest analogue is the Article 30 application to be removed from the control list, which does not reach licence decisions <span class="inf">(inferred)</span>.',source:{name:'MOFCOM and GAC Announcement 2025 No. 18 — official text',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_9c2108ccaf754f22a34abab2fedaa944.html'},source2:{name:'China imposes export controls on medium and heavy rare earths — Holland & Knight',url:'https://www.hklaw.com/en/insights/publications/2025/04/china-imposes-export-controls-on-medium-and-heavy-rare-earth-materials'},source3:{name:'Beijing\'s rare earths licensing system: delays by design? — MERICS',url:'https://merics.org/en/comment/beijings-rare-earths-export-licensing-system-delays-design'},source4:{name:'Supply concentration risks become reality — IEA',url:'https://www.iea.org/commentaries/with-new-export-controls-on-critical-minerals-supply-concentration-risks-become-reality'},source5:{name:'Ford idles US plants over China magnet shortage — SupplyChainBrain',url:'https://www.supplychainbrain.com/articles/42058-ford-forced-to-idle-multiple-us-plants-over-china-magnet-shortage'},source6:{name:'China pauses some rare earth curbs, and what it leaves in place — Clark Hill',url:'https://www.clarkhill.com/news-events/news/china-hits-pause-on-rare-earth-export-controls-and-what-it-means-for-supply-chains/'},source7:{name:'China rare earth export controls — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-rare-earth-export-ban/'}},
  'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_59ec4f6bec0b459aa4a30c4bbd0a41c1.html':{title:'MOFCOM Announcement 2025 No. 57 — Five More Medium & Heavy Rare Earths',subtitle:'MOFCOM + General Administration of Customs · Issued Oct 9, 2025 · Was to take effect Nov 8, 2025 · Suspended Nov 7, 2025 until Nov 10, 2026',objective:['Extends the Announcement 18 model to five further medium and heavy rare earths, completing the set of twelve','Its significance lies as much in what happened to it as in what it says: it was suspended the day before it was due to take effect','The clearest example in this map of a control written, published, and then held in reserve'],nodal:['Issued jointly by the Ministry of Commerce (MOFCOM) and the General Administration of Customs, with State Council approval expressly recorded','Made under the Export Control Law, the Foreign Trade Law, the Customs Law and Decree 792','Export operators apply to MOFCOM for licences'],scope:['Five elements, control codes 1C909 to 1C913: holmium, erbium, thulium, europium and ytterbium','As in Announcement 18, the text calls them medium <em>and</em> heavy rare earths, not simply heavy','Each element is split into three limbs: the metal, alloys, targets, permanent magnets, crystals, magnetic refrigeration and magnetostrictive materials; the oxides and their mixtures; and the compounds and their mixtures','Erbium additionally reaches optical fibre and hydrogen storage materials','With the seven elements in Announcement 18, all twelve medium and heavy rare earths would be covered','The light rare earths, neodymium and praseodymium among them, are not listed as elements in either announcement, though NdFeB magnets are caught by Announcement 18 where they contain terbium or dysprosium'],restrictions:['<strong>Currently suspended, and never operative</strong>. The announcement set its own start date at November 8, 2025. Announcement 2025 No. 70, issued November 7, one day earlier, suspended it until November 10, 2026 along with Announcements 55, 56, 58, 61 and 62. It has therefore never actually been in force <span class="obs">(in practice)</span>','Were it to take effect, any export of a covered item would require a dual-use export licence from MOFCOM under the Export Control Law and Decree 792','Like Announcement 18, it names no prohibited end use, no military carve-out, and no restricted destination, and it contains no extraterritorial or re-export clause of its own','The extraterritorial reach in the October 2025 package sat in a separate instrument, Announcement 61, which would have required a Chinese licence for items made abroad where Chinese-origin rare earth content reached 0.1% or more by value. Announcement 62 covered rare earth mining, separation, smelting, magnet-making and recycling technology. Both are suspended on the same timetable'],retaliation:['The announcement carries no penalty clause. Enforcement, had it commenced, would run through Decree 792 and the Export Control Law','Its coercive value has been as a standing threat rather than an operating control. Published on October 9, 2025 amid tariff escalation and suspended on November 7 as part of the trade understanding, it can be reactivated by letting the suspension lapse rather than by legislating afresh <span class="inf">(inferred)</span>','The suspension runs to November 10, 2026, a different date from the November 27, 2026 suspension of paragraph 2 of Announcement 2024 No. 46; the two packages were paused separately and can expire separately','The exemptions sat in the companion instruments and differ: Announcement 61 exempted humanitarian exports, for emergency medical use, public health emergencies and disaster relief, subject to reporting within 10 working days; Announcement 62 exempted technology already in the public domain, technology in basic scientific research, and technology needed for an ordinary patent application'],remedies:'None. As with Announcement 18, the instrument creates a licensing requirement with no stated route to contest a refusal or a delay. Because it never took effect, no licence decisions have been made under it to contest <span class="inf">(inferred)</span>.',source:{name:'MOFCOM and GAC Announcement 2025 No. 57 — official text',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_59ec4f6bec0b459aa4a30c4bbd0a41c1.html'},source2:{name:'MOFCOM and GAC Announcement 2025 No. 70 — suspending Announcements 55, 56, 57, 58, 61 and 62 until Nov 10, 2026',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_b1ec77dd3f0d4762952904df7cdaadec.html'},source3:{name:'MOFCOM Announcement 2025 No. 61 — overseas rare earth items, the 0.1% content rule',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_7fc9bff0fb4546ecb02f66ee77d0e5f6.html'},source4:{name:'MOFCOM Announcement 2025 No. 62 — rare earth technology controls',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_6cb42957741440c6984de696b70df9ae.html'},source5:{name:'Extraterritorial jurisdiction under Announcements 61 and 62 — AllBright Law Offices',url:'https://www.allbrightlaw.com/CN/10475/3a06a97d81b99e4d.aspx'},source6:{name:'China expands export controls on rare earth minerals — National Law Review',url:'https://natlawreview.com/article/china-expands-export-control-rare-earth-minerals-and-more'}},
  'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_c03d1e511b2b486e829d68e8f1422aff.html':{title:'Dual-Use Import/Export Licence Measures (2026 Update)',subtitle:'MOFCOM + General Administration of Customs Announcement 2025 No. 91 · Issued Dec 31, 2025 · Effective January 1, 2026',objective:['Sets out which goods and technologies actually require an import or export licence in a given year','A catalogue rather than a rulebook: it tells traders what is caught, while the operative obligations and penalties sit in the Export Control Law and Decree 792'],nodal:['The Ministry of Commerce (MOFCOM) issues licences','The General Administration of Customs enforces at the border','The two issue the directory jointly, here as Announcement 2025 No. 91'],scope:['Applies to everyone trading controlled dual-use items: exporters, importers, agents and end users','The 2026 directory superseded the 2024 version and added roughly 80 to 85 controlled entries','Additions include fentanyl-related drug precursors, heavy tungsten-nickel alloys, samarium rare earth materials, indium-based semiconductor materials, and bismuth and tellurium used in infrared, thermoelectric and radiation detection','Electric vehicles were added in the same December 2025 round but to a <em>separate</em> list, the export licence management directory, not this one'],restrictions:['A licence is required for each shipment of a listed item, supported by end-user and end-use certification from the final user (Decree 792, Article 24)','A directory revision can bring in a product that previously needed no licence, as the 2026 round did across several rare earth, semiconductor, and precursor materials; the obligation attaches on the effective date without any transition for goods already contracted','Failing to cooperate with end-use verification can put an importer or end user on the watch list, and breaching end-use terms can lead to the control list (Decree 792, Articles 26 and 28); the consequence follows from the Regulations rather than from this directory'],retaliation:['The directory itself imposes no penalties. Enforcement runs through Decree 792: unlicensed export or exceeding a licence is penalised under Export Control Law Article 34 (Article 39), and control list designation can prohibit or restrict transactions or suspend exports outright (Article 29)','Its coercive weight lies in coverage rather than sanction. Each revision decides what needs permission, and permission is what can later be withheld'],remedies:'None in the directory. Removal from the control list under Decree 792 Article 30 is the nearest available route, and it depends on correcting conduct rather than on contesting the listing <span class="inf">(inferred)</span>.',source:{name:'2026 Dual-Use Items and Technologies Import and Export Licence Directory, Announcement 2025 No. 91 — MOFCOM',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_c03d1e511b2b486e829d68e8f1422aff.html'},source2:{name:'Export Licence Management Commodity Directory (2026) — MOFCOM',url:'https://www.mofcom.gov.cn/zcfb/dwmygl/art/2025/art_f7a611068b084ac9b14080a1d3d742db.html'},source3:{name:'Regulations on Export Control of Dual-Use Items, Decree No. 792 — the operative rules',url:'https://www.mee.gov.cn/zcwj/gwywj/202410/t20241021_1089760.shtml'},source4:{name:'2026 Import/Export Licensing Updates — China Briefing',url:'https://www.china-briefing.com/news/china-import-export-licensing-2026-key-compliance-updates/'}},
  'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2020/art_1889a24134054b5b841134c3fba44654.html':{title:'Unreliable Entity List — MOFCOM Order No. 4 of 2020',subtitle:'MOFCOM · Effective September 2020',objective:['Creates a designation regime for foreign firms and individuals whose conduct China judges harmful to its interests or discriminatory against its companies','The blacklist counterpart to the trade instruments: rather than taxing a product, it targets the entity itself'],nodal:['The Ministry of Commerce (MOFCOM) chairs a multi-agency working group','Ministries handling security and foreign affairs also take part'],scope:['Can apply to any foreign company, organisation or individual anywhere, with no minimum size or nationality requirement','As of late 2025 more than 23 entities have been listed','Mostly US defence contractors, Taiwanese aerospace firms, and foreign think tanks or NGOs'],restrictions:['Actions judged to harm China\'s sovereignty, security, or development interests (Article 2)','Interrupting or refusing normal business dealings with Chinese companies without what China considers a legitimate reason, or applying discriminatory measures against Chinese companies, organisations, or individuals (Article 2)','Complying with foreign government sanctions targeting Chinese entities; this alone can count as "discriminatory" <span class="inf">(inferred)</span>','Article 9 allows risk warnings short of listing, and Article 11 bars measures during a rectification period, so designation is staged rather than immediate'],retaliation:['Authorities can restrict or prohibit import and export dealings with the listed entity, cutting off its trade with Chinese companies, and restrict or prohibit its investment in China (Article 10)','Executives and staff can face restricted entry into China, or have existing work permits or residence status restricted or revoked (Article 10)','Fines, and other measures authorities judge necessary, are also available under the same article (Article 10)'],remedies:'There is no appeal against a listing. What the Provisions offer instead is a corrective route: a listed entity can apply for removal after correcting the conduct that led to its designation (Article 13), which keeps the decision in MOFCOM\'s hands throughout.',source:{name:'Unreliable Entity List Regulations — MOFCOM English',url:'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2020/art_1889a24134054b5b841134c3fba44654.html'}},
  'https://www.most.gov.cn/satp/kjzc/zh/202507/t20250716_194194.html':{title:'Catalogue of Technologies Prohibited or Restricted from Export',subtitle:'MOFCOM + Ministry of Science and Technology · Announcement 2023 No. 57, adjusted by Announcement 2025 No. 28 of July 15, 2025',objective:['Controls the export of Chinese technology itself, as distinct from goods: it names the know-how that may not leave the country at all, and the know-how that needs a licence first','Made under the Foreign Trade Law and the Regulations on Administration of Import and Export of Technologies, State Council Decree No. 331','Anything not on the list is freely exportable subject only to contract registration, so the list <em>is</em> the control'],nodal:['Issued jointly by the Ministry of Commerce (MOFCOM) and the Ministry of Science and Technology (MOST)','Decree 331 Article 33 requires MOFCOM to review each export application jointly with the State Council’s science and technology department, that is MOST','Article 51 makes MOFCOM’s approval, licensing, registration and penalty decisions the reviewable acts'],scope:['<strong>Two tiers</strong>: prohibited technologies may not be exported at all (Decree 331, Article 30); restricted technologies are licensed and may not be exported without a licence (Article 31)','After the July 2025 adjustment the Catalogue runs to <strong>132 entries, 23 prohibited and 109 restricted</strong>. The December 2023 revision had compressed it from 164 to 134, being 24 prohibited and 110 restricted','<strong>July 2025 changes</strong>: three entries deleted, one added, one modified. Removed traditional Chinese architecture technology from the prohibited tier, and two restricted entries including building environment control technology. Added battery cathode material preparation technology, covering lithium iron phosphate, lithium manganese iron phosphate and phosphate cathode raw materials. Widened non-ferrous metallurgy technology to add spodumene lithium extraction, metallic lithium preparation and brine lithium extraction','<strong>December 2023 changes</strong>: added human cell cloning and gene editing technology to the prohibited tier, and LiDAR systems, crop heterosis utilisation and bulk material handling to the restricted tier','Export is not confined to shipping. Article 2 defines technology export as transferring technology out of China by trade, investment, or economic and technical cooperation, and expressly includes patent assignment, assignment of patent application rights, patent licensing, transfer of technical secrets, and technical services','Technologies outside the Catalogue are freely exportable, subject only to contract registration with MOFCOM (Articles 37 to 39)','Rare earth process technology is controlled separately, not through this Catalogue: Announcement 2025 No. 62 in Domain 2 covers mining, separation, smelting, magnet manufacturing and recycling under codes 1E902.a and 1E902.b, and is currently suspended'],restrictions:['Prohibited technologies cannot be exported and no licence is available (Article 30)','Restricted technologies need a licence, granted in two stages: MOFCOM, with MOST, must decide whether to approve within <strong>30 working days</strong> of the application and issues a letter of intent (Article 33); once the contract is signed it checks the contract and decides on the licence within <strong>15 working days</strong> (Article 35)','The technology export contract takes effect only from the date the licence is issued (Article 36). An unlicensed deal therefore never becomes binding, rather than being unwound after the event','Because Article 2 reaches investment and economic and technical cooperation, contributing listed technology to a joint venture or an outbound investment is an export requiring the same clearance'],retaliation:['Exporting a prohibited technology, or a restricted one without a licence, carries criminal liability under the Criminal Law provisions on smuggling, illegal business operation, divulging state secrets, or other offences. Decree 331 refers the matter out rather than creating an offence or setting a prison term of its own (Article 44)','Where conduct is not serious enough for criminal punishment: penalties under the Customs Law, or a MOFCOM warning, confiscation of illegal gains, and a fine of <strong>one to five times</strong> those gains. MOFCOM may also revoke the foreign trade operating licence (Article 44)','Exporting beyond the licensed scope brings the same criminal referral, or a warning, confiscation and a fine of <strong>one to three times</strong> illegal gains, with suspension or revocation of the trade licence (Article 45)','The Catalogue has been used as leverage over a foreign forced sale. The August 2020 revision, the first since 2008, added personalised information push service technology based on data analysis and artificial intelligence interactive interface technology. That captured TikTok’s recommendation algorithm, so any sale of it needed MOFCOM approval, and ByteDance confirmed it would abide by the amended rules <span class="obs">(in practice)</span>'],remedies:'Unusually for the instruments on this map, a route exists. Article 51 of Decree 331 allows a party dissatisfied with MOFCOM’s approval, licensing, registration or administrative penalty decision to apply for administrative reconsideration <em>or</em> to sue in the People’s Court, with no requirement to exhaust reconsideration first.',source:{name:'MOFCOM and MOST Announcement 2025 No. 28, adjusting the Catalogue — MOST official',url:'https://www.most.gov.cn/satp/kjzc/zh/202507/t20250716_194194.html'},source2:{name:'MOFCOM and MOST Announcement 2023 No. 57, the base Catalogue — MOST official',url:'https://www.most.gov.cn/tztg/202312/t20231221_189244.html'},source3:{name:'Regulations on Administration of Import and Export of Technologies, State Council Decree No. 331 — gov.cn gazette',url:'https://www.gov.cn/gongbao/content/2019/content_5468926.htm'},source4:{name:'China revises the Catalogue, December 2023 — Covington & Burling',url:'https://www.cov.com/en/news-and-insights/insights/2023/12/china-revises-catalogue-of-technologies-prohibited-or-restricted-from-export'},source5:{name:'Revisions to the Catalogue, August 2020 (the ByteDance additions) — CSET Georgetown',url:'https://cset.georgetown.edu/publication/revisions-to-the-content-of-the-catalog-of-prohibited-or-restricted-technology-exports/'},source6:{name:'ByteDance says it will abide by amended China export rules, August 2020 — CNBC',url:'https://www.cnbc.com/2020/08/31/tiktok-sale-bytedance-says-it-will-abide-by-amended-china-export-rules.html'},source7:{name:'China export control catalog, July 2025 — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-export-control-catalog-july-2025/'}},
  'https://www.gov.cn/zhengce/content/202604/content_7064837.htm':{title:'Regulations on Industrial & Supply Chain Security (Decree 834)',subtitle:'State Council · Effective March 31, 2026',objective:['Defends China’s own supply chains','Where Decree 835 punishes foreign actors who apply another state’s measures against China, this decree guards the chains themselves','It polices who gathers information about them, and empowers investigations into specific transactions'],nodal:['Administered by the State Council’s relevant departments','Supply chain security investigations are run into specific import and export transactions'],scope:['Foreign entities that gather information on China’s supply chains without authorisation','Foreign organisations and individuals whose conduct is judged to threaten supply chain security','Domestic entities that fail to comply with the decree’s own requirements'],restrictions:['A foreign entity carrying out unauthorised information-gathering on China\'s supply chains (Article 13)','Authorities opening a supply chain security investigation into a specific import or export transaction (Article 14)','A foreign organisation or individual under investigation for conduct threatening supply chain security (Article 15)'],retaliation:['A supply chain security investigation can result in import or export prohibitions, restrictions, or a special fee on the specific transaction under review (Article 14)','A foreign organisation or individual found responsible can face trade restrictions, investment bans, transaction prohibitions, or entry restrictions (Article 15)','Domestic entities that fail to comply face procurement and bidding restrictions, plus data-sharing prohibitions, as penalties (Article 16)','Works alongside Decree 835: this decree defends China\'s own supply chains, the other punishes foreign actors seen as disrupting them'],remedies:'The decree does not set out a route to contest a supply chain security determination. General administrative reconsideration and litigation law may apply, but nothing in the text provides for it <span class="inf">(inferred)</span>.',source:{name:'Decree 834 — State Council Legislative Portal',url:'https://www.gov.cn/zhengce/content/202604/content_7064837.htm'},source2:{name:'Decree 834 Analysis — Baker McKenzie Sanctions News',url:'https://sanctionsnews.bakermckenzie.com/china-introduces-new-state-council-decrees-on-supply-chain-security-and-countering-unjustifiable-extraterritorial-measures/'}},
