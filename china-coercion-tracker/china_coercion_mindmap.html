const POPUP_DATA = {
  'https://npcobserver.com/legislation/national-security-law/':{title:'National Security Law of the PRC (2015)',subtitle:'NPC Standing Committee · Enacted July 2015',nodal:'The National People\'s Congress Standing Committee, China\'s top legislature, passed the law. It is enforced through the National Security Commission and effectively every government ministry.',scope:'Defines "national security" to cover almost every sphere of life: politics, the military, the economy, culture, society, technology, the environment, nuclear matters, and natural resources. This broad definition is the legal root that nearly every other coercive law on this map grows from.',trigger:['Any transaction, investment, technology transfer, or foreign activity that the government judges to threaten any of these broadly defined areas','The government\'s power to review and intervene never expires and can be used at any time','There is no minimum size or threshold: even a small deal can be captured, and virtually every other coercive instrument cites this law as its legal basis'],action:['Requires the state to take "necessary measures" to identify and remove security risks across the economy, finance, and natural resources','Provides the legal foundation for nearly every other instrument on this map, including export controls, entity blacklists, and supply chain directives <span class="obs">(in practice)</span>','Grants the government sweeping power to intervene in any sector of the economy, without requiring court approval'],source:{name:'National Security Law — NPC Observer',url:'https://npcobserver.com/legislation/national-security-law/'}},
  'https://npcobserver.com/legislation/foreign-relations-law/':{title:'Foreign Relations Law of the PRC (2023)',subtitle:'NPC · Enacted June 2023',nodal:'Passed by China\'s national legislature, the National People\'s Congress. Carried out by the State Council (China\'s cabinet) and the Ministry of Foreign Affairs.',scope:'Gives China, for the first time, an explicit legal right to retaliate against any foreign actor it says has harmed its sovereignty, security, or development interests. Earlier retaliation was ad hoc; this law puts it into formal statute.',trigger:['A foreign government, organisation, or individual is judged to have harmed Chinese sovereignty, security, or development interests','A foreign country imposes export controls, investment restrictions, or technology bans affecting Chinese companies <span class="inf">(inferred)</span>','Allied countries coordinate policies aimed at reducing dependence on, or containing, China <span class="inf">(inferred)</span>'],action:['Allows the State Council to impose "countermeasures and restrictive measures" without specifying limits on type or severity','Provides the legal cover that later, more specific instruments, such as Decree 835 and the Unreliable Entity List, rely on','Makes retaliatory measures against foreign trade or technology restrictions presumptively lawful under Chinese law'],source:{name:'Foreign Relations Law — NPC Observer',url:'https://npcobserver.com/legislation/foreign-relations-law/'}},
  'https://npcobserver.com/legislation/anti-foreign-sanctions-law/':{title:'Anti-Foreign Sanctions Law of the PRC (2021)',subtitle:'NPC Standing Committee · Enacted June 2021',nodal:'Passed by the National People\'s Congress Standing Committee. Enforced jointly by the Ministry of Foreign Affairs and the Ministry of Commerce (MOFCOM).',scope:'Targets foreign individuals and organisations involved in imposing sanctions on Chinese citizens or companies. Simply complying with a foreign sanction, even where a company has little choice, can itself be treated as the offence, putting multinationals in a bind.',trigger:['A foreign government or organisation creates, decides on, or carries out sanctions against Chinese people or companies','A company complies with foreign sanctions in a way China judges harmful to its citizens or entities; compliance itself can trigger listing'],action:['Visa bans and entry restrictions; freezing of any China-based assets belonging to those listed','A total ban on any transaction with Chinese entities','Deportation of executives based in China','A right for Chinese parties to sue for damages in Chinese courts','No independent appeal; the only recourse is asking the Ministry of Foreign Affairs to reconsider'],source:{name:'Anti-Foreign Sanctions Law — NPC Observer',url:'https://npcobserver.com/legislation/anti-foreign-sanctions-law/'}},
  'https://npcobserver.com/legislation/foreign-trade-law/':{title:'Foreign Trade Law of the PRC (1994; revised 2004, 2016, 2022, 2026)',subtitle:'NPC · Enacted 1994 · Major WTO-accession rewrite 2004 · Amended 2016 and 2022 · Latest revision passed Dec 27, 2025, effective Mar 1, 2026',objective:'China\'s founding trade statute and the parent authority for much of this map. It sets the terms on which goods, technology, and services cross the border, and supplies the legal basis for the licensing, investigation, and countermeasure regimes built on top of it.',nodal:'Enacted by the Standing Committee of the National People\'s Congress. The Ministry of Commerce (MOFCOM), as the State Council\'s foreign trade department, is the main body enforcing restrictions, licences, investigations, and countermeasures under it.',scope:'The revision effective March 1, 2026 runs to 11 chapters and 83 articles, and renumbered the law substantially: the reciprocity clause moved from Article 7 to Article 10, and the investigation power from Article 37 to Article 41. Not every revision weighed the same: 2016 was a narrow twelve-law package amendment touching only foreign labour cooperation qualifications, and 2022 removed the foreign trade operator registration requirement. The substantive expansions are 2004 and 2026.',restrictions:['Power to restrict or prohibit the import and export of goods and technologies on any of the twelve grounds in Article 18, national security, public health and safety, the environment, and domestic industry among them','Authority to maintain prohibited and restricted lists and impose temporary restrictions (Article 20), and to run quotas and licensing for restricted items (Article 21)','A standing power to investigate, reaching trade barriers, dumping and subsidy questions, circumvention of trade remedies, and national security matters, opened by public notice and run through questionnaires, hearings, and site visits (Articles 41, 42)','Article 53 requires early warning and emergency response mechanisms across goods, technology, and services trade, together with trade policy assessment: the proactive monitoring layer the revision adds'],retaliation:['Where a country or region applies discriminatory prohibitions, restrictions, or similar measures against China in trade, China may take "corresponding measures" in return (Article 10)','Article 40 attaches trade prohibitions and restrictions to foreign organisations or individuals that breach normal market transaction principles by interrupting normal transactions with Chinese persons or organisations and seriously harm their lawful rights, or that endanger China\'s sovereignty, security, or development interests; this is the same trigger language the Unreliable Entity List uses','Serves as the legal foundation for the Technology Export Catalogue, the licensing rules, the trade barrier investigation regime, and the Unreliable Entity List'],remedies:'The Law is framework legislation and does not itself set out a challenge route; recourse depends on the specific instrument made under it, which is why the anti-dumping and countervailing regulations provide for reconsideration and litigation while the trade barrier rules do not <span class="inf">(inferred)</span>.',source:{name:'Foreign Trade Law (2025 revision, effective March 1, 2026) — MOFCOM full text',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_03fbae1ec4bd48459099930e803bce5e.html'},source2:{name:'Foreign Trade Law — NPC Observer',url:'https://npcobserver.com/legislation/foreign-trade-law/'},source3:{name:'China Amends Foreign Trade Law to Expand Countermeasure Toolkit — Covington & Burling',url:'https://www.cov.com/en/news-and-insights/insights/2026/01/china-amends-foreign-trade-law-to-expand-countermeasure-toolkit'}},
  'https://npcobserver.com/legislation/export-control-law/':{title:'Export Control Law of the PRC (2020)',subtitle:'NPC Standing Committee · Effective December 1, 2020',nodal:'Passed by the National People\'s Congress Standing Committee. The Ministry of Commerce (MOFCOM) leads licensing decisions, Customs (GAC) enforces at the border, and the Ministry of State Security is also involved.',scope:'China\'s first comprehensive export control law, replacing earlier rules limited to non-proliferation goods (nuclear, chemical, biological, missile technology). Covers dual-use and military items, plus anything judged to affect "national security and national interests," a ground broad enough to reach well beyond proliferation. Also follows Chinese-origin components into products re-exported by other countries.',trigger:['Exporting any item on an official control list','Placing temporary controls on an item not yet listed, if judged a national security risk, without advance warning, for up to two years','A third country re-exporting a product with Chinese-origin controlled components','Another country restricting exports to China: the law lets Beijing retaliate against any country it judges to have "abused" export controls against it'],action:['Requires an export licence for every shipment; the government can refuse without giving a reason or allowing appeal','Requires a certificate confirming the end use of the goods, and China can later check how a foreign buyer actually used them','Wilful violations can bring up to 10 years in prison and fines of up to RMB 5 million (roughly $700,000)','Customs can seize cargo at the border without a court order'],source:{name:'Export Control Law — NPC Observer',url:'https://npcobserver.com/legislation/export-control-law/'}},
  'https://www.chinalawtranslate.com/en/datasecuritylaw/':{title:'Data Security Law of the PRC (2021)',subtitle:'NPC Standing Committee · Effective September 1, 2021',nodal:'Passed by the National People\'s Congress Standing Committee. The Cyberspace Administration of China (CAC) is the main regulator, with other agencies helping classify data by sector.',scope:['Covers all data processing that happens inside China, plus data processing outside China if judged to harm Chinese national security','Data is sorted into three tiers: general, "important," and core state data, each defined only in loose, qualitative terms rather than a precise list','"Important" data catalogues are drafted by sector regulators and provincial governments, giving each significant discretion over what counts in their own area','"Core state data" is classified by the central government alone, under a stricter management system, and its transfer abroad is effectively prohibited outright rather than merely reviewed'],trigger:['Sending "important" data outside China, which requires a mandatory government security check','A foreign law enforcement agency requesting data stored in China, this needs Chinese government approval first','Data processing outside China that is judged to harm Chinese national security'],action:['The government\'s security assessment can block a data transfer during review, or deny it outright','Penalties are tiered by severity: mishandling "important" data can bring fines from roughly RMB 100,000 up to RMB 10 million (about $1.4 million), while violations involving core state data start at RMB 2 million and can carry criminal liability for executives','The government can force deletion of illegally transferred data, including data already sitting abroad'],source:{name:'Data Security Law — China Law Translate',url:'https://www.chinalawtranslate.com/en/datasecuritylaw/'}},
  'https://www.gov.cn/xinwen/2016-11/07/content_5129723.htm':{title:'Cybersecurity Law of the PRC (2017)',subtitle:'NPC Standing Committee · Effective June 1, 2017',nodal:'Passed by the National People\'s Congress Standing Committee. The Cyberspace Administration of China (CAC) is the lead regulator; other agencies decide which operators count as running "critical" infrastructure.',scope:'Creates a special category for operators of Critical Information Infrastructure, covering telecoms, energy, finance, transport, water, healthcare, and defence. These operators must store their data inside China.',trigger:['A critical infrastructure operator wants to buy network equipment or services, a security check is required before purchase','A critical infrastructure operator wants to send personal or "important" data outside China'],action:['Foreign technology that fails the security check can be barred from an entire strategic sector at once','Critical infrastructure operators must store their data inside China','Network infrastructure must be built with interfaces allowing law enforcement access','Forms the legal basis for the Cybersecurity Review Measures and China\'s cross-border data transfer rules'],source:{name:'Cybersecurity Law — State Council / Xinhua',url:'https://www.gov.cn/xinwen/2016-11/07/content_5129723.htm'}},
  'https://www.mee.gov.cn/zcwj/gwywj/202410/t20241021_1089760.shtml':{title:'Dual-Use Export Control Regulations (December 2024)',subtitle:'State Council Decree No. 792 · Signed Sept 30, 2024 · Effective December 1, 2024 · Administered by MOFCOM',objective:'Article 1 states the aim as safeguarding national security and interests, honouring non-proliferation obligations, and strengthening control over dual-use exports. Made under the Export Control Law, it is the implementing regulation for that statute: State Council Decree No. 792, six chapters and 50 articles.',nodal:'Article 4 places dual-use export control with the State Council\'s commerce department, the Ministry of Commerce (MOFCOM). Customs acts as the gate: Article 21 requires it to withhold release of goods that lack a valid licence. Other State Council departments coordinate within their remits.',scope:'Covers roughly 700 items across ten industrial categories, each split into five types: equipment and components, test and production equipment, materials, software, and technology. The unified control list issued by Announcement 2024 No. 51 consolidated previously scattered lists covering nuclear, missile, biological, and chemical items; it gathered existing controls rather than widening them. Article 12 also allows temporary controls on unlisted items, each round capped at two years and renewable twice before permanent listing.',restrictions:['A licence is required for each export of a listed item (Article 14); exporters must submit end-user and end-use certification from the final user (Article 24), and Article 23 establishes ongoing risk management and verification of how items are actually used','A catch-all obligation sits on the exporter, not the regulator: where the conditions in Export Control Law Article 12(3) are met, a licence is needed even for an unlisted item (Article 14). The exporter must assess this itself and may consult the authorities where unsure','Article 49 reaches outside China. Where overseas parties transfer or supply, to specified destinations or specified entities, items made abroad that contain, integrate or are mixed with specified Chinese-origin dual-use items, or that were made using specified Chinese-origin technology, MOFCOM may require them to comply with these Regulations. The power is discretionary and target-specific rather than a blanket rule','Article 43 cuts the other way: accepting or promising to accept a foreign government\'s export-control-related visit or on-site inspection, without authorisation, is itself a violation. This is a blocking provision sitting inside the export control regime','Importers and end users who fail to cooperate with end-use verification can be placed on a watch list (Article 26); those who breach end-use terms, may endanger national security, or divert items to terrorism can go on the control list (Article 28)'],retaliation:['Unlicensed export, exceeding a licence\'s scope or validity, exporting prohibited items, or evading control by modifying or splitting items into parts are penalised under Export Control Law Article 34 (Article 39)','Failure to report: warning and correction order; where illegal turnover reaches RMB 500,000, a fine of five to ten times that turnover, otherwise RMB 500,000 to 3 million. Agents, freight forwarders, couriers, customs brokers, e-commerce platforms and financial service providers face up to RMB 100,000, rising to RMB 100,000 to 500,000 in serious cases (Article 40)','Abetting evasion: confiscation plus three to five times illegal gains where these reach RMB 100,000, otherwise RMB 100,000 to 500,000 (Article 41). Domestic importers or end users who break commitments face similar multiples plus RMB 300,000 to 3 million, and MOFCOM can refuse to accept their end-use certifications for five years (Article 42)','Accepting a foreign government inspection without authorisation: up to RMB 500,000, rising to RMB 500,000 to 3 million in serious cases, and suspension of business for rectification where especially serious (Article 43)','Control list designation brings prohibition or restriction of the relevant transactions, suspension of exports, and "other necessary measures" (Article 29)','Article 46 refers criminal liability out to the criminal law rather than creating offences here; the Regulations themselves impose administrative penalties and specify no prison term'],remedies:'Article 30 offers a corrective route rather than an appeal: an entity on the control list that cooperates with the investigation, states the facts truthfully, stops the conduct, eliminates the harm, and gives and honours undertakings may apply to be removed. The Regulations contain no provision for administrative reconsideration or litigation, which would have to come from the Export Control Law or general administrative law <span class="inf">(inferred)</span>.',source:{name:'Regulations on Export Control of Dual-Use Items, State Council Decree No. 792 — full text',url:'https://www.mee.gov.cn/zcwj/gwywj/202410/t20241021_1089760.shtml'},source2:{name:'Unified Dual-Use Items Export Control List, Announcement 2024 No. 51 — State Council',url:'https://www.gov.cn/zhengce/zhengceku/202411/content_6987846.htm'},source3:{name:'Dual-Use Items Export Control List — MOFCOM official PDF',url:'https://picpolicy.mofcom.gov.cn/file/20241120/56691732080580306.pdf'},source4:{name:'China Dual-Use Export Control Regulation — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-dual-use-export-control-regulation/'}},
  'https://exportcontrol.mofcom.gov.cn/article/zcfg/gnzcfg/zcfggzqd/202412/1072.html':{title:'MOFCOM Announcement 2024 No. 46 — Critical Mineral Controls on the US',subtitle:'MOFCOM · Issued Dec 3, 2024 · Paragraph 2 suspended by Announcement 2025 No. 72 until Nov 27, 2026',objective:'A country-specific tightening of dual-use export control aimed squarely at the United States, issued the day after Washington expanded its own entity listings. It converts the general export control machinery into a targeted instrument against a single destination.',nodal:'The Ministry of Commerce (MOFCOM) issued it under the Export Control Law; Customs enforces at the border.',scope:'Two distinct paragraphs, which matter separately because only one is currently in force. Paragraph 1 prohibits export to the United States of dual-use items destined for military users or military end use. Paragraph 2 covers gallium, germanium, antimony and superhard materials, and applies stricter end-user and end-use review to graphite. A closing clause asserts liability against parties in any country who transfer Chinese-origin controlled items onward to the United States.',restrictions:['<strong>Paragraph 1, in force</strong>: no export of dual-use items to United States military users or for military end use','<strong>Paragraph 2, currently suspended</strong>: exports of gallium, germanium, antimony and superhard materials to the United States are in principle not licensed, and graphite exports face stricter end-user and end-use review','Announcement 2025 No. 72, issued November 9, 2025, suspended paragraph 2 from that date until November 27, 2026. As things stand the mineral-specific measures are not operating; the military end-use ban in paragraph 1 is unaffected <span class="obs">(in practice)</span>','The announcement asserts reach over organisations and individuals in any country who transfer or supply Chinese-origin controlled items onward to United States parties'],retaliation:['Denial of export licences, which for the listed minerals under paragraph 2 was effectively categorical while that paragraph operated','The leverage rests on concentration of supply rather than on the penalty schedule. On USGS figures China accounted for about 99% of world primary low-purity gallium production in 2024 and roughly 60% of germanium; it produced close to 80% of natural graphite, and around 48% of antimony <span class="obs">(in practice)</span>','Enforcement against violations runs through the Export Control Law and Decree 792 rather than through this announcement, which sets policy rather than penalties','The suspension of paragraph 2 followed the November 2025 trade understanding, which fits the wider pattern of these measures being switched on and off alongside the state of the relationship rather than on their own timetable <span class="inf">(inferred)</span>'],remedies:'None provided. The announcement is a licensing-policy instrument and sets out no route to contest a refusal. Any recourse would have to come from the Export Control Law or general administrative law <span class="inf">(inferred)</span>.',source:{name:'MOFCOM Announcement 2024 No. 46 — official text, MOFCOM export control portal',url:'https://exportcontrol.mofcom.gov.cn/article/zcfg/gnzcfg/zcfggzqd/202412/1072.html'},source2:{name:'MOFCOM Announcement 2025 No. 72 — suspending paragraph 2 until November 27, 2026',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_5c68985a6b1a46778e2e8dbff1bb1601.html'},source3:{name:'MOFCOM Announcement 2024 No. 46 — mirror, MOFCOM security and control bureau',url:'https://aqygzj.mofcom.gov.cn/flzc/gzjgfxwj/art/2024/art_daaa02c05d8946179dcf5d1ba499ac46.html'},source4:{name:'Gallium: Mineral Commodity Summaries 2025 — USGS',url:'https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-gallium.pdf'},source5:{name:'Critical Mineral Export Bans — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-rare-earth-export-ban/'}},
  'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_9c2108ccaf754f22a34abab2fedaa944.html':{title:'MOFCOM Announcement 2025 No. 18 — Medium & Heavy Rare Earth Controls',subtitle:'MOFCOM + General Administration of Customs · Issued and effective April 4, 2025 · Still fully in force',objective:'Places seven medium and heavy rare earth elements, and the products made from them, under dual-use export licensing. This is the instrument that turned China\'s dominance of rare earth separation and magnet production into a working chokepoint: nothing covered leaves without a licence, and the licence decision is discretionary.',nodal:'Issued jointly by the Ministry of Commerce (MOFCOM) and the General Administration of Customs, under the Export Control Law, the Foreign Trade Law, the Customs Law, and Decree 792. Licence applications go to MOFCOM as the State Council\'s commerce department; Customs enforces at the border.',scope:'Seven elements: samarium, gadolinium, terbium, dysprosium, lutetium, scandium, and yttrium, carrying control codes 1C902 to 1C908. The announcement describes them as medium and heavy rare earths, not simply heavy: samarium and gadolinium sit in the medium range. For each element it reaches the metal, the oxides and their mixtures, named alloy systems, and sputtering targets, in ingot, block, bar, wire, sheet, rod, plate, tube, granule and powder form. Critically it also reaches finished permanent magnet materials: samarium-cobalt magnets, and neodymium-iron-boron magnets containing terbium or dysprosium.',restrictions:['Any export of a covered item requires a dual-use export licence applied for from MOFCOM under the Export Control Law and Decree 792','Coverage extends well past feedstock to finished goods. Because samarium-cobalt and terbium- or dysprosium-bearing NdFeB magnets are themselves listed, ordinary manufacturers buying components rather than raw minerals were pulled into the regime','The announcement is use-neutral on its face: it names no prohibited end use, no military carve-out, and no restricted destination. The discretion sits in the licence decision under Decree 792, and in the end-user and end-use certification its Article 24 requires','It contains no extraterritorial clause of its own; the follow-the-content reach comes from Decree 792 Article 49','Still fully in force. This distinguishes it from the wider October 2025 rare earth package, suspended until November 10, 2026, and from paragraph 2 of Announcement 2024 No. 46, suspended until November 27, 2026. Announcement 18 has never been suspended <span class="obs">(in practice)</span>'],retaliation:['The announcement carries no penalty clause of its own. Enforcement runs through Decree 792 and the Export Control Law, where unlicensed export is punished under Export Control Law Article 34 (Decree 792, Article 39)','The operative pressure is timing rather than refusal. MOFCOM allows itself up to 45 working days to decide, longer where the State Council or military authorities must be consulted; heavy rare earth approvals have in practice run 60 to 120 days case by case, with no published procedure <span class="obs">(in practice)</span>','Documented effect on downstream industry: Ford idled its Chicago plant building the Explorer and its chief executive said the company had shut plants for three weeks for want of high-power magnets used in speakers and in seat, wiper and door motors; Suzuki suspended Swift production from May 26, 2025 <span class="obs">(in practice)</span>','The leverage rests on concentration rather than on the penalty schedule: China accounts for roughly 91% of global refined rare earth output and about 94% of sintered permanent magnet production <span class="obs">(in practice)</span>'],remedies:'None. The announcement creates a licensing requirement without any stated route to contest a refusal, and it says nothing about delay, which is the form the pressure usually takes. Decree 792 provides no reconsideration route either; its nearest analogue is the Article 30 application to be removed from the control list, which does not reach licence decisions <span class="inf">(inferred)</span>.',source:{name:'MOFCOM and GAC Announcement 2025 No. 18 — official text',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_9c2108ccaf754f22a34abab2fedaa944.html'},source2:{name:'China imposes export controls on medium and heavy rare earths — Holland & Knight',url:'https://www.hklaw.com/en/insights/publications/2025/04/china-imposes-export-controls-on-medium-and-heavy-rare-earth-materials'},source3:{name:'Beijing\'s rare earths licensing system: delays by design? — MERICS',url:'https://merics.org/en/comment/beijings-rare-earths-export-licensing-system-delays-design'},source4:{name:'Supply concentration risks become reality — IEA',url:'https://www.iea.org/commentaries/with-new-export-controls-on-critical-minerals-supply-concentration-risks-become-reality'},source5:{name:'Ford idles US plants over China magnet shortage — SupplyChainBrain',url:'https://www.supplychainbrain.com/articles/42058-ford-forced-to-idle-multiple-us-plants-over-china-magnet-shortage'},source6:{name:'China pauses some rare earth curbs, and what it leaves in place — Clark Hill',url:'https://www.clarkhill.com/news-events/news/china-hits-pause-on-rare-earth-export-controls-and-what-it-means-for-supply-chains/'},source7:{name:'China rare earth export controls — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-rare-earth-export-ban/'}},
  'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_59ec4f6bec0b459aa4a30c4bbd0a41c1.html':{title:'MOFCOM Announcement 2025 No. 57 — Five More Medium & Heavy Rare Earths',subtitle:'MOFCOM + General Administration of Customs · Issued Oct 9, 2025 · Was to take effect Nov 8, 2025 · Suspended Nov 7, 2025 until Nov 10, 2026',objective:'Extends the Announcement 18 model to five further medium and heavy rare earths, completing the set of twelve. Its significance is as much in what happened to it as in what it says: it was suspended the day before it was due to take effect, which makes it the clearest example in this map of a control written, published, and then held in reserve.',nodal:'Issued jointly by the Ministry of Commerce (MOFCOM) and the General Administration of Customs, with State Council approval expressly recorded, under the Export Control Law, the Foreign Trade Law, the Customs Law, and Decree 792. Export operators apply to MOFCOM for licences.',scope:'Five elements, carrying control codes 1C909 to 1C913: holmium, erbium, thulium, europium, and ytterbium. Like Announcement 18 the text calls them medium and heavy rare earths, not simply heavy. Each element is split into three limbs: the metal, alloys, targets, permanent magnets, crystals, magnetic refrigeration and magnetostrictive materials; the oxides and their mixtures; and the compounds and their mixtures. Erbium additionally reaches optical fibre and hydrogen storage materials. Together with the seven elements in Announcement 18, all twelve medium and heavy rare earths would be covered. The light rare earths, including neodymium and praseodymium, are not listed as elements in either announcement, though NdFeB magnets are caught by Announcement 18 where they contain terbium or dysprosium.',restrictions:['<strong>Currently suspended, and never operative</strong>. The announcement set its own start date at November 8, 2025. Announcement 2025 No. 70, issued November 7, one day earlier, suspended it until November 10, 2026 along with Announcements 55, 56, 58, 61 and 62. It has therefore never actually been in force <span class="obs">(in practice)</span>','Were it to take effect, any export of a covered item would require a dual-use export licence from MOFCOM under the Export Control Law and Decree 792','Like Announcement 18, it names no prohibited end use, no military carve-out, and no restricted destination, and it contains no extraterritorial or re-export clause of its own','The extraterritorial reach in the October 2025 package sat in a separate instrument, Announcement 61, which would have required a Chinese licence for items made abroad where Chinese-origin rare earth content reached 0.1% or more by value. Announcement 62 covered rare earth mining, separation, smelting, magnet-making and recycling technology. Both are suspended on the same timetable'],retaliation:['The announcement carries no penalty clause. Enforcement, had it commenced, would run through Decree 792 and the Export Control Law','Its coercive value has been as a standing threat rather than an operating control. Published on October 9, 2025 amid tariff escalation and suspended on November 7 as part of the trade understanding, it can be reactivated by letting the suspension lapse rather than by legislating afresh <span class="inf">(inferred)</span>','The suspension runs to November 10, 2026, a different date from the November 27, 2026 suspension of paragraph 2 of Announcement 2024 No. 46; the two packages were paused separately and can expire separately','Announcements 61 and 62 provided humanitarian exemptions, for emergency medical use, public health emergencies and disaster relief, and for technology already in the public domain, in basic scientific research, or needed for ordinary patent applications'],remedies:'None. As with Announcement 18, the instrument creates a licensing requirement with no stated route to contest a refusal or a delay. Because it never took effect, no licence decisions have been made under it to contest <span class="inf">(inferred)</span>.',source:{name:'MOFCOM and GAC Announcement 2025 No. 57 — official text',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_59ec4f6bec0b459aa4a30c4bbd0a41c1.html'},source2:{name:'MOFCOM and GAC Announcement 2025 No. 70 — suspending Announcements 55, 56, 57, 58, 61 and 62 until Nov 10, 2026',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_b1ec77dd3f0d4762952904df7cdaadec.html'},source3:{name:'MOFCOM Announcement 2025 No. 61 — overseas rare earth items, the 0.1% content rule',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_7fc9bff0fb4546ecb02f66ee77d0e5f6.html'},source4:{name:'MOFCOM Announcement 2025 No. 62 — rare earth technology controls',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_6cb42957741440c6984de696b70df9ae.html'},source5:{name:'Extraterritorial jurisdiction under Announcements 61 and 62 — AllBright Law Offices',url:'https://www.allbrightlaw.com/CN/10475/3a06a97d81b99e4d.aspx'},source6:{name:'China expands export controls on rare earth minerals — National Law Review',url:'https://natlawreview.com/article/china-expands-export-control-rare-earth-minerals-and-more'}},
  'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_c03d1e511b2b486e829d68e8f1422aff.html':{title:'Dual-Use Import/Export Licence Measures (2026 Update)',subtitle:'MOFCOM + General Administration of Customs Announcement 2025 No. 91 · Issued Dec 31, 2025 · Effective January 1, 2026',objective:'Sets out which goods and technologies actually require an import or export licence in a given year. This is a catalogue rather than a rulebook: it tells traders what is caught, while the operative obligations and penalties sit in the Export Control Law and Decree 792.',nodal:'The Ministry of Commerce (MOFCOM) issues licences; the General Administration of Customs enforces at the border. The two bodies issue the directory jointly, here as Announcement 2025 No. 91.',scope:'Applies to everyone trading controlled dual-use items: exporters, importers, agents, and end users. The 2026 directory superseded the 2024 version and added roughly 80 to 85 controlled entries, among them fentanyl-related drug precursors, heavy tungsten-nickel alloys, samarium rare earth materials, indium-based semiconductor materials, and bismuth and tellurium used in infrared, thermoelectric, and radiation detection. Electric vehicles were added in the same December 2025 round but to a separate list, the export licence management directory, not this one.',restrictions:['A licence is required for each shipment of a listed item, supported by end-user and end-use certification from the final user (Decree 792, Article 24)','A directory revision can bring in a product that previously needed no licence, as the 2026 round did across several rare earth, semiconductor, and precursor materials; the obligation attaches on the effective date without any transition for goods already contracted','Failing to cooperate with end-use verification can put an importer or end user on the watch list, and breaching end-use terms can lead to the control list (Decree 792, Articles 26 and 28); the consequence follows from the Regulations rather than from this directory'],retaliation:['The directory itself imposes no penalties. Enforcement runs through Decree 792: unlicensed export or exceeding a licence is penalised under Export Control Law Article 34 (Article 39), and control list designation can prohibit or restrict transactions or suspend exports outright (Article 29)','Its coercive weight lies in coverage rather than sanction. Each revision decides what needs permission, and permission is what can later be withheld'],remedies:'None in the directory. Removal from the control list under Decree 792 Article 30 is the nearest available route, and it depends on correcting conduct rather than on contesting the listing <span class="inf">(inferred)</span>.',source:{name:'2026 Dual-Use Items and Technologies Import and Export Licence Directory, Announcement 2025 No. 91 — MOFCOM',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_c03d1e511b2b486e829d68e8f1422aff.html'},source2:{name:'Export Licence Management Commodity Directory (2026) — MOFCOM',url:'https://www.mofcom.gov.cn/zcfb/dwmygl/art/2025/art_f7a611068b084ac9b14080a1d3d742db.html'},source3:{name:'Regulations on Export Control of Dual-Use Items, Decree No. 792 — the operative rules',url:'https://www.mee.gov.cn/zcwj/gwywj/202410/t20241021_1089760.shtml'},source4:{name:'2026 Import/Export Licensing Updates — China Briefing',url:'https://www.china-briefing.com/news/china-import-export-licensing-2026-key-compliance-updates/'}},
  'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2020/art_1889a24134054b5b841134c3fba44654.html':{title:'Unreliable Entity List — MOFCOM Order No. 4 of 2020',subtitle:'MOFCOM · Effective September 2020',objective:'Creates a designation regime for foreign firms and individuals whose conduct China judges harmful to its interests or discriminatory against its companies. It is the blacklist counterpart to the trade instruments: rather than taxing a product, it targets the entity itself.',nodal:'The Ministry of Commerce (MOFCOM) chairs a multi-agency working group; other ministries handling security and foreign affairs are also involved.',scope:'Can apply to any foreign company, organisation, or individual in the world, with no minimum size or nationality requirement. As of late 2025, over 23 entities have been listed, mostly US defence contractors, Taiwanese aerospace firms, and foreign think tanks or NGOs.',restrictions:['Actions judged to harm China\'s sovereignty, security, or development interests (Article 2)','Interrupting or refusing normal business dealings with Chinese companies without what China considers a legitimate reason, or applying discriminatory measures against Chinese companies, organisations, or individuals (Article 2)','Complying with foreign government sanctions targeting Chinese entities; this alone can count as "discriminatory" <span class="inf">(inferred)</span>','Article 9 allows risk warnings short of listing, and Article 11 bars measures during a rectification period, so designation is staged rather than immediate'],retaliation:['Authorities can restrict or prohibit import and export dealings with the listed entity, cutting off its trade with Chinese companies, and restrict or prohibit its investment in China (Article 10)','Executives and staff can face restricted entry into China, or have existing work permits or residence status restricted or revoked (Article 10)','Fines, and other measures authorities judge necessary, are also available under the same article (Article 10)'],remedies:'There is no appeal against a listing. What the Provisions offer instead is a corrective route: a listed entity can apply for removal after correcting the conduct that led to its designation (Article 13), which keeps the decision in MOFCOM\'s hands throughout.',source:{name:'Unreliable Entity List Regulations — MOFCOM English',url:'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2020/art_1889a24134054b5b841134c3fba44654.html'}},
  'https://cset.georgetown.edu/publication/china-export-control-catalog-july-2025/':{title:'Catalogue of Technologies Prohibited or Restricted from Export (July 2025)',subtitle:'MOFCOM + Ministry of Science & Technology · Updated July 2025',nodal:'Jointly administered by the Ministry of Commerce (MOFCOM) and the Ministry of Science and Technology (MOST), with the Ministry of Industry (MIIT) consulted on information-technology categories.',scope:'Lists 134 technologies as of July 2025, in two tiers: 24 are banned from export outright, with no licence available at all, and 110 are restricted, requiring multi-stage government approval. Covers physical exports as well as licensing deals, joint-venture contributions, technical assistance, and outbound investment.',trigger:['Attempting to export or transfer any of the 24 absolutely banned technologies; this is treated as a criminal matter with no licensing route available','Transferring any of the 110 restricted technologies without prior government approval','A Chinese company contributing restricted technology to a foreign joint venture or overseas investment'],action:['Absolute prohibitions carry criminal penalties of up to 10 years in prison','Restricted technologies require multi-stage government approval, with no fixed deadline for a decision','The government can void existing contracts and force companies to unwind unauthorised transfers','Even a company\'s own overseas subsidiaries cannot pass these technologies to third countries without separate approval'],source:{name:'China Export Control Catalog July 2025 — CSET Georgetown',url:'https://cset.georgetown.edu/publication/china-export-control-catalog-july-2025/'}},
  'https://www.gov.cn/zhengce/content/202604/content_7064837.htm':{title:'Regulations on Industrial & Supply Chain Security (Decree 834)',subtitle:'State Council · Effective March 31, 2026',objective:'Defends China\'s own supply chains. Where Decree 835 punishes foreign actors who apply another state\'s measures against China, this decree guards the chains themselves, policing who gathers information about them and empowering investigations into specific transactions.',nodal:'Administered by the State Council\'s relevant departments, with supply chain security investigations run into specific import and export transactions.',scope:'Reaches foreign entities that gather information on China\'s supply chains without authorisation, foreign organisations and individuals whose conduct is judged to threaten supply chain security, and domestic entities that fail to comply with the decree\'s own requirements.',restrictions:['A foreign entity carrying out unauthorised information-gathering on China\'s supply chains (Article 13)','Authorities opening a supply chain security investigation into a specific import or export transaction (Article 14)','A foreign organisation or individual under investigation for conduct threatening supply chain security (Article 15)'],retaliation:['A supply chain security investigation can result in import or export prohibitions, restrictions, or a special fee on the specific transaction under review (Article 14)','A foreign organisation or individual found responsible can face trade restrictions, investment bans, transaction prohibitions, or entry restrictions (Article 15)','Domestic entities that fail to comply face procurement and bidding restrictions, plus data-sharing prohibitions, as penalties (Article 16)','Works alongside Decree 835: this decree defends China\'s own supply chains, the other punishes foreign actors seen as disrupting them'],remedies:'The decree does not set out a route to contest a supply chain security determination. General administrative reconsideration and litigation law may apply, but nothing in the text provides for it <span class="inf">(inferred)</span>.',source:{name:'Decree 834 — State Council Legislative Portal',url:'https://www.gov.cn/zhengce/content/202604/content_7064837.htm'},source2:{name:'Decree 834 Analysis — Baker McKenzie Sanctions News',url:'https://sanctionsnews.bakermckenzie.com/china-introduces-new-state-council-decrees-on-supply-chain-security-and-countering-unjustifiable-extraterritorial-measures/'}},
  'https://www.gov.cn/zhengce/zhengceku/2022-01/04/content_5666430.htm':{title:'Cybersecurity Review Measures (2022)',subtitle:'13-agency committee led by CAC · Effective February 15, 2022',nodal:'Led by the Cyberspace Administration of China (CAC), with a 13-agency committee including bodies overseeing economic planning, foreign affairs, public security, state security, industry, and finance.',scope:'Covers two situations: operators of critical infrastructure buying network products or services that could affect national security, and platform companies with over 1 million Chinese users seeking an overseas stock listing. Applies across seven strategic sectors: telecoms, energy, finance, transport, water, healthcare, and defence.',trigger:['A critical infrastructure operator makes a procurement decision; review is required before the purchase goes ahead','A platform with over 1 million Chinese users files for an overseas stock listing','The regulator decides on its own that a product or platform poses a national security risk'],action:['A mandatory review can block the purchase or listing; it usually takes 30 working days but can stretch to 90 for complex cases, with no hard deadline','A product or service that fails review can be blacklisted across all seven strategic sectors at once','An overseas listing can be blocked or unwound: ride-hailing giant DiDi was forced to delist from the New York Stock Exchange in 2022 after a review of this kind <span class="obs">(in practice)</span>','The procurement side is equally live: in August 2026 the CAC opened a review into US cybersecurity firm Palo Alto Networks over products it sells in China, days after a fresh round of US-directed export controls and sanctions <span class="obs">(in practice)</span>'],source:{name:'Network Security Review Measures — State Council Official Text',url:'https://www.gov.cn/zhengce/zhengceku/2022-01/04/content_5666430.htm'},source2:{name:'China Launches Probe Into US Cybersecurity Firm Palo Alto Networks — SCMP',url:'https://www.scmp.com/economy/global-economy/article/3363177/china-launches-probe-us-cybersecurity-firm-palo-alto-networks'}},
  'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2021/art_98677d0ed28b41b9adeff27b00c9d001.html':{title:'MOFCOM Blocking Statute — Order No. 1 of 2021',subtitle:'MOFCOM · Effective January 9, 2021',objective:'Blocks the effect inside China of foreign laws and measures that reach beyond their own borders and are improperly applied to Chinese parties. Rather than retaliating abroad, it works by making compliance with the foreign measure unlawful at home, putting affected companies between two legal systems.',nodal:'The Ministry of Commerce (MOFCOM) is the sole authority administering this rule.',scope:'Applies to Chinese citizens, and Chinese companies and other organisations, affected by a foreign law or measure that reaches beyond that country\'s own borders and is wrongly applied to them (Articles 1, 2, 5).',restrictions:['A party affected by a qualifying foreign measure must report it to MOFCOM within 30 days (Article 5)','Where MOFCOM issues a Prohibition Order, the specified foreign measure is "not to be recognised, not to be enforced, and not to be observed" inside China (Article 7); complying with it then becomes the violation','Triggering conduct includes receiving a foreign order with extraterritorial reach, such as a US Commerce Department Entity List designation or OFAC or EU sanctions, and taking any compliance step in response that affects a Chinese party'],retaliation:['A Chinese party harmed by another party\'s compliance with a barred foreign measure can sue that party for damages in a Chinese court (Article 9): enforcement runs largely through private litigation rather than state penalty','Significantly strengthened by Decree 835 in April 2026, which extends exposure to those who promote or assist a foreign measure and adds Malicious Entity List designation'],remedies:'The Rules provide for exemptions rather than appeals: a party may apply to MOFCOM for permission to comply with a prohibited foreign measure. No provision sets out a route to challenge a Prohibition Order itself <span class="inf">(inferred)</span>.',source:{name:'MOFCOM Order No. 1 of 2021 — MOFCOM English Portal',url:'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2021/art_98677d0ed28b41b9adeff27b00c9d001.html'}},
  'https://www.gov.cn/zhengce/content/202604/content_7065398.htm':{title:'Regulations on Combating Unjustified Extraterritorial Jurisdiction (Decree 835)',subtitle:'Ministry of Justice + State Council · Effective April 7, 2026',objective:'Counters what China treats as improper extraterritorial jurisdiction by other states. It goes beyond the 2021 Blocking Statute: rather than only barring compliance, it reaches those who promote or help implement a foreign measure, and attaches listing consequences to doing so.',nodal:'Administered by the State Council\'s relevant departments, which identify the foreign measures caught and maintain the Malicious Entity List.',scope:'A major expansion of the 2021 Blocking Statute. Article 6 bars "any organization or individual" from executing or assisting a foreign measure the government identifies as improper extraterritorial jurisdiction, and Article 8 extends Malicious Entity List exposure to those who "promote or participate in implementing" such a measure. That language is broad and unqualified, which is why legal commentators read it as potentially reaching lawyers, advisers, think tanks, lobbyists, and research institutes, though the decree does not name these groups itself.',restrictions:['Executing, or assisting in executing, any foreign measure the government identifies as "improper extraterritorial jurisdiction" (Article 6); the text applies to "any organization or individual," with no exemption written in','Promoting or participating in implementing such a foreign measure, the trigger for Malicious Entity List designation (Article 8)','Refusing to cooperate with, or obstructing, an official inspection or document request once a suspected violation is under investigation (Article 12)'],retaliation:['Authorities can order corrections, or issue a binding order specifically prohibiting continued execution of the foreign measure (Article 13)','Non-compliance or evasion can bring further correction orders, bans on government procurement and bidding, and exit or entry restrictions on executives (Article 17)','Malicious Entity List designation under Article 8 adds visa restrictions, asset freezes, and trade limitations','Violations that separately constitute a crime under other Chinese law carry criminal liability (Article 18); the decree does not itself create a standalone prison sentence'],remedies:'The decree contains no provision for appealing a designation or a prohibition order. Its enforcement articles run one way, from the authorities outward <span class="inf">(inferred)</span>.',source:{name:'Decree 835 — State Council Legislative Portal',url:'https://www.gov.cn/zhengce/content/202604/content_7065398.htm'},source2:{name:'Decree 835 Analysis — Morrison Foerster',url:'https://www.mofo.com/resources/insights/260420-china-issues-new-regulations-countering-foreign-states'}},
  'https://www.chinalawtranslate.com/en/foreigninvestmentsecurityreview/':{title:'Measures for the Security Review of Foreign Investments (2020)',subtitle:'NDRC + MOFCOM · Effective January 18, 2021',nodal:'Jointly led by the National Development and Reform Commission (NDRC) and the Ministry of Commerce (MOFCOM), with input from security, defence, and other sector regulators.',scope:'Covers foreign investment into military and military-linked companies; critical information infrastructure; artificial intelligence, semiconductors, advanced biotechnology, and advanced materials; and energy, resources, and strategic transport. No deal is too small to be exempt.',trigger:['Any foreign investment in one of these sectors, regardless of deal size or ownership share','A change, after approval, in who the foreign investor actually is, who ultimately benefits, or who controls the company','Regulators deciding on their own that an investment that was never formally reported may affect national security'],action:['Three possible outcomes, approved outright, approved with conditions, or rejected, with no fixed deadline for a decision','Conditions can include restrictions on technology sharing, mandatory reporting to security agencies, or government access rights','Even after approval, the government can force a foreign investor to sell its stake if the investment is later judged a security risk'],source:{name:'Foreign Investment Security Review — China Law Translate',url:'https://www.chinalawtranslate.com/en/foreigninvestmentsecurityreview/'},source2:{name:'Foreign Investment Security Review — State Council Official',url:'https://www.gov.cn/zhengce/zhengceku/2020-12/19/content_5571113.htm'}},
  'https://www.news.cn/politics/20260601/c501b3cd78034669a8dd442f659f2a20/c.html':{title:'State Council Regulations on Overseas Investment (Decree 837)',subtitle:'NDRC + MOFCOM · Effective July 1, 2026',objective:'Brings Chinese outbound investment under a single supervisory frame, sorting it into encouraged, restricted, and prohibited categories, and stopping capital and technology from leaving in ways the state judges harmful. It is the only one of the three 2026 decrees whose own text sets out those tiers.',nodal:'Article 11 names the State Council\'s "investment administration department" (conventionally the NDRC) and "commerce administration department" (MOFCOM), acting with other relevant State Council departments, as the bodies that set outward investment policy and classify investments as encouraged, restricted, or prohibited. The decree refers to them by function, not by name, which is why only the commerce side reads clearly on a first pass.',scope:['<strong>Who it covers</strong>: Chinese companies, other organisations, and individuals resident in China','<strong>What counts as outward investment</strong>: contributing money, equity, financing, or guarantees to gain ownership, control, or management rights over a company or asset in another country','<strong>Encouraged</strong>: investment that aligns with China\'s development priorities and brings in foreign technology or management know-how in non-sensitive sectors (Article 11)','<strong>Restricted</strong>: investment in sectors or technologies the government classifies as restricted, subject to approval and filing procedures; the decree does not name which department handles approval at the transaction level (Articles 11, 12)','<strong>Prohibited</strong>: investment in a category the government classifies as state-prohibited, or that transfers banned or restricted technology to another country (Articles 13, 27)'],restrictions:'<div style="font-size:9.5px;color:#94a3b8;font-style:italic;margin-bottom:9px;line-height:1.45;">Grounded in Articles 11, 12, 13, 23 and 27 of the decree.</div><div style="margin-bottom:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#c8102e;">Prohibited</div><ul style="margin:0 0 10px;"><li>Exporting or using state-prohibited goods, technology, or services as part of an outward investment (Article 13)</li><li>Transferring banned or restricted technology to another country, including via cross-border deployment of technical personnel or other methods (Article 13)</li><li>Investing in a category the government classifies as state-prohibited; violations can bring forced disposal of the assets (Article 27)</li></ul><div style="margin-bottom:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#2563eb;">Restricted</div><ul style="margin:0;"><li>Investment in sectors or technologies classified as restricted, as defined jointly by the NDRC and MOFCOM together with other relevant departments (Article 11)</li><li>Outward investment must comply with approval and filing ("&#26680;&#20934;&#22791;&#26696;") procedures; the decree does not specify which department handles this at the transaction level (Article 12)</li></ul>',retaliation:['Prohibited-category violations can bring forced cessation of the investment and forced disposal of the assets, plus fines of 0.5%-1% of the investment amount and RMB 50,000-100,000 fines on responsible individuals (Article 27)','Unapproved or falsely filed investments face fines starting at 0.1%-0.5% of the investment amount, rising to 0.5%-1% for continued non-compliance, plus RMB 20,000-50,000 fines on individuals, a three-year bar on new applications, or a one-to-three-year ban on investment activity (Article 27)','Security-review violations can bring fines, a one-to-three-year investment ban, and forced disposal of assets (Article 28)','MOFCOM can investigate, alone or with other departments, a foreign government\'s own barriers or discrimination against Chinese investors, and respond with policy adjustments, trade or technology export restrictions, or service-trade limits (Article 23)'],remedies:'The decree sets out penalties without prescribing a challenge route. Its enforcement articles, 27 to 29, describe what authorities may impose but say nothing about contesting those impositions <span class="inf">(inferred)</span>.',source:{name:'Decree 837 — Xinhua News Policy Portal',url:'https://www.news.cn/politics/20260601/c501b3cd78034669a8dd442f659f2a20/c.html'},source2:{name:'Decree 837 — State Council English Portal',url:'https://english.www.gov.cn/policies/latestreleases/202606/01/content_WS6a1d2e29c6d00ca5f9a0b59e.html'}},
  'https://openresearch-repository.anu.edu.au/server/api/core/bitstreams/7bba4ac6-0ee2-4890-b90c-f586f63de6e8/content':{title:'Cross-Border Data Transfer Rules (PIPL / DSL Framework)',subtitle:'Cyberspace Administration of China (CAC) · 2022–2026',nodal:'Cyberspace Administration of China (CAC), the national internet and data regulator, with provincial offices handling smaller cases. Industry regulators (banking, telecom, etc.) decide what counts as "important" data in their own sector.',scope:['Applies broadly: any company handling the personal data of Chinese residents, businesses that generate sensitive ("important") data while operating in China, operators of critical infrastructure like power grids, banks, and telecom networks, digital platforms with over 1 million Chinese users, and, from 2026, companies collecting data from connected vehicles','To move data out of China, a company must use one of three government-approved routes: a full security review, a standard data-transfer contract, or a certification scheme','"Core state data," the most sensitive tier, sits outside all three routes: it is effectively barred from leaving China at all, rather than merely subject to review'],trigger:['Sending any amount of data officially classified as "important" outside China','Sending the personal data of more than 1 million Chinese individuals abroad, which requires the strictest route, a mandatory government Security Assessment','Any international data transfer by an operator of critical infrastructure, regardless of how much data is involved','Planning an overseas stock listing that would involve Chinese user data above the threshold'],action:['The mandatory Security Assessment can freeze all data transfers for months during review, and the government can refuse permission outright, with no independent appeal','Regulators can order an immediate halt to transfers and demand deletion of data already sent abroad','Fines of up to RMB 50 million (roughly $7 million) or 5% of global annual revenue, whichever is higher, plus possible criminal charges against company executives'],source:{name:'Cross-Border Data Transfer Rules — ANU / CAC Legislative Depository',url:'https://openresearch-repository.anu.edu.au/server/api/core/bitstreams/7bba4ac6-0ee2-4890-b90c-f586f63de6e8/content'},source2:{name:'Cross-Border Data Transfer in China — Global Law Experts',url:'https://globallawexperts.com/crossborder-data-transfer-china/'}},
  'https://www.chinalawtranslate.com/en/exdata-export-security/':{title:'Measures for the Security Assessment of Data Exports',subtitle:'Cyberspace Administration of China (CAC) · Effective September 1, 2022',nodal:'The Cyberspace Administration of China (CAC) issues and enforces this regulation.',scope:['Applies to companies sending "important data" abroad, defined as data whose leak could affect national security, economic security, social stability, or public health','Also applies to any operator of critical information infrastructure that sends data abroad, regardless of volume','Also applies to companies sending the personal data of 1 million or more Chinese individuals abroad in a single transfer','Also applies to companies that have cumulatively sent abroad the personal data of 100,000 or more individuals, or the sensitive personal data of 10,000 or more individuals, since the start of the previous year'],trigger:['Meeting any one of the four thresholds above triggers a mandatory government security assessment before the data can leave China','The assessment must be completed before the transfer takes place, not after the fact'],action:['The assessment can take months to complete, and the CAC can deny permission outright with no independent appeal','A fresh assessment is required if the purpose, scope, or recipient of the transfer later changes','Transferring data without completing a required assessment is treated as an unlawful cross-border transfer under the Data Security Law, carrying the same fines and potential criminal liability'],source:{name:'Measures for the Security Assessment of Outbound Data Transfers — China Law Translate',url:'https://www.chinalawtranslate.com/en/exdata-export-security/'}},
  'https://www.gov.cn/gongbao/content/2004/content_62747.htm':{title:'Anti-Dumping Regulations of the PRC (2001, revised 2004)',subtitle:'State Council Decree No. 328, revised by Decree No. 401 · Effective June 1, 2004',objective:'Formulated under the Foreign Trade Law to maintain foreign trade order and fair competition (Article 1). It lets China impose duties on imports sold below their normal value where that dumping causes material injury to a domestic industry, threatens such injury, or materially retards a domestic industry being established.',nodal:'The Ministry of Commerce (MOFCOM) investigates and determines both the dumping (Article 3) and the injury (Article 7); where agricultural products are involved, it conducts the injury investigation jointly with the Ministry of Agriculture. MOFCOM proposes the duty, the Customs Tariff Commission of the State Council decides it, MOFCOM announces it, and Customs collects it at the border (Article 38).',scope:'Reaches any imported product, with no sector excluded; in practice agriculture, food and drink, chemicals, cars, and consumer goods have been targeted most often. Dumping means an export price below the product\'s normal value, normal value being the comparable price in the exporting market or, failing that, a third-country price or constructed cost plus reasonable expenses and profit. Injury covers material injury, the threat of it, and material retardation of a new domestic industry. Domestic industry means the producers whose combined output makes up a major proportion of national output.',restrictions:['A case opens only on a written petition by or on behalf of the domestic industry; producers backing it must represent more than 50% of the output of those taking a position, and no case can open where supporters hold under 25% of total domestic output (Article 17)','MOFCOM may open a case on its own in special circumstances, but only where it already holds sufficient evidence of dumping, injury, and a causal link between them (Article 18)','Provisional measures cannot be applied until 60 days after a case opens, and then last up to four months, extendable to nine (Article 30); the investigation itself must conclude within 12 months, extendable by up to six more (Article 26)','Collecting the duty must accord with the public interest (Article 37), and public interest can also justify suspending or terminating an investigation outright (Article 33)','An exporter can avoid duties by offering a price undertaking, a commitment to raise prices or stop exporting at dumped prices, which MOFCOM may accept (Article 31)'],retaliation:['Provisional duties or cash deposits at the border, then final duties lasting up to five years, extendable through sunset review where lapsing would likely renew the dumping and injury (Article 48)','Documented rates reached 73.6% on Australian barley in 2020, alongside a separate 6.9% countervailing duty, and 116.2% to 218.4% on Australian wine from March 2021 <span class="obs">(in practice)</span>','Article 56 lets China take "corresponding measures" against any country or region that applies anti-dumping measures discriminatorily against Chinese exports: a reciprocity hook written into the regulation itself','Duties have ended through negotiation rather than adjudication: Australia took both the barley and wine measures to the WTO, and both disputes closed by mutually agreed solution, in 2023 and in March 2024, with no panel ruling on the merits <span class="obs">(in practice)</span>'],remedies:'A party dissatisfied with a final determination, with a decision to impose, backdate or refund duty, or with a review finding, may apply for administrative reconsideration or sue in the People\'s Court (Article 53). In practice trade remedy cases are heard only by the Beijing No. 2 Intermediate People\'s Court, with appeal to the Beijing Higher People\'s Court.',source:{name:'Decree No. 401 and consolidated 2004 text — State Council Gazette',url:'https://www.gov.cn/gongbao/content/2004/content_62747.htm'},source2:{name:'Anti-Dumping Regulations (2004 revision) — MOFCOM law database',url:'https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=41551'},source3:{name:'MOFCOM Trade Remedy & Investigation Bureau',url:'https://trb.mofcom.gov.cn/'},source4:{name:'WTO DS598 — China: AD and CVD Measures on Barley from Australia',url:'https://www.wto.org/english/tratop_e/dispu_e/cases_e/ds598_e.htm'},source5:{name:'WTO DS602 — China: AD and CVD Measures on Wine from Australia',url:'https://www.wto.org/english/tratop_e/dispu_e/cases_e/ds602_e.htm'}},
  'https://www.gov.cn/gongbao/content/2004/content_62748.htm':{title:'Countervailing Duty Regulations of the PRC (2001, revised 2004)',subtitle:'State Council Decree No. 329, revised by Decree No. 402 · Effective June 1, 2004',objective:'The subsidy counterpart to the Anti-Dumping Regulations, and formulated under the same Foreign Trade Law authority. It lets China impose duties on imports that benefit from a foreign government subsidy where those imports injure a domestic industry. The target here is a foreign state\'s support programme rather than a company\'s pricing.',nodal:'The Ministry of Commerce (MOFCOM) investigates and determines both the subsidy (Article 5) and the injury (Article 7); where agricultural products are involved, it conducts the injury investigation jointly with the Ministry of Agriculture. MOFCOM proposes the duty, the Customs Tariff Commission of the State Council decides it, and MOFCOM announces it (Article 39).',scope:'Covers imported products benefiting from a subsidy granted by a foreign government or public body, where those imports harm a Chinese industry. Runs the same procedural track as the Anti-Dumping Regulations, and the two are often run in parallel against the same product. The reach can extend to an entire policy architecture rather than a single scheme: the EU dairy case examined both the Common Agricultural Policy and national programmes across seven member states <span class="obs">(in practice)</span>.',restrictions:['A case opens on a written petition from Chinese industry alleging a subsidy, or on MOFCOM\'s own initiative in special circumstances where it already holds sufficient evidence of subsidy, injury, and a causal link (Article 18)','Provisional measures cannot be applied until 60 days after a case opens and then last no more than four months (Article 31); this is a harder cap than anti-dumping, which can run to nine','The investigation must conclude within 12 months, extendable by up to six more and no further (Article 27); the EU dairy case used that extension in full, running the maximum 18 months to February 2026 <span class="obs">(in practice)</span>','A case can close on an undertaking rather than a duty, and distinctively the exporting government itself may undertake to cancel or limit the subsidy, not just the exporter to raise prices (Article 32)'],retaliation:['Provisional duties or deposits at the border, then final duties lasting up to five years, extendable through review where lapsing would likely renew the subsidy and injury (Article 47)','On EU dairy, provisional rates of up to 42.7% in December 2025 were cut to 7.4% to 11.7% in the February 2026 final ruling <span class="obs">(in practice)</span>','Article 55 lets China take "corresponding measures" against any country or region that applies countervailing measures discriminatorily against Chinese exports','Sectors appear chosen for political effect in specific member states, dairy reaching Austria, Belgium, Croatia, Czechia, Finland, Italy, and Romania <span class="inf">(inferred)</span>'],remedies:'A party dissatisfied with a determination may apply for administrative reconsideration or sue in the People\'s Court (Article 52), the direct counterpart of Article 53 in the anti-dumping regulations.',source:{name:'Decree No. 402 and consolidated 2004 text — State Council Gazette',url:'https://www.gov.cn/gongbao/content/2004/content_62748.htm'},source2:{name:'MOFCOM Trade Remedy & Investigation Bureau',url:'https://trb.mofcom.gov.cn/'},source3:{name:'PRC Trade Remedy Laws, Regulations and Rules — US ITA collection',url:'https://enforcement.trade.gov/trcs/downloads/documents/china/index.html'},source4:{name:'China\'s anti-subsidy investigation into EU dairy — EU SME Centre',url:'https://www.eusmecentre.org.cn/publications/china-launches-an-anti-subsidy-investigation-into-dairy-imports-from-the-european-union/'},source5:{name:'Final EU dairy anti-subsidy ruling, February 2026 — Caixin Global',url:'https://www.caixinglobal.com/2026-02-13/china-to-impose-anti-subsidy-tariffs-of-up-to-117-on-eu-dairy-102414091.html'}},
  'https://www.chinalawtranslate.com/en/anti-monopoly-law-2022/':{title:'Merger Review under the Anti-Monopoly Law (2008, amended 2022)',subtitle:'SAMR State Anti-Monopoly Bureau · Thresholds revised January 2024',objective:'The Anti-Monopoly Law exists to prevent and restrain monopolistic practices and protect fair competition. Its merger control chapter requires any qualifying concentration to be declared and cleared before it closes, which hands SAMR a decision point over transactions anywhere in the world.',nodal:'The Law assigns unified enforcement to "the State Council anti-monopoly law enforcement agency" (Article 13) without naming it; in practice that is the State Administration for Market Regulation (SAMR). Its anti-monopoly arm was upgraded in November 2021 into a vice-ministerial State Anti-Monopoly Bureau, whose Second Enforcement Division handles merger review. A separate State Council Anti-Monopoly Committee sets policy, issues guidelines, and coordinates enforcement (Article 12). Since August 2025 SAMR has entrusted five provincial-level regulators with parts of some simplified cases, while keeping the decision itself.',scope:'Applies to every qualifying merger or acquisition regardless of nationality or where the deal closes: Article 2 extends the Law to conduct outside mainland China that eliminates or restricts competition in the Chinese market. A merger between two non-Chinese companies closing entirely abroad still needs clearance if the parties do enough business in China. Article 25 defines a concentration to cover not just mergers and share or asset acquisitions but gaining control or decisive influence "by contract or other means".',restrictions:['The concentration cannot be implemented before clearance (Article 26)','Combined worldwide turnover above RMB 12 billion, or combined China turnover above RMB 4 billion, in the previous year, and at least two parties each above RMB 800 million in China. These figures sit in the State Council\'s notification thresholds, doubled in January 2024, not in the Law itself (Article 26)','Below those thresholds SAMR may still require a filing, but only where evidence shows the deal has or may have the effect of eliminating or restricting competition: the text sets an evidentiary bar rather than leaving it to suspicion (Article 26)','Review runs 30 days at phase one, 90 at phase two, and up to 60 more by extension, so 180 days in all (Articles 30, 31); SAMR can also suspend the clock where a filing is incomplete, material new facts emerge, or the parties ask for time to negotiate remedies (Article 32)','Article 33 lists the factors weighed in review, and the fifth is the effect on "the development of the national economy"; Article 37 separately directs stronger scrutiny of deals touching the national economy and people\'s livelihood. This is the express statutory opening for industrial policy inside merger control'],retaliation:['Closing early brings unwinding orders and a fine of up to 10% of the previous year\'s turnover, but only where the deal harms competition; where it does not, the cap is RMB 5 million (Article 58), and Article 63 allows two to five times those amounts in especially serious cases','Clearance can carry "additional restrictive conditions" (Article 35), and this is where leverage gets extracted. Broadcom\'s VMware deal cleared in November 2023 only on conditions requiring VMware server software to interoperate with rival hardware and barring tying and bundling. Synopsys cleared its $35bn purchase of Ansys in July 2025, days after Washington lifted its curbs on chip design software, but had to divest its optical and photonic simulation business while Ansys divested power consumption analysis, alongside ten years of behavioural conditions <span class="obs">(in practice)</span>','Delay, not refusal, is the operative lever, and it works differently than it appears. Letting the clock expire would not kill a deal: Articles 30 and 31 both provide that if SAMR misses the deadline the parties may proceed. What sustains a review past the statutory limit is withdrawal and refiling, which restarts the period, and since 2022 the Article 32 power to suspend the clock for as long as the stated obstacle persists. Deals then die on the parties\' own contractual end dates, not on a regulatory ruling: Qualcomm and NXP refiled at the regulator\'s request in April 2018 and abandoned that July, paying $2bn; Applied Materials dropped Kokusai Electric in March 2021, paying $154m; DuPont scrapped its $5.2bn purchase of Rogers in November 2022, paying $162.5m; Intel left Tower Semiconductor in August 2023, paying $353m <span class="obs">(in practice)</span>','Conditions imposed years earlier can be reopened. SAMR cleared Nvidia\'s Mellanox acquisition in 2020 on six-year conditions: supply on fair, reasonable and non-discriminatory terms, let customers buy up to a year\'s stock at a time, and no bundling of GPUs with networking equipment. It opened an investigation on December 9, 2024, a week after Washington added 140 Chinese firms to its entity list, and in September 2025 announced a preliminary finding that Nvidia had breached both the Law and the 2020 conditions, days ahead of trade talks. No final penalty has been issued <span class="obs">(in practice)</span>'],remedies:'Prohibitions and conditional clearances can be contested, but only through mandatory administrative reconsideration first, and only then in court (Article 65). Where no decision ever issues there is nothing to appeal, which is what makes open-ended review the sharper instrument <span class="inf">(inferred)</span>.',source:{name:'Anti-Monopoly Law (2022 amendment) — China Law Translate',url:'https://www.chinalawtranslate.com/en/anti-monopoly-law-2022/'},source2:{name:'Anti-Monopoly Law — NPC Observer',url:'https://npcobserver.com/legislation/anti-monopoly-law/'},source3:{name:'China merger control: thresholds, phases and practice — ICLG',url:'https://iclg.com/practice-areas/merger-control-laws-and-regulations/china'},source4:{name:'Qualcomm and NXP withdraw and refile Chinese application, April 2018 — Qualcomm',url:'https://www.qualcomm.com/news/releases/2018/04/qualcomm-and-nxp-agree-mofcom-request-withdraw-and-refile-application'},source5:{name:'Applied Materials terminates Kokusai Electric acquisition, March 2021',url:'https://ir.appliedmaterials.com/news-releases/news-release-details/applied-materials-announces-termination-kokusai-electric/'},source6:{name:'Rogers announces termination of DuPont merger over SAMR approval, November 2022',url:'https://www.rogerscorp.com/news/2022/rogers-announces-termination-of-merger-agreement-with-dupont'},source7:{name:'Synopsys receives all approvals for Ansys acquisition, July 2025',url:'https://news.synopsys.com/2025-07-14-Synopsys-Receives-All-Necessary-Approvals-for-Proposed-Acquisition-of-Ansys'},source8:{name:'SAMR conditional approval of Broadcom and VMware, November 2023 — Digital Policy Alert',url:'https://digitalpolicyalert.org/event/15828-issued-samr-conditional-approval-of-broadcom-and-vmware-merger'},source9:{name:'SAMR preliminary finding that Nvidia breached the Anti-Monopoly Law, September 2025 — JURIST',url:'https://www.jurist.org/news/2025/09/china-finds-nvidia-violated-antimonopoly-law-in-preliminary-probe/'}},
  'https://trb.mofcom.gov.cn/':{title:'Foreign Trade Barrier Investigation Rules (2005)',subtitle:'MOFCOM Order No. 4 of 2005 · Effective March 1, 2005 · Under Foreign Trade Law Arts. 10 and 41',objective:'Gives China a domestic legal route to investigate another government\'s trade measures and respond to them. Where the anti-dumping and countervailing regulations target foreign firms, this instrument targets foreign states. The design mirrors the US Section 301 mechanism in reverse, providing a basis for graduated pressure that can be escalated or held in reserve <span class="inf">(inferred)</span>.',nodal:'The Ministry of Commerce (MOFCOM) is the sole authority that decides whether a foreign measure counts as a trade barrier. Article 2 assigns the work to the Bureau of Fair Trade for Imports and Exports, since reorganised as the Trade Remedy and Investigation Bureau.',scope:'Applies to any measure or practice taken or supported by a foreign government that MOFCOM finds to be a trade barrier under Article 3, on either of two limbs: it breaches, or fails to honour, a trade treaty or agreement both sides have joined; or it obstructs Chinese goods or services in that market or a third market, or damages their competitiveness. Since the Foreign Trade Law\'s 2026 revision the statutory language covers "trade-related barriers," which reaches investment barriers too.',restrictions:['An application from a domestic enterprise or industry, or from a body representing them (Article 5); the 2024 case against the EU came from the China Chamber of Commerce for Import and Export of Machinery and Electronic Products','MOFCOM opening a case on its own where it considers it necessary (Article 4), as it did against the United States in March 2026','The investigation must conclude within six months, extendable by up to three more (Article 32)'],retaliation:['Once a barrier is found, Article 33 directs MOFCOM to take one or more of three steps: bilateral consultations, initiating the
