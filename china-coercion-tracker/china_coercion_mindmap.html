  'https://www.gov.cn/zhengce/zhengceku/2022-01/04/content_5666430.htm':{title:'Cybersecurity Review Measures (2022)',subtitle:'CAC-led 13-department mechanism · Effective February 15, 2022',objective:['Screens procurement and data activity that could affect national security, before it happens','Its sharpest edge is Article 7, which makes an overseas listing conditional on clearance'],nodal:['Led by the Cyberspace Administration of China (CAC), with a review office housed there','Article 4 names a 13-department mechanism, including the NDRC, MIIT, public and state security, finance, commerce, the central bank, SAMR and the securities regulator'],scope:['Article 2: critical information infrastructure operators procuring network products or services, and network platform operators carrying out data processing, where national security is or may be affected','Article 7: a network platform operator holding the personal information of <strong>more than 1 million users must</strong> declare for review before listing abroad'],restrictions:['Review is declared before the activity proceeds, and Article 9 gives the office 10 working days to decide whether one is needed','A preliminary review runs 30 working days, extendable by 15 where complex (Article 11); a special review generally runs 90 working days and can be extended further (Article 14)','The elasticity is Article 15: time spent supplying additional materials does not count towards any of those periods'],retaliation:['A review can block a procurement or an overseas listing outright','Article 20 refers penalties out to the Cybersecurity Law and the Data Security Law rather than setting its own','DiDi was reviewed in 2021 and delisted from the New York Stock Exchange in 2022, then fined RMB 8.026 billion <span class="obs">(in practice)</span>','The procurement limb is live too: in August 2026 the CAC opened a review into Palo Alto Networks over products it sells in China, days after a fresh round of US export controls <span class="obs">(in practice)</span>'],remedies:'None. Article 18 allows a complaint that reviewers were not objective or leaked confidential information, but that is a conduct complaint, not a challenge to the outcome. The Measures provide no reconsideration or litigation route.',source:{name:'Cybersecurity Review Measures (2022) — gov.cn official text',url:'https://www.gov.cn/zhengce/zhengceku/2022-01/04/content_5666430.htm'},source2:{name:'CAC penalty decision on DiDi, July 2022',url:'https://www.cac.gov.cn/2022-07/07/c_1658811536396503.htm'}},
  'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2021/art_98677d0ed28b41b9adeff27b00c9d001.html':{title:'MOFCOM Blocking Statute — Order No. 1 of 2021',subtitle:'MOFCOM · Effective January 9, 2021',objective:['Blocks the effect inside China of foreign laws and measures that reach beyond their own borders and are improperly applied to Chinese parties','Rather than retaliating abroad, it makes compliance with the foreign measure unlawful at home','That is what puts affected companies between two legal systems'],nodal:['The Ministry of Commerce (MOFCOM) is the sole administering authority'],scope:['Chinese citizens, and Chinese companies and other organisations (Articles 1, 2, 5)','They must be affected by a foreign law or measure that reaches beyond that country’s own borders and is wrongly applied to them'],restrictions:['A party affected by a qualifying foreign measure must report it to MOFCOM within 30 days (Article 5)','Where MOFCOM issues a Prohibition Order, the specified foreign measure is "not to be recognised, not to be enforced, and not to be observed" inside China (Article 7); complying with it then becomes the violation','Triggering conduct includes receiving a foreign order with extraterritorial reach, such as a US Commerce Department Entity List designation or OFAC or EU sanctions, and taking any compliance step in response that affects a Chinese party'],retaliation:['A Chinese party harmed by another party\'s compliance with a barred foreign measure can sue that party for damages in a Chinese court (Article 9): enforcement runs largely through private litigation rather than state penalty','Significantly strengthened by Decree 835 in April 2026, which extends exposure to those who promote or assist a foreign measure and adds Malicious Entity List designation'],remedies:'The Rules provide for exemptions rather than appeals: a party may apply to MOFCOM for permission to comply with a prohibited foreign measure. No provision sets out a route to challenge a Prohibition Order itself <span class="inf">(inferred)</span>.',source:{name:'MOFCOM Order No. 1 of 2021 — MOFCOM English Portal',url:'https://english.mofcom.gov.cn/Policies/GeneralPolicies/art/2021/art_98677d0ed28b41b9adeff27b00c9d001.html'}},
  'https://www.gov.cn/zhengce/content/202604/content_7065398.htm':{title:'Regulations on Combating Unjustified Extraterritorial Jurisdiction (Decree 835)',subtitle:'Ministry of Justice + State Council · Effective April 7, 2026',objective:['Counters what China treats as improper extraterritorial jurisdiction by other states','Goes beyond the 2021 Blocking Statute: rather than only barring compliance, it reaches those who promote or help implement a foreign measure','And it attaches listing consequences to doing so'],nodal:['Administered by the State Council’s relevant departments','They identify which foreign measures are caught, and maintain the Malicious Entity List'],scope:['A major expansion of the 2021 Blocking Statute','Article 6 bars "any organization or individual" from executing or assisting a foreign measure the government identifies as improper extraterritorial jurisdiction','Article 8 extends Malicious Entity List exposure to those who "promote or participate in implementing" such a measure','That language is broad and unqualified, which is why commentators read it as potentially reaching lawyers, advisers, think tanks, lobbyists and research institutes, though the decree does not name these groups itself'],restrictions:['Executing, or assisting in executing, any foreign measure the government identifies as "improper extraterritorial jurisdiction" (Article 6); the text applies to "any organization or individual," with no exemption written in','Promoting or participating in implementing such a foreign measure, the trigger for Malicious Entity List designation (Article 8)','Refusing to cooperate with, or obstructing, an official inspection or document request once a suspected violation is under investigation (Article 12)'],retaliation:['Authorities can order corrections, or issue a binding order specifically prohibiting continued execution of the foreign measure (Article 13)','Non-compliance or evasion can bring further correction orders, bans on government procurement and bidding, and exit or entry restrictions on executives (Article 17)','Malicious Entity List designation under Article 8 carries a nine-head menu: refusing visas, denying entry, cancelling visas, ordering departure, deportation or expulsion; cancelling or restricting work, stay or residence status; sealing, seizing and freezing property in China; prohibiting or restricting parties in China from providing them data or personal information, or transacting with them; barring China-related import and export; barring investment in China; barring entry of their products and transport; fines; and other necessary measures. Every measure extends to organisations the listed party controls or helped establish and run','Violations that separately constitute a crime under other Chinese law carry criminal liability (Article 18); the decree does not itself create a standalone prison sentence'],remedies:'The decree contains no provision for appealing a designation or a prohibition order. Its enforcement articles run one way, from the authorities outward <span class="inf">(inferred)</span>.',source:{name:'Decree 835 — State Council Legislative Portal',url:'https://www.gov.cn/zhengce/content/202604/content_7065398.htm'},source2:{name:'Decree 835 Analysis — Morrison Foerster',url:'https://www.mofo.com/resources/insights/260420-china-issues-new-regulations-countering-foreign-states'}},
  'https://www.chinalawtranslate.com/en/foreigninvestmentsecurityreview/':{title:'Measures for the Security Review of Foreign Investment (2020)',subtitle:'NDRC + MOFCOM Order No. 37 of 2020 · Effective January 18, 2021',objective:['China’s inbound investment screen, made under the Foreign Investment Law and the National Security Law','Filing is mandatory and pre-closing: the investment cannot proceed until the office has ruled'],nodal:['Article 3 places the working mechanism’s office in the National Development and Reform Commission (NDRC), led jointly with the Ministry of Commerce (MOFCOM)','The office can also demand a filing from parties who did not make one'],scope:['<strong>Defence limb</strong> (Article 4(1)): military industry, ancillary equipment, other defence-related fields, and investment near military facilities. No ownership threshold applies','<strong>Sectoral limb</strong> (Article 4(2)): important agricultural products, energy and resources, equipment manufacturing, infrastructure, transport, cultural products and services, information technology and internet services, financial services, and key technologies. This limb bites <strong>only where the investor obtains actual control</strong>','Actual control means holding over 50% of shares, or holding less but with voting rights able to materially affect board or shareholder decisions, or otherwise having major influence over business decisions, personnel, finance or technology','Article 21 applies the Measures by reference to investors from Hong Kong, Macao and Taiwan'],restrictions:['Declare before investing; the office has 15 working days to decide whether a review is needed, and the parties must not proceed meanwhile (Article 7)','An ordinary review takes 30 days; if it raises concerns a special review follows, to be completed in 60 working days, extendable in special circumstances (Articles 8, 9). Time spent supplying materials is excluded','Three outcomes: cleared, prohibited, or cleared subject to conditions the parties have undertaken to accept (Article 9)'],retaliation:['A prohibited investment already carried out must be unwound: shares or assets disposed of within a set period and the prior state restored (Article 12)','Failing to declare brings an order to do so, and refusal brings forced disposal (Article 16). False or concealed information voids the decision (Article 17), and breaching conditions brings correction orders then disposal (Article 18)','Article 19 adds a negative credit record and joint punishment across government systems'],remedies:'None. The Measures set out decisions, conditions and enforcement, but contain no provision for administrative reconsideration or litigation against a security review decision <span class="inf">(inferred)</span>.',source:{name:'Measures for the Security Review of Foreign Investment — China Law Translate',url:'https://www.chinalawtranslate.com/en/foreigninvestmentsecurityreview/'}},
  'https://www.news.cn/politics/20260601/c501b3cd78034669a8dd442f659f2a20/c.html':{title:'State Council Regulations on Overseas Investment (Decree 837)',subtitle:'NDRC + MOFCOM · Effective July 1, 2026',objective:['Brings Chinese outbound investment under a single supervisory frame, sorted into encouraged, restricted and prohibited categories','Aims to stop capital and technology leaving in ways the state judges harmful','The only one of the three 2026 decrees whose own text sets out those tiers'],nodal:['Article 11 names the State Council’s "investment administration department" (conventionally the NDRC) and "commerce administration department" (MOFCOM)','They act with other relevant State Council departments to set outward investment policy and classify investments as encouraged, restricted or prohibited','The decree refers to them by function, not by name, which is why only the commerce side reads clearly on a first pass'],scope:['<strong>Who it covers</strong>: Chinese companies, other organisations, and individuals resident in China','<strong>What counts as outward investment</strong>: contributing money, equity, financing, or guarantees to gain ownership, control, or management rights over a company or asset in another country','<strong>Encouraged</strong>: investment that aligns with China\'s development priorities and brings in foreign technology or management know-how in non-sensitive sectors (Article 11)','<strong>Restricted</strong>: investment in sectors or technologies the government classifies as restricted, subject to approval and filing procedures; the decree does not name which department handles approval at the transaction level (Articles 11, 12)','<strong>Prohibited</strong>: investment in a category the government classifies as state-prohibited, or that transfers banned or restricted technology to another country (Articles 13, 27)'],restrictions:'<div style="font-size:9.5px;color:#94a3b8;font-style:italic;margin-bottom:9px;line-height:1.45;">Grounded in Articles 11, 12, 13, 23 and 27 of the decree.</div><div style="margin-bottom:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#c8102e;">Prohibited</div><ul style="margin:0 0 10px;"><li>Exporting or using state-prohibited goods, technology, or services as part of an outward investment (Article 13)</li><li>Transferring banned or restricted technology to another country, including via cross-border deployment of technical personnel or other methods (Article 13)</li><li>Investing in a category the government classifies as state-prohibited; violations can bring forced disposal of the assets (Article 27)</li></ul><div style="margin-bottom:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#2563eb;">Restricted</div><ul style="margin:0;"><li>Investment in sectors or technologies classified as restricted, as defined jointly by the NDRC and MOFCOM together with other relevant departments (Article 11)</li><li>Outward investment must comply with approval and filing ("&#26680;&#20934;&#22791;&#26696;") procedures; the decree does not specify which department handles this at the transaction level (Article 12)</li></ul>',retaliation:['Prohibited-category violations can bring forced cessation of the investment and forced disposal of the assets, plus fines of 0.5%-1% of the investment amount and RMB 50,000-100,000 fines on responsible individuals (Article 27)','Unapproved or falsely filed investments face fines starting at 0.1%-0.5% of the investment amount, rising to 0.5%-1% for continued non-compliance, plus RMB 20,000-50,000 fines on individuals, a three-year bar on new applications, or a one-to-three-year ban on investment activity (Article 27)','Security-review violations can bring fines, a one-to-three-year investment ban, and forced disposal of assets (Article 28)','MOFCOM can investigate, alone or with other departments, a foreign government\'s own barriers or discrimination against Chinese investors, and respond with policy adjustments, trade or technology export restrictions, or service-trade limits (Article 23)'],remedies:'The decree sets out penalties without prescribing a challenge route. Its enforcement articles, 27 to 29, describe what authorities may impose but say nothing about contesting those impositions <span class="inf">(inferred)</span>.',source:{name:'Decree 837 — Xinhua News Policy Portal',url:'https://www.news.cn/politics/20260601/c501b3cd78034669a8dd442f659f2a20/c.html'},source2:{name:'Decree 837 — State Council English Portal',url:'https://english.www.gov.cn/policies/latestreleases/202606/01/content_WS6a1d2e29c6d00ca5f9a0b59e.html'}},
  'https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm':{title:'Cross-Border Data Transfer Framework (PIPL / DSL, as relaxed in 2024)',subtitle:'CAC · Provisions on Promoting and Regulating Cross-Border Data Flows, Order No. 16, effective March 22, 2024',objective:['Governs how data leaves China, through three routes: a CAC security assessment, a standard contract, or certification','The March 2024 Provisions pulled the regime back sharply, exempting most ordinary business transfers'],nodal:['The Cyberspace Administration of China (CAC), with provincial offices handling filings','Sector regulators decide what counts as important data in their own field'],scope:['<strong>Exempt entirely</strong> (Articles 3 to 5): data containing neither personal information nor important data; foreign-collected data merely processed in China; transfers needed to perform a contract with the individual, such as bookings, remittances and visas; cross-border HR management; emergencies; and non-CIIO transfers of fewer than <strong>100,000</strong> people’s non-sensitive personal information since 1 January','<strong>Standard contract or certification</strong> (Article 8): 100,000 to 1 million people’s non-sensitive personal information, or under 10,000 sensitive','<strong>Security assessment</strong> (Article 7): important data; any transfer by a critical information infrastructure operator; or over 1 million non-sensitive, or 10,000 or more sensitive','Article 2 matters in practice: data is only treated as important once regulators have notified or publicly listed it, so handlers need not self-designate','Article 6 lets free trade zones write their own negative lists, with everything outside the list exempt'],restrictions:['A transfer in the assessment tier cannot proceed until the CAC has cleared it','A passed assessment is valid for 3 years, extendable by a further 3 on application within 60 working days of expiry (Article 9). The original Measures allowed 2 years'],retaliation:['Regulators can order transfers halted and data already sent abroad deleted','Penalties run through the Personal Information Protection Law and Data Security Law, reaching RMB 50 million or 5% of turnover at the top of the PIPL scale, with liability for responsible individuals'],remedies:'The Provisions set out mechanisms and thresholds but no route to contest a refused assessment. Recourse would have to come from general administrative law <span class="inf">(inferred)</span>.',source:{name:'Provisions on Promoting and Regulating Cross-Border Data Flows, CAC Order No. 16 (2024) — official text',url:'https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm'},source2:{name:'Measures for the Security Assessment of Data Exports (2022) — China Law Translate',url:'https://www.chinalawtranslate.com/en/exdata-export-security/'}},
  'https://www.chinalawtranslate.com/en/exdata-export-security/':{title:'Measures for the Security Assessment of Data Exports (2022)',subtitle:'CAC · Effective September 1, 2022 · Thresholds and validity revised by Order No. 16 of March 2024',objective:['The strictest of the three export routes: a case-by-case government assessment before data may leave','It is the mechanism the framework points to; the 2024 Provisions decide who lands in it'],nodal:['The Cyberspace Administration of China (CAC) runs the assessment, with filings made through provincial offices'],scope:['<strong>Current thresholds are the 2024 ones, not the 2022 ones</strong>: important data; any transfer by a critical information infrastructure operator; or, since 1 January of the year, over 1 million people’s non-sensitive personal information or 10,000 or more people’s sensitive personal information','The original 2022 trigger of 100,000 cumulative personal records now falls in the standard contract tier instead','The assessment covers the necessity of the transfer, the volume and sensitivity involved, the recipient’s safeguards, and the legal environment in the destination'],restrictions:['The assessment must be completed before the data moves, not after','A cleared assessment lasts 3 years, extendable by 3 more; a fresh assessment is required if the purpose, scope or recipient changes materially'],retaliation:['The CAC can refuse permission, which stops the transfer','Exporting without a required assessment is an unlawful cross-border transfer under the Data Security Law and Personal Information Protection Law, carrying their penalties'],remedies:'None in the Measures. There is no stated appeal against a refusal, and re-application rather than challenge is the practical route <span class="inf">(inferred)</span>.',source:{name:'Measures for the Security Assessment of Data Exports (2022) — China Law Translate',url:'https://www.chinalawtranslate.com/en/exdata-export-security/'},source2:{name:'Provisions on Promoting and Regulating Cross-Border Data Flows, CAC Order No. 16 (2024) — official text',url:'https://www.cac.gov.cn/2024-03/22/c_1712776611775634.htm'}},
  'https://www.gov.cn/gongbao/content/2004/content_62747.htm':{title:'Anti-Dumping Regulations of the PRC (2001, revised 2004)',subtitle:'State Council Decree No. 328, revised by Decree No. 401 · Effective June 1, 2004',objective:['Formulated under the Foreign Trade Law to maintain foreign trade order and fair competition (Article 1)','Lets China impose duties on imports sold below their normal value, where that dumping causes material injury to a domestic industry, threatens such injury, or materially retards one being established'],nodal:['MOFCOM investigates and determines both the dumping (Article 3) and the injury (Article 7)','Where agricultural products are involved, the injury investigation is run jointly with the Ministry of Agriculture','MOFCOM proposes the duty, the Customs Tariff Commission of the State Council decides it, MOFCOM announces it, and Customs collects it at the border (Article 38)'],scope:['Reaches any imported product, with no sector excluded. In practice agriculture, food and drink, chemicals, cars and consumer goods have been targeted most often','<strong>Dumping</strong>: an export price below the product’s normal value, normal value being the comparable price in the exporting market or, failing that, a third-country price or constructed cost plus reasonable expenses and profit','<strong>Injury</strong>: material injury, the threat of it, or material retardation of a new domestic industry','<strong>Domestic industry</strong>: the producers whose combined output makes up a major proportion of national output'],restrictions:['A case opens only on a written petition by or on behalf of the domestic industry; producers backing it must represent more than 50% of the output of those taking a position, and no case can open where supporters hold under 25% of total domestic output (Article 17)','MOFCOM may open a case on its own in special circumstances, but only where it already holds sufficient evidence of dumping, injury, and a causal link between them (Article 18)','Provisional measures cannot be applied until 60 days after a case opens, and then last up to four months, extendable to nine (Article 30); the investigation itself must conclude within 12 months, extendable by up to six more (Article 26)','Collecting the duty must accord with the public interest (Article 37), and public interest can also justify suspending or terminating an investigation outright (Article 33)','An exporter can avoid duties by offering a price undertaking, a commitment to raise prices or stop exporting at dumped prices, which MOFCOM may accept (Article 31)'],retaliation:['Provisional duties or cash deposits at the border, then final duties lasting up to five years, extendable through sunset review where lapsing would likely renew the dumping and injury (Article 48)','Documented rates reached 73.6% on Australian barley in 2020, alongside a separate 6.9% countervailing duty, and 116.2% to 218.4% on Australian wine from March 2021 <span class="obs">(in practice)</span>','Article 56 lets China take "corresponding measures" against any country or region that applies anti-dumping measures discriminatorily against Chinese exports: a reciprocity hook written into the regulation itself','Duties have ended through negotiation rather than adjudication: Australia took both the barley and wine measures to the WTO, and both disputes closed by mutually agreed solution, in 2023 and in March 2024, with no panel ruling on the merits <span class="obs">(in practice)</span>'],remedies:'A party dissatisfied with a final determination, with a decision to impose, backdate or refund duty, or with a review finding, may apply for administrative reconsideration or sue in the People\'s Court (Article 53). In practice trade remedy cases are heard only by the Beijing No. 2 Intermediate People\'s Court, with appeal to the Beijing Higher People\'s Court.',source:{name:'Decree No. 401 and consolidated 2004 text — State Council Gazette',url:'https://www.gov.cn/gongbao/content/2004/content_62747.htm'},source2:{name:'Anti-Dumping Regulations (2004 revision) — MOFCOM law database',url:'https://policy.mofcom.gov.cn/claw/clawContent.shtml?id=41551'},source3:{name:'MOFCOM Trade Remedy & Investigation Bureau',url:'https://trb.mofcom.gov.cn/'},source4:{name:'WTO DS598 — China: AD and CVD Measures on Barley from Australia',url:'https://www.wto.org/english/tratop_e/dispu_e/cases_e/ds598_e.htm'},source5:{name:'WTO DS602 — China: AD and CVD Measures on Wine from Australia',url:'https://www.wto.org/english/tratop_e/dispu_e/cases_e/ds602_e.htm'}},
  'https://www.gov.cn/gongbao/content/2004/content_62748.htm':{title:'Countervailing Duty Regulations of the PRC (2001, revised 2004)',subtitle:'State Council Decree No. 329, revised by Decree No. 402 · Effective June 1, 2004',objective:['The subsidy counterpart to the Anti-Dumping Regulations, formulated under the same Foreign Trade Law authority','Lets China impose duties on imports benefiting from a foreign government subsidy where those imports injure a domestic industry','The target is a foreign state’s support programme rather than a company’s pricing'],nodal:['MOFCOM investigates and determines both the subsidy (Article 5) and the injury (Article 7)','Where agricultural products are involved, the injury investigation is run jointly with the Ministry of Agriculture','MOFCOM proposes the duty, the Customs Tariff Commission of the State Council decides it, and MOFCOM announces it (Article 39)'],scope:['Imported products benefiting from a subsidy granted by a foreign government or public body, where those imports harm a Chinese industry','Runs the same procedural track as the Anti-Dumping Regulations, and the two are often run in parallel against the same product','Reach can extend to an entire policy architecture rather than a single scheme: the EU dairy case examined both the Common Agricultural Policy and national programmes across seven member states <span class="obs">(in practice)</span>'],restrictions:['A case opens on a written petition from Chinese industry alleging a subsidy, or on MOFCOM\'s own initiative in special circumstances where it already holds sufficient evidence of subsidy, injury, and a causal link (Article 18)','Provisional measures cannot be applied until 60 days after a case opens and then last no more than four months (Article 31); this is a harder cap than anti-dumping, which can run to nine','The investigation must conclude within 12 months, extendable by up to six more and no further (Article 27); the EU dairy case used that extension in full, running the maximum 18 months to February 2026 <span class="obs">(in practice)</span>','A case can close on an undertaking rather than a duty, and distinctively the exporting government itself may undertake to cancel or limit the subsidy, not just the exporter to raise prices (Article 32)'],retaliation:['Provisional duties or deposits at the border, then final duties lasting up to five years, extendable through review where lapsing would likely renew the subsidy and injury (Article 47)','On EU dairy, provisional rates of up to 42.7% in December 2025 were cut to 7.4% to 11.7% in the February 2026 final ruling <span class="obs">(in practice)</span>','Article 55 lets China take "corresponding measures" against any country or region that applies countervailing measures discriminatorily against Chinese exports','Sectors appear chosen for political effect in specific member states, dairy reaching Austria, Belgium, Croatia, Czechia, Finland, Italy, and Romania <span class="inf">(inferred)</span>'],remedies:'A party dissatisfied with a determination may apply for administrative reconsideration or sue in the People\'s Court (Article 52), the direct counterpart of Article 53 in the anti-dumping regulations.',source:{name:'Decree No. 402 and consolidated 2004 text — State Council Gazette',url:'https://www.gov.cn/gongbao/content/2004/content_62748.htm'},source2:{name:'MOFCOM Trade Remedy & Investigation Bureau',url:'https://trb.mofcom.gov.cn/'},source3:{name:'PRC Trade Remedy Laws, Regulations and Rules — US ITA collection',url:'https://enforcement.trade.gov/trcs/downloads/documents/china/index.html'},source4:{name:'China\'s anti-subsidy investigation into EU dairy — EU SME Centre',url:'https://www.eusmecentre.org.cn/publications/china-launches-an-anti-subsidy-investigation-into-dairy-imports-from-the-european-union/'},source5:{name:'Final EU dairy anti-subsidy ruling, February 2026 — Caixin Global',url:'https://www.caixinglobal.com/2026-02-13/china-to-impose-anti-subsidy-tariffs-of-up-to-117-on-eu-dairy-102414091.html'}},
  'https://www.chinalawtranslate.com/en/anti-monopoly-law-2022/':{title:'Merger Review under the Anti-Monopoly Law (2008, amended 2022)',subtitle:'SAMR State Anti-Monopoly Bureau · Thresholds revised January 2024',objective:['The Anti-Monopoly Law exists to prevent and restrain monopolistic practices and protect fair competition','Its merger control chapter requires any qualifying concentration to be declared and cleared before it closes','That hands SAMR a decision point over transactions anywhere in the world'],nodal:['The Law assigns unified enforcement to "the State Council anti-monopoly law enforcement agency" (Article 13) without naming it; in practice that is the State Administration for Market Regulation (SAMR)','Its anti-monopoly arm was upgraded in November 2021 into a vice-ministerial State Anti-Monopoly Bureau, whose Second Enforcement Division handles merger review','A separate State Council Anti-Monopoly Committee sets policy, issues guidelines and coordinates enforcement (Article 12)','Since August 2025 SAMR has entrusted five provincial-level regulators with parts of some simplified cases, while keeping the decision itself'],scope:['Applies to every qualifying merger or acquisition regardless of nationality or where the deal closes','Article 2 extends the Law to conduct outside mainland China that eliminates or restricts competition in the Chinese market','A merger between two non-Chinese companies closing entirely abroad still needs clearance if the parties do enough business in China','Article 25 defines a <strong>concentration</strong> to cover not just mergers and share or asset acquisitions but gaining control or decisive influence "by contract or other means"'],restrictions:['The concentration cannot be implemented before clearance (Article 26)','Combined worldwide turnover above RMB 12 billion, or combined China turnover above RMB 4 billion, in the previous year, and at least two parties each above RMB 800 million in China. These figures sit in the State Council\'s notification thresholds, doubled in January 2024, not in the Law itself (Article 26)','Below those thresholds SAMR may still require a filing, but only where evidence shows the deal has or may have the effect of eliminating or restricting competition: the text sets an evidentiary bar rather than leaving it to suspicion (Article 26)','Review runs 30 days at phase one, 90 at phase two, and up to 60 more by extension, so 180 days in all (Articles 30, 31); SAMR can also suspend the clock where a filing is incomplete, material new facts emerge, or the parties ask for time to negotiate remedies (Article 32)','Article 33 lists the factors weighed in review, and the fifth is the effect on "the development of the national economy"; Article 37 separately directs stronger scrutiny of deals touching the national economy and people\'s livelihood. This is the express statutory opening for industrial policy inside merger control'],retaliation:['Closing early brings unwinding orders and a fine of up to 10% of the previous year\'s turnover, but only where the deal harms competition; where it does not, the cap is RMB 5 million (Article 58), and Article 63 allows two to five times those amounts in especially serious cases','Clearance can carry "additional restrictive conditions" (Article 35), and this is where leverage gets extracted. Broadcom\'s VMware deal cleared in November 2023 only on conditions requiring VMware server software to interoperate with rival hardware and barring tying and bundling. Synopsys cleared its $35bn purchase of Ansys in July 2025, days after Washington lifted its curbs on chip design software, but had to divest its optical and photonic simulation business while Ansys divested power consumption analysis, alongside ten years of behavioural conditions <span class="obs">(in practice)</span>','Delay, not refusal, is the operative lever, and it works differently than it appears. Letting the clock expire would not kill a deal: Articles 30 and 31 both provide that if SAMR misses the deadline the parties may proceed. What sustains a review past the statutory limit is withdrawal and refiling, which restarts the period, and since 2022 the Article 32 power to suspend the clock for as long as the stated obstacle persists. Deals then die on the parties\' own contractual end dates, not on a regulatory ruling: Qualcomm and NXP refiled at the regulator\'s request in April 2018 and abandoned that July, paying $2bn; Applied Materials dropped Kokusai Electric in March 2021, paying $154m; DuPont scrapped its $5.2bn purchase of Rogers in November 2022, paying $162.5m; Intel left Tower Semiconductor in August 2023, paying $353m <span class="obs">(in practice)</span>','Conditions imposed years earlier can be reopened. SAMR cleared Nvidia\'s Mellanox acquisition in 2020 on six-year conditions: supply on fair, reasonable and non-discriminatory terms, let customers buy up to a year\'s stock at a time, and no bundling of GPUs with networking equipment. It opened an investigation on December 9, 2024, a week after Washington added 140 Chinese firms to its entity list, and in September 2025 announced a preliminary finding that Nvidia had breached both the Law and the 2020 conditions, days ahead of trade talks. No final penalty has been issued <span class="obs">(in practice)</span>'],remedies:'Prohibitions and conditional clearances can be contested, but only through mandatory administrative reconsideration first, and only then in court (Article 65). Where no decision ever issues there is nothing to appeal, which is what makes open-ended review the sharper instrument <span class="inf">(inferred)</span>.',source:{name:'Anti-Monopoly Law (2022 amendment) — China Law Translate',url:'https://www.chinalawtranslate.com/en/anti-monopoly-law-2022/'},source2:{name:'Anti-Monopoly Law — NPC Observer',url:'https://npcobserver.com/legislation/anti-monopoly-law/'},source3:{name:'China merger control: thresholds, phases and practice — ICLG',url:'https://iclg.com/practice-areas/merger-control-laws-and-regulations/china'},source4:{name:'Qualcomm and NXP withdraw and refile Chinese application, April 2018 — Qualcomm',url:'https://www.qualcomm.com/news/releases/2018/04/qualcomm-and-nxp-agree-mofcom-request-withdraw-and-refile-application'},source5:{name:'Applied Materials terminates Kokusai Electric acquisition, March 2021',url:'https://ir.appliedmaterials.com/news-releases/news-release-details/applied-materials-announces-termination-kokusai-electric/'},source6:{name:'Rogers announces termination of DuPont merger over SAMR approval, November 2022',url:'https://www.rogerscorp.com/news/2022/rogers-announces-termination-of-merger-agreement-with-dupont'},source7:{name:'Synopsys receives all approvals for Ansys acquisition, July 2025',url:'https://news.synopsys.com/2025-07-14-Synopsys-Receives-All-Necessary-Approvals-for-Proposed-Acquisition-of-Ansys'},source8:{name:'SAMR conditional approval of Broadcom and VMware, November 2023 — Digital Policy Alert',url:'https://digitalpolicyalert.org/event/15828-issued-samr-conditional-approval-of-broadcom-and-vmware-merger'},source9:{name:'SAMR preliminary finding that Nvidia breached the Anti-Monopoly Law, September 2025 — JURIST',url:'https://www.jurist.org/news/2025/09/china-finds-nvidia-violated-antimonopoly-law-in-preliminary-probe/'}},
  'https://trb.mofcom.gov.cn/':{title:'Foreign Trade Barrier Investigation Rules (2005)',subtitle:'MOFCOM Order No. 4 of 2005 · Effective March 1, 2005 · Under Foreign Trade Law Arts. 10 and 41',objective:['Gives China a domestic legal route to investigate another government’s trade measures and respond to them','Where the anti-dumping and countervailing regulations target foreign firms, this instrument targets foreign states','The design mirrors the US Section 301 mechanism in reverse, providing a basis for graduated pressure that can be escalated or held in reserve <span class="inf">(inferred)</span>'],nodal:['The Ministry of Commerce (MOFCOM) is the sole authority that decides whether a foreign measure counts as a trade barrier','Article 2 assigns the work to the Bureau of Fair Trade for Imports and Exports, since reorganised as the Trade Remedy and Investigation Bureau'],scope:['Any measure or practice taken or supported by a foreign government that MOFCOM finds to be a trade barrier under Article 3, on either of two limbs','<strong>First limb</strong>: it breaches, or fails to honour, a trade treaty or agreement both sides have joined','<strong>Second limb</strong>: it obstructs Chinese goods or services in that market or a third market, or damages their competitiveness','Since the Foreign Trade Law’s 2026 revision the statutory language covers "trade-related barriers", which reaches investment barriers too'],restrictions:['An application from a domestic enterprise or industry, or from a body representing them (Article 5); the 2024 case against the EU came from the China Chamber of Commerce for Import and Export of Machinery and Electronic Products','MOFCOM opening a case on its own where it considers it necessary (Article 4), as it did against the United States in March 2026','The investigation must conclude within six months, extendable by up to three more (Article 32)'],retaliation:['Once a barrier is found, Article 33 directs MOFCOM to take one or more of three steps: bilateral consultations, initiating the multilateral dispute settlement mechanism, or "other appropriate measures". The WTO route is an express option, not one the Rules bypass; it is the open-ended third limb that carries the coercive potential','Against Taiwan, a 2023 investigation found trade barriers in December 2023, after which the Customs Tariff Commission suspended cross-strait tariff concessions on 12 products from January 2024 and a further 134 tariff lines from June 2024 <span class="obs">(in practice)</span>','Against the EU, a trade and investment barrier investigation opened in July 2024 into the bloc\'s Foreign Subsidies Regulation; MOFCOM found barriers in January 2025 and called for bilateral consultations rather than retaliating. It ran on a separate track from the brandy, pork, and dairy trade remedy cases <span class="obs">(in practice)</span>','Against the United States, MOFCOM self-initiated an investigation in March 2026 into practices said to disrupt global supply chains, naming restrictions on Chinese goods entering the US market, on high-technology exports to China, and on two-way investment in key sectors; that case is still open <span class="obs">(in practice)</span>'],remedies:'None provided. Unlike the anti-dumping and countervailing regulations, which each expressly allow administrative reconsideration and suit in the People\'s Court, these Rules contain no such provision. A trade barrier finding is not reviewable.',source:{name:'MOFCOM Trade Remedy & Investigation Bureau',url:'https://trb.mofcom.gov.cn/'},source2:{name:'Foreign Trade Barrier Investigation Rules — full text, UIBE international economic law database',url:'https://ielaw.uibe.edu.cn/fgal/zgswfl/xzfg/dwmy/18124.htm'},source3:{name:'Foreign Trade Law (2025 revision, effective March 1, 2026) — MOFCOM',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2025/art_03fbae1ec4bd48459099930e803bce5e.html'},source4:{name:'MOFCOM Announcement No. 17 of 2026 — trade barrier investigation into US supply chain practices',url:'https://www.mofcom.gov.cn/zwgk/zcfb/art/2026/art_a87743853da94b22ace113ee98591fa5.html'},source5:{name:'MOFCOM final determination on the EU Foreign Subsidies Regulation — Cleary Gottlieb',url:'https://www.clearytradewatch.com/2025/02/mofcom-issues-final-determination-on-trade-and-investment-barrier-investigation-into-the-eus-foreign-subsidies-regulation/'}}
};

/* ── INIT MAP ── */
const isEmbed = new URLSearchParams(window.location.search).get('embed') === '1';

const me = new MindElixir({
  el:'#map',
  direction:MindElixir.SIDE,
  draggable: !isEmbed,
  contextMenu:false,
  toolBar:false,
  nodeMenu:false,
  keypress:false,
  before:{ beginEdit(){ return false; } }
});
me.init(DATA);

const mapEl = document.getElementById('map');

// Bounding box (screen coords) of all rendered nodes
function nodesBBox(){
  const topics = mapEl.querySelectorAll('me-tpc');
  if (!topics.length) return null;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  topics.forEach(t=>{
    const r = t.getBoundingClientRect();
    minX=Math.min(minX,r.left);  minY=Math.min(minY,r.top);
    maxX=Math.max(maxX,r.right);  maxY=Math.max(maxY,r.bottom);
  });
  return {minX,minY,maxX,maxY,w:maxX-minX,h:maxY-minY,cx:(minX+maxX)/2,cy:(minY+maxY)/2};
}

// Find the element mind-elixir applies its pan/zoom transform to
function transformedEl(){
  const kids = mapEl.querySelectorAll('*');
  for (const el of kids){
    const t = getComputedStyle(el).transform;
    if (t && t.indexOf('matrix') === 0) return el;
  }
  return null;
}

// Scale the map to fit the viewport, then center the CONTENT (not just the root)
function fitMap(){
  try {
    me.scale(1);
    const nat = nodesBBox();
    if (!nat || nat.w<=0 || nat.h<=0) return;
    const cw = mapEl.clientWidth, ch = mapEl.clientHeight;
    const scale = Math.min(cw/nat.w, ch/nat.h) * 0.9;
    me.scale(scale);
    me.toCenter();

    // Content-center: nudge the transform so the node bbox sits dead-centre
    const el = transformedEl();
    const box = nodesBBox();
    if (el && box){
      const m = new DOMMatrixReadOnly(getComputedStyle(el).transform);
      const mapRect = mapEl.getBoundingClientRect();
      const dx = (mapRect.left + cw/2) - box.cx;
      const dy = (mapRect.top + ch/2) - box.cy;
      el.style.transform = `matrix(${m.a},${m.b},${m.c},${m.d},${m.e+dx},${m.f+dy})`;
    }
  } catch(e){}
}

if (isEmbed) {
  // Hide floating UI not needed in embed
  document.querySelectorAll('.map-title').forEach(el=>el.style.display='none');

  // Kill drag-to-pan on map background. Allow: node clicks, link clicks, popup interactions.
  ['pointerdown','mousedown','touchstart'].forEach(evt=>{
    window.addEventListener(evt, function(e){
      if (!e.target.closest('me-tpc') &&
          !e.target.closest('a[href]') &&
          !e.target.closest('#popup-overlay')) {
        e.preventDefault(); e.stopPropagation();
      }
    }, {capture:true, passive:false});
  });

  // Kill mobile drag: block touchmove/pointermove on the map so a touch that
  // started on a node can't be dragged into a pan. Allow moves inside the popup
  // so the popup card remains scrollable.
  ['touchmove','pointermove'].forEach(evt=>{
    window.addEventListener(evt, function(e){
      if (!e.target.closest('#popup-overlay')) {
        e.preventDefault(); e.stopPropagation();
      }
    }, {capture:true, passive:false});
  });

  // Kill scroll-zoom: forward wheel delta to parent page so it can still scroll.
  window.addEventListener('wheel', function(e){
    e.preventDefault(); e.stopPropagation();
    try { window.parent.postMessage({type:'wheel', deltaX:e.deltaX, deltaY:e.deltaY}, '*'); } catch(_){}
  }, {capture:true, passive:false});
}

// Both modes: fit the whole map into view on load (full screen keeps drag/zoom)
setTimeout(fitMap, 350);
setTimeout(fitMap, 800);
setTimeout(fitMap, 1400);
window.addEventListener('resize', fitMap);

/* Prevent double-click edit */
document.getElementById('map').addEventListener('dblclick', e=>{
  e.stopImmediatePropagation(); e.preventDefault();
}, true);

/* ── KEEP THE MAP STATIONARY ──
   mind-elixir selects and focuses a node on click. The browser then scrolls the
   focused element into view, which shifts the map, and nothing puts it back when
   the popup closes. Snapshot the scroll offsets and the pan/zoom transform on
   pointerdown, suppress the focus that causes the shift, and restore afterwards. */
let mapLock = null;

function captureMapLock(){
  const el = transformedEl();
  mapLock = {
    el,
    sl: mapEl.scrollLeft,
    st: mapEl.scrollTop,
    transform: el ? el.style.transform : null
  };
}

function restoreMapLock(){
  if (!mapLock) return;
  mapEl.scrollLeft = mapLock.sl;
  mapEl.scrollTop  = mapLock.st;
  if (mapLock.el && mapLock.transform) mapLock.el.style.transform = mapLock.transform;
}

/* Suppress the focus that makes the container scroll, and stop mind-elixir
   selecting or panning. preventDefault goes on mousedown only: on pointerdown it
   would cancel the compatibility mouse events and the click would never fire. */
['pointerdown','mousedown'].forEach(evt=>{
  mapEl.addEventListener(evt, function(e){
    if (e.target.closest('me-tpc')){
      captureMapLock();
      if (e.type === 'mousedown') e.preventDefault();
      e.stopPropagation();
    }
  }, true);
});

/* Belt and braces: if anything still scrolls the container, put it back. */
mapEl.addEventListener('scroll', function(){
  if (mapLock) restoreMapLock();
}, true);

/* ── CLICK HANDLER ── */
document.getElementById('map').addEventListener('click', function(e){
  if(document.getElementById('popup-overlay').classList.contains('open')) return;
  const anchor = e.target.closest('a[href]');
  if(anchor){ const h=anchor.getAttribute('href'); if(h&&POPUP_DATA[h]){ e.preventDefault(); e.stopPropagation(); showPopup(POPUP_DATA[h]); return; } }
  const tpc = e.target.closest('me-tpc');
  if(tpc){ const n=tpc.nodeObj; if(n&&n.hyperLink&&POPUP_DATA[n.hyperLink]){ e.preventDefault(); e.stopPropagation(); showPopup(POPUP_DATA[n.hyperLink]); } }
}, true);

/* ── POPUP ── */
function showPopup(d){
  document.getElementById('popup-title').textContent=d.title;
  document.getElementById('popup-subtitle').textContent=d.subtitle;
  /* Fields 1-5 are the standard schema: objective, scope, restrictions, retaliation, remedies.
     nodal sits second to name the administering body. trigger/prohibitions/action are the
     older shape, kept so instruments not yet migrated still render. */
  const rows=[
    {lbl:'Objective',val:d.objective},
    {lbl:'Nodal Authority',val:d.nodal},
    {lbl:'Scope',val:d.scope},
    {lbl:'Trigger',val:d.trigger},
    {lbl:'Coercive Requirements & Prohibitions',val:d.restrictions},
    {lbl:'Prohibitions & Restrictions',val:d.prohibitions},
    {lbl:'Retaliatory Measures',val:d.retaliation},
    {lbl:'Action / Remedies',val:d.action},
    {lbl:'Remedies Against the Decision',val:d.remedies}
  ].filter(r=>r.val);
  document.getElementById('popup-struct').innerHTML=rows.map(r=>`<div class="popup-row"><div class="popup-rlbl">${r.lbl}</div><div class="popup-rval">${Array.isArray(r.val)?`<ul>${r.val.map(v=>`<li>${v}</li>`).join('')}</ul>`:r.val}</div></div>`).join('');
  const _srcs=[d.source,d.source2,d.source3,d.source4,d.source5,d.source6,d.source7,d.source8,d.source9].filter(Boolean);document.getElementById('popup-source').innerHTML=`<span class="popup-source-lbl">Source${_srcs.length>1?'s':''}</span><div style="display:flex;flex-direction:column;gap:3px;">${_srcs.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${s.name} ↗</a>`).join('')}</div>`;
  document.getElementById('popup-overlay').classList.add('open');
  /* The map must be exactly where it was when the popup opened. */
  requestAnimationFrame(restoreMapLock);
  setTimeout(restoreMapLock, 60);
}
function closePopup(){
  document.getElementById('popup-overlay').classList.remove('open');
  restoreMapLock();
  requestAnimationFrame(restoreMapLock);
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePopup(); });


window.closePopup=closePopup;
</script>
</body>
</html>
